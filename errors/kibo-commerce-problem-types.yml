problems:
- status: 400
  title: Bad Request
  type: MISSING_OR_INVALID_PARAMETER
  description: The request could not be understood by the server due to malformed syntax; the request did not validate due to missing required parameters or invalid parameter values.
  remediation: Do not repeat the request without modifications.
- status: 401
  title: Unauthorized
  type: INVALID_ACCESS_TOKEN
  description: Authorization has been refused for those credentials.
  remediation: Check authentication credentials and tokens.
- status: 403
  title: Forbidden
  type: FORBIDDEN
  description: The system does not allow the action. The server understood the request, but is refusing to fulfill it.
  remediation: Authorization will not help and the request should not be repeated.
- status: 404
  title: Not Found
  type: ITEM_NOT_FOUND
  description: The requested resource could not be found.
  remediation: Check resource identifiers and paths.
- status: 409
  title: Conflict
  type: VALIDATION_CONFLICT
  description: Indicates a request conflict with current state of the server.
  remediation: Resolve the conflict before retrying.
- status: 429
  title: Too Many Requests
  type: PLAN_LIMIT_EXCEEDED
  description: Indicates that you have sent too many requests in a given amount of time.
  remediation: Wait for rate limit to reset as indicated by Retry-After header.
- status: 500
  title: Internal Server Error
  type: UNEXPECTED_ERROR
  description: An unexpected condition was encountered and no more specific message is suitable.
  remediation: Contact support if issue persists.
- status: 503
  title: Service Unavailable
  type: SYSTEM_MAINTENANCE
  description: The server is currently unavailable.
  remediation: Wait for service to be restored.
note: Error codes and descriptions extracted from Kibo documentation. Some errors have string status types (e.g., MISSING_OR_INVALID_PARAMETER) rather than numeric codes.