generated: '2026-10-18'
method: probed
status: official
source: https://docs.kibocommerce.com/pages/kibo-mcp-server
name: Kibo Commerce MCP servers
description: 'Kibo publishes two hosted MCP servers: the Commerce MCP Server, a tenant-hosted HTTP endpoint
  at https://{host}/mcp/admin/{toolCategories?} exposing 500+ admin/runtime API operations filtered by
  tool category (documented; gated by tenant credentials), and the Kibo Documentation MCP server at https://docs.kibocommerce.com/mcp
  (probed live, open).'
deployment:
  mode: remote
  endpoint: https://docs.kibocommerce.com/mcp
  auth: none
  verified: probed
  checked: '2026-10-18'
  note: The probed endpoint is the documentation server. The Commerce MCP Server is per-tenant (endpoint
    pattern https://{host}/mcp/admin/{toolCategories?}, e.g. https://t1000000-s12345.sb.usc1.gcp.kibocommerce.com/mcp/admin/)
    with Basic (applicationKey:clientSecret) or Bearer JWT auth; no tenant URL is public, so it is recorded
    as documented, not probed.
servers:
- name: Kibo Commerce MCP Server
  transport: streamable-http
  endpoint_pattern: https://{host}/mcp/admin/{toolCategories?}
  example_endpoints:
  - https://t1000000-s12345.sb.usc1.gcp.kibocommerce.com/mcp/admin/
  - https://t1000000.sb.usc1.gcp.kibocommerce.com/mcp/admin/
  auth:
    schemes:
    - basic
    - bearer
    basic: Base64(applicationKey:clientSecret) from Kibo Dev Center
    bearer: JWT access token from the Kibo API OAuth flow
  verified: searched
  source: https://docs.kibocommerce.com/pages/kibo-mcp-server
  probe:
    url: https://t1000000.sb.usc1.gcp.kibocommerce.com/mcp/admin/
    status: 404
    body: 'ReverseProxy ITEM_NOT_FOUND "Item not found: Tenant" -- the docs example tenant does not exist;
      a real tenant host is required'
    date: '2026-10-18'
  tool_count: 500+ (documented; individual tool names are not published, only categories)
