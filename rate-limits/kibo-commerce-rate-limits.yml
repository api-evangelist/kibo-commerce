headers:
- name: Retry-After
  description: The remaining rejection time in seconds to wait before placing another request
  values: 60, 900, 1800, 2700, 3600
  note: Corresponds to 1 minute, 15 minutes, 30 minutes, 45 minutes, and 60 minutes
status_code: 429
note: Rate limits vary by environment (sandbox, pre-prod, production) and by API route. Sandbox limits apply per developer account across all sandboxes, while production limits apply per tenant. Most APIs have 500 RPM / 10000 RPH limits. Limits return HTTP 429 with Retry-After header.