      description: Use this operation to clone an existing package.
      parameters:
      - description: ''
        in: path
        name: applicationKey
        required: true
        schema:
          type: string
      - description: ''
        in: path
        name: packageName
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
            text/json:
              schema:
                $ref: '#/components/schemas/Package'
            text/plain:
              schema:
                $ref: '#/components/schemas/Package'
          description: OK
      summary: Clone Package
      tags:
      - Package
      operationId: postPlatformAppdevApppackagesByApplicationKeyCloneByPackageName
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
