components:
  schemas:
    CatalogAdminsTag:
      description: A generic tag that can be used for any purpose.
      properties:
        tagCode:
          description: A unique code per catalog. Limit 500 characters.
          minLength: 1
          type: string
        tagName:
          description: Readonly and computed from TagCode. If using hierarchical tag-codes, only the last node
          readOnly: true
          type:
          - string
          - 'null'
        tagPath:
          description: Readonly and computed from TagCode. If using hierarchical tag-codes, the node path without the TagName
          readOnly: true
          type:
          - string
          - 'null'
      required:
      - tagCode
      type: object
    TagCollection:
      description: Collection of Tags returned as a whole. A collection is not paged.
      properties:
        items:
          items:
            $ref: '#/components/schemas/CatalogAdminsTag'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    TagNode:
      properties:
        children:
          items:
            type: object
          type:
          - array
          - 'null'
        isRoot:
          type: boolean
        tagCode:
          type:
          - string
          - 'null'
        tagName:
          type:
          - string
          - 'null'
        tagPath:
          type:
          - string
          - 'null'
      type: object
    TagNodeTree:
      description: Hierarchical tree for Tags
      properties:
        items:
          $ref: '#/components/schemas/TagNode'
        success:
          type: boolean
        total:
          format: int32
          type: integer
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
