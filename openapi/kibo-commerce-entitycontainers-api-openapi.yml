components:
  schemas:
    EntityContainer:
      description: The metadata and Entity contents for an entity persisted in an EntityList in MZDB. The Item property contains the json representation of the Entity
      properties:
        catalogId:
          format: int32
          type:
          - integer
          - 'null'
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type: string
        id:
          description: The unique identifier for the Entity.
          type:
          - string
          - 'null'
        item:
          description: The entity in json format.
          type:
          - object
          - 'null'
        listFullName:
          description: The nameSpace and name for the EntityList in the format name@nameSpace.
          type:
          - string
          - 'null'
        localeCode:
          description: The localeCode for the Entity. This will only be populated for EntityLists that are created with IsLocaleSpecific set to true.
          type:
          - string
          - 'null'
        masterCatalogId:
          format: int32
          type:
          - integer
          - 'null'
        siteId:
          format: int32
          type:
          - integer
          - 'null'
        tenantId:
          format: int32
          type: integer
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type: string
        userId:
          description: The userId of the shopper account associated with this Entity. This will only be populated for EntityLists that are creaetd with IsShopperSpecific set to true.
          type:
          - string
          - 'null'
      type: object
    EntityContainerCollection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/EntityContainer'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
