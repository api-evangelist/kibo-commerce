paths:
  /platform/tenants/{tenantId}:
    get:
      description: Retrieve information about a tenant. The attributes object will contain flags indicating whether or not certain features are enabled on the tenant. Kibo employees can reference this internal-only documentation for a list of all attributes.
      parameters:
      - description: ''
        in: path
        name: tenantId
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
            text/json:
              schema:
                $ref: '#/components/schemas/Tenant'
            text/plain:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: OK
      summary: Get Tenant by ID
      tags:
      - Tenants
      operationId: getPlatformTenantsByTenantId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
