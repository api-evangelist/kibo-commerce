openapi: 3.2.0
info:
  title: Kibo Commerce Subscription Settings API
  version: '1.0'
  description: 'Operations tagged SubscriptionSettings across 2 of this provider''s published API definitions: openapi_openapi_settings.json, kibo-commerce-settings-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: SubscriptionSettings
paths:
  /commerce/settings/subscription/subscriptionsettings:
    get:
      description: Retrieves existing subscription settings for a site
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSettings'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSettings'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionSettings'
          description: OK
      summary: Get Subscription Settings
      tags:
      - SubscriptionSettings
      operationId: getCommerceSettingsSubscriptionSubscriptionsettings
      x-operation-id-source: derived
    post:
      description: Creates new subscription settings for a site
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionSettings'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSettings'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSettings'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionSettings'
          description: OK
      summary: Create Subscription Settings
      tags:
      - SubscriptionSettings
      operationId: postCommerceSettingsSubscriptionSubscriptionsettings
      x-operation-id-source: derived
    put:
      description: Modifies existing subscription settings for a site
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionSettings'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSettings'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSettings'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionSettings'
          description: OK
      summary: Update Subscription Settings
      tags:
      - SubscriptionSettings
      operationId: putCommerceSettingsSubscriptionSubscriptionsettings
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    SubscriptionSettings:
      description: Subscription settings defined or this site
      properties:
        applyBestPriceOnContinuityOrder:
          type:
          - boolean
          - 'null'
        applyLatestItemPriceOnContinuityOrder:
          description: If this setting is enabled, the item price on the continuity order will be updated to the current price upon creation.
          type:
          - boolean
          - 'null'
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        continuityOrderDateOffset:
          description: Specifies the number of days before the next order date to create the continuity order.
          format: int32
          type: integer
        nextOrderDateOffset:
          description: Specifies the number of days to update the next order date from existing next order date.
          format: int32
          type:
          - integer
          - 'null'
        orderNowResetNextOrderDate:
          description: Specifies if order now action resets next order date
          type:
          - boolean
          - 'null'
        pauseSubscriptionOffset:
          description: Specifies the number of continuity orders should be placed before activating the subscription.
          format: int32
          type:
          - integer
          - 'null'
        restrictOrderNowOffset:
          description: Specifies the number of days, `order all items now` or `order partial items now` actions cannot be repeated from the last action.
          format: int32
          type:
          - integer
          - 'null'
        skipSubscriptionOffset:
          description: Specifies the number of times the subscription can be skipped
          format: int32
          type:
          - integer
          - 'null'
        subscriptionOrderReminderOffset:
          description: Specifies the number of days to send subscription order reminder email before the next continuity order.
          format: int32
          type:
          - integer
          - 'null'
        subscriptionPauseLimitReminderOffset:
          description: "Specifies the number of days prior to when we need to send a \n\"subscription pause limit reached reminder\" email before the pause limit is reached."
          format: int32
          type:
          - integer
          - 'null'
        subscriptionPausedReminderOffset:
          description: Specifies the number of days to send subscription paused reminder email.
          format: int32
          type:
          - integer
          - 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_settings.json
- kibo-commerce-settings-openapi.yml
