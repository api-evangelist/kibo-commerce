components:
  schemas:
    FacetCollection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Facet'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    FacetRangeQuery:
      properties:
        rangeValueEnd: {}
        rangeValueStart: {}
      type: object
    Facet:
      description: The definition of a Facet
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        categoryCode:
          description: The category that the facet is being configured at
          type:
          - string
          - 'null'
        categoryId:
          description: The category that the facet is being configured at
          format: int32
          type:
          - integer
          - 'null'
        facetId:
          description: The unique identifier for the facet definition
          format: int32
          type:
          - integer
          - 'null'
        facetType:
          description: "The type of facet. Allowable values are: Value, RangeQuery \nMust be a valid value for DataType defined in FacetTypeConst."
          type:
          - string
          - 'null'
        isHidden:
          description: Indicates whether the facet is hidden for the given category
          type: boolean
        order:
          description: Used to order the display of the facets within a section
          format: int32
          type: integer
        overrideFacetId:
          description: The ID of a parent category's facet being overriden
          format: int32
          type:
          - integer
          - 'null'
        rangeQueries:
          description: List of ranges if the Facet is of type Range
          items:
            $ref: '#/components/schemas/FacetRangeQuery'
          type:
          - array
          - 'null'
        source:
          $ref: '#/components/schemas/FacetSource'
        validity:
          $ref: '#/components/schemas/FacetValidity'
        valueSortType:
          description: "Determines how the facet values will be sorted in the store. \nMust be a valid value for DataType defined in FacetValueSortTypeConst. \nAllowable values are: CountAscending, CountDescending, ValuesAscending, ValuesDescending, AttributeDefinition, AttributeDefinitionDescending.\nThe default if no value is specified will be CountDescending."
          type:
          - string
          - 'null'
      type: object
    FacetSet:
      properties:
        available:
          description: Facets that are not configured, but COULD BE!
          items:
            $ref: '#/components/schemas/FacetSource'
          type:
          - array
          - 'null'
        configured:
          description: Facets that are configured
          items:
            $ref: '#/components/schemas/Facet'
          type:
          - array
          - 'null'
      type: object
    FacetSource:
      properties:
        allowsRangeQuery:
          description: Read-only system-generated indicator of whether the source field supports RangeQuery type facets.
          type: boolean
        dataType:
          description: Read-only system-generated DataType of the Attribute or Element source field. Will be valid value for DataType defined in DataTypeConst.
          maxLength: 20
          type:
          - string
          - 'null'
        id:
          description: Name of field, or FQN of attribute
          type:
          - string
          - 'null'
        name:
          description: Read-only system-generated label for the source field.
          type:
          - string
          - 'null'
        type:
          description: "The type of source field used by the facet. Allowable values are: Element, Attribute. \nMust be a valid value for DataType defined in FacetFieldTypeConst."
          type:
          - string
          - 'null'
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    FacetValidity:
      properties:
        isValid:
          type: boolean
        reasonCode:
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
