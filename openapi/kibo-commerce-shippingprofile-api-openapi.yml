        options:
          additionalProperties: {}
          readOnly: true
          type:
          - object
          - 'null'
        properties:
          additionalProperties: {}
          deprecated: true
          readOnly: true
          type:
          - object
          - 'null'
        requestUri:
          format: uri
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
        versionPolicy:
