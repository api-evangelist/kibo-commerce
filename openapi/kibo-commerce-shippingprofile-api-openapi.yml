          description: Success
      summary: Update States
      tags:
      - ShippingProfile
      operationId: putCommerceShippingAdminProfilesByProfilecodeShippingstates
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
