                  $ref: '#/components/schemas/ShippingStates'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/ShippingStates'
                type: array
          description: Success
      summary: Get Configured Shipping States
      tags:
      - ShippingProfile
      operationId: getCommerceShippingAdminProfilesByProfilecodeShippingstates
      x-operation-id-source: derived
    put:
      description: Updates the configured shipping states
      parameters:
