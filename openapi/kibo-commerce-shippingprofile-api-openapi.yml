      type: object
    HttpMethod:
      properties:
        method:
          type:
          - string
          - 'null'
      type: object
    ShippingAdminHttpVersionPolicy:
      enum:
      - RequestVersionOrLower
      - RequestVersionOrHigher
      - RequestVersionExact
      format: ''
      type: string
    ShippingAdminState:
      properties:
        code:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      type: object
    HttpResponseMessage:
      properties:
        content:
          $ref: '#/components/schemas/HttpContent'
        headers:
          items:
            $ref: '#/components/schemas/StringStringIEnumerableKeyValuePair'
          readOnly: true
          type:
          - array
          - 'null'
        isSuccessStatusCode:
          readOnly: true
          type: boolean
        reasonPhrase:
          type:
          - string
          - 'null'
        requestMessage:
          $ref: '#/components/schemas/ShippingAdminHttpRequestMessage'
        statusCode:
          $ref: '#/components/schemas/ShippingAdminHttpStatusCode'
        trailingHeaders:
          items:
            $ref: '#/components/schemas/StringStringIEnumerableKeyValuePair'
          readOnly: true
          type:
          - array
          - 'null'
        version:
          type:
          - string
          - 'null'
      type: object
    HandlingFeeRuleCollection:
      description: A collection of FeeGroups
      properties:
        items:
          items:
            $ref: '#/components/schemas/HandlingFeeRule'
          type:
          - array
          - 'null'
        totalCount:
          format: int32
          type: integer
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    ServiceTypeLocalizedContent:
      properties:
        localeCode:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      type: object
    ShippingProfileCollection:
      description: a collection of profiles
      properties:
        items:
          items:
            $ref: '#/components/schemas/ShippingProfile'
          type:
          - array
          - 'null'
        totalCount:
          format: int32
          type: integer
      type: object
    ShippingStates:
      properties:
        countryCode:
          type:
          - string
          - 'null'
        states:
          items:
            $ref: '#/components/schemas/ShippingAdminState'
          type:
          - array
          - 'null'
          uniqueItems: true
      type: object
    ShippingProfile:
      description: ''
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        code:
          description: Merchant entered unique identifier for a ShippingProfile
          type:
          - string
          - 'null'
        orderHandlingFeeRules:
          description: ''
          items:
            $ref: '#/components/schemas/HandlingFeeRule'
          type:
          - array
          - 'null'
        productHandlingFeeRules:
          description: ''
          items:
            $ref: '#/components/schemas/HandlingFeeRule'
          type:
          - array
          - 'null'
        shippingInclusionRules:
          description: ''
          items:
            $ref: '#/components/schemas/ShippingInclusionRule'
          type:
          - array
          - 'null'
        targetedSiteIds:
          description: 'The siteid''s for which this profile applies

            <remarks>for now there is a 1-1 relationship between this profile and site so only 1 siteid should be in this list</remarks>'
          items:
            format: int32
            type: integer
          type:
          - array
          - 'null'
      type: object
    HttpContent:
      properties:
        headers:
          items:
            $ref: '#/components/schemas/StringStringIEnumerableKeyValuePair'
          readOnly: true
          type:
          - array
          - 'null'
      type: object
    ShippingInclusionRuleCollection:
      description: A collection of methodgroup
      properties:
        items:
          items:
            $ref: '#/components/schemas/ShippingInclusionRule'
          type:
          - array
          - 'null'
        totalCount:
          format: int32
          type: integer
      type: object
    ServiceType:
      description: Service Type aka Shipping Method
      properties:
        code:
          description: Unique Service Type Code for a particular Carrier
          type:
          - string
          - 'null'
        content:
          $ref: '#/components/schemas/ServiceTypeLocalizedContent'
        deliveryDuration:
          type:
          - string
          - 'null'
      type: object
    StringStringIEnumerableKeyValuePair:
      properties:
        key:
          type:
          - string
          - 'null'
        value:
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    ShippingAdminHttpStatusCode:
      enum:
      - Continue
      - SwitchingProtocols
      - Processing
      - EarlyHints
      - OK
      - Created
      - Accepted
      - NonAuthoritativeInformation
      - NoContent
      - ResetContent
      - PartialContent
      - MultiStatus
      - AlreadyReported
      - IMUsed
      - MultipleChoices
      - Ambiguous
      - MovedPermanently
      - Moved
      - Found
      - Redirect
      - SeeOther
      - RedirectMethod
      - NotModified
      - UseProxy
      - Unused
      - TemporaryRedirect
      - RedirectKeepVerb
      - PermanentRedirect
      - BadRequest
      - Unauthorized
      - PaymentRequired
      - Forbidden
      - NotFound
      - MethodNotAllowed
      - NotAcceptable
      - ProxyAuthenticationRequired
      - RequestTimeout
      - Conflict
      - Gone
      - LengthRequired
      - PreconditionFailed
      - RequestEntityTooLarge
      - RequestUriTooLong
      - UnsupportedMediaType
      - RequestedRangeNotSatisfiable
      - ExpectationFailed
