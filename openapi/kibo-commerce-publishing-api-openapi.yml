paths:
  /commerce/catalog/admin/publishing/discarddrafts:
    post:
      description: Deletes the draft version of product changes (pending product changes) for each product code.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishingScope'
      responses:
        '200':
          description: OK
      summary: Discard Drafts
      tags:
      - Publishing
      operationId: postCommerceCatalogAdminPublishingDiscarddrafts
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    PublishingScope:
      properties:
        allPending:
          description: True = scope to all pending products
          type:
          - boolean
          - 'null'
        productCodes:
          description: List of specific productCodes to scope publish operation against
          items:
            type: string
          type:
          - array
          - 'null'
        publishSetCode:
          description: The Publish Set to publish
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
