      - description: ''
        in: query
        name: filter
        schema:
          type: string
      - description: Include coupon and redemption counts
        in: query
        name: includeCounts
        schema:
          default: false
          type: boolean
      - description: '"counts" returns discount and couponCode counts'
        in: query
