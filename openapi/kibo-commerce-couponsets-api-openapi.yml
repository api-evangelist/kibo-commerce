openapi: 3.2.0
info:
  title: Kibo Commerce Coupon Sets API
  version: '1.0'
  description: 'Operations tagged CouponSets across 2 of this provider''s published API definitions: openapi_openapi_catalog_admin.json, kibo-commerce-catalog-admin-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: CouponSets
paths:
  /commerce/catalog/admin/couponsets/{couponSetCode}/couponcodes/remove:
    post:
      description: Deletes coupons from a coupon set.
      parameters:
      - in: path
        name: couponSetCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
      responses:
        '200':
          description: OK
      summary: Delete Coupons
      tags:
      - CouponSets
      operationId: postCommerceCatalogAdminCouponsetsByCouponSetCodeCouponcodesRemove
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/couponsets/{couponSetCode}/assigneddiscounts:
    get:
      description: Retrieves the discountIds of any assigned discounts for the specified coupon set.
      parameters:
      - in: path
        name: couponSetCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AssignedDiscount'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/AssignedDiscount'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/AssignedDiscount'
                type: array
          description: OK
      summary: Get Assigned Discounts
      tags:
      - CouponSets
      operationId: getCommerceCatalogAdminCouponsetsByCouponSetCodeAssigneddiscounts
      x-operation-id-source: derived
    post:
      description: Assigns or associates an existing discount to a specified coupon set. Use the couponSetCode parameter to specify the coupon set.
      parameters:
      - in: path
        name: couponSetCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignedDiscount'
      responses:
        '200':
          description: OK
      summary: Assign Discount to Coupon Set
      tags:
      - CouponSets
      operationId: postCommerceCatalogAdminCouponsetsByCouponSetCodeAssigneddiscounts
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/couponsets/{couponSetCode}/couponcodes/{couponCode}:
    delete:
      description: Deletes a single coupon by its coupon code.
      parameters:
      - in: path
        name: couponSetCode
        required: true
        schema:
          type: string
      - in: path
        name: couponCode
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete Coupon
      tags:
      - CouponSets
      operationId: deleteCommerceCatalogAdminCouponsetsByCouponSetCodeCouponcodesByCouponCode
      x-operation-id-source: derived
    get:
      description: Retrieves a single coupon by its coupon code.
      parameters:
      - in: path
        name: couponSetCode
        required: true
        schema:
          type: string
      - in: path
        name: couponCode
        required: true
        schema:
          type: string
      - in: query
        name: includeCounts
        schema:
          default: false
          type: boolean
      - in: query
        name: responseGroups
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
            text/json:
              schema:
                $ref: '#/components/schemas/Coupon'
            text/plain:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: OK
      summary: Get Coupon
      tags:
      - CouponSets
      operationId: getCommerceCatalogAdminCouponsetsByCouponSetCodeCouponcodesByCouponCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/couponsets/{couponSetCode}:
    delete:
      description: Deletes a CouponSet.
      parameters:
      - in: path
        name: couponSetCode
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete Coupon Set
      tags:
      - CouponSets
      operationId: deleteCommerceCatalogAdminCouponsetsByCouponSetCode
      x-operation-id-source: derived
    get:
      description: Returns a single CouponSet
      parameters:
      - description: CouponSetCode for the requested CouponSet
        in: path
        name: couponSetCode
        required: true
        schema:
          type: string
      - description: Include the redemption counts and coupon counts
        in: query
        name: includeCounts
        schema:
          default: false
          type: boolean
      - description: '"counts" includes the number of redemptions, coupon codes, and assigned discounts.'
        in: query
        name: responseGroups
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponSet'
            text/json:
              schema:
                $ref: '#/components/schemas/CouponSet'
            text/plain:
              schema:
                $ref: '#/components/schemas/CouponSet'
          description: OK
      summary: Get Coupon Set
      tags:
      - CouponSets
      operationId: getCommerceCatalogAdminCouponsetsByCouponSetCode
      x-operation-id-source: derived
    put:
      description: Update a CouponSet. You can not update the Code or ID once the set is created.
      parameters:
      - description: ''
        in: path
        name: couponSetCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponSet'
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponSet'
            text/json:
              schema:
                $ref: '#/components/schemas/CouponSet'
            text/plain:
              schema:
                $ref: '#/components/schemas/CouponSet'
          description: OK
      summary: Update Coupon Set
      tags:
      - CouponSets
      operationId: putCommerceCatalogAdminCouponsetsByCouponSetCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/couponsets:
    get:
      description: Returns a paged collection of CouponSets
      parameters:
