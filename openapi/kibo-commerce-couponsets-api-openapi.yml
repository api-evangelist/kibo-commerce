            schema:
              $ref: '#/components/schemas/CouponSet'
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponSet'
            text/json:
              schema:
                $ref: '#/components/schemas/CouponSet'
            text/plain:
              schema:
                $ref: '#/components/schemas/CouponSet'
          description: OK
      summary: Add Coupon Set
      tags:
