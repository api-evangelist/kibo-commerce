components:
  schemas:
    CouponSetCollection:
      description: Paged collection of Mozu.ProductAdmin.Contracts.CouponSet
      properties:
        items:
          items:
            $ref: '#/components/schemas/CouponSet'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    Coupon:
      description: Coupon in a coupon set.
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        canBeDeleted:
          type: boolean
        couponCode:
          description: The code the customer uses to claim this coupon
          minLength: 1
          type: string
        couponSetCode:
          description: Link to associated coupon
          type:
          - string
          - 'null'
        couponSetId:
          description: ReadOnly system id for releated couponset.
          format: int32
          type: integer
        redemptionCount:
          description: 'Total number of times this code has been redeemed. ReadOnly, calculated.

            Only returned with response group includeCounts'
          format: int32
          type:
          - integer
          - 'null'
      required:
      - couponCode
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    CouponSet:
      description: Represents a claimable item that allows a user to use one or more discounts.
      properties:
        assignedDiscountCount:
          description: 'ReadOnly sum of all redemptions for this coupon.

            Use "counts" response group.'
          format: int32
          type:
          - integer
          - 'null'
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        canBeDeleted:
          description: 'Signifies that the coupon has not been exported and can be updated

            ReadOnly'
          type: boolean
        couponCodeCount:
          description: 'Count of associated couponCodes.

            Must use "counts" response group to get this value

            ReadOnly'
          format: int32
          type:
          - integer
          - 'null'
        couponCodeType:
          description: 'Determines if the coupon is a persisted list of codes (static) or a list based on generated specification

            (dynamic).'
          type:
          - string
          - 'null'
        couponSetCode:
          description: 'Unique tenant supplied identifier.

            Used as the prefix for generated sets.

            Required

            System generated if left null.'
          maxLength: 32
          type:
          - string
          - 'null'
        endDate:
          description: Date and time that the coupon codes becomes expired
          format: date-time
          type:
          - string
          - 'null'
        id:
          description: Internal unique identifier of the couponset. System-supplied and read-only.
          format: int32
          type:
          - integer
          - 'null'
        maxRedemptionsPerCouponCode:
          description: 'Maximum number of times any code can de used.

            Must be null or >= 1 (0 is invalid).

            Defaults to 1 on creation if null.'
          format: int32
          type:
          - integer
          - 'null'
        maxRedemptionsPerUser:
          description: 'Maximum number of times any single user can redeem any code.

            Must be null or >= 1 (0 is invalid).

            Defaults to 1 on creation only when legacy tenant behavior is enabled; otherwise null is preserved.'
          format: int32
          type:
          - integer
          - 'null'
        name:
          description: CouponSet Name
          maxLength: 200
          minLength: 1
          type: string
        redemptionCount:
          description: ReadOnly count of all redemptions for this coupon set.
          format: int32
          type:
          - integer
          - 'null'
        setSize:
          description: 'Sets the number of codes to generate for dynamic coupons

            Required when CouponCodeType is "Dynamic"'
          format: int32
          type:
          - integer
          - 'null'
        startDate:
          description: Date and time that the coupon codes becomes active
          format: date-time
          type:
          - string
          - 'null'
        status:
          description: 'CouponSet status which can be: Active, Expired,  Inactive

            System-supplied and read-only.'
          type:
          - string
          - 'null'
      required:
      - name
      type: object
    AssignedDiscount:
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        couponSetCode:
          description: ReadOnly, CouponSetCode copied from URI
          type:
          - string
          - 'null'
        couponSetId:
          description: ReadOnly, CouponSetId
          format: int32
          type: integer
        discountId:
          description: Discount Id for the associated discount
          format: int32
          type: integer
      required:
      - discountId
      type: object
    CouponCollection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Coupon'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
