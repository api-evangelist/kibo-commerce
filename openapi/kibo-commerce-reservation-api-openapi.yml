openapi: 3.2.0
info:
  title: Kibo Commerce Reservation API
  version: '1.0'
  description: 'Operations tagged Reservation across 2 of this provider''s published API definitions: openapi_openapi_reservation.json, kibo-commerce-reservation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Reservation
