      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservati'
            text/json:
              schema:
                $ref: '#/components/schemas/Reservati'
            text/plain:
              schema:
                $ref: '#/components/schemas/Reservati'
          description: OK
      summary: Add Item
      tags:
      - Reservation
      operationId: postCommerceReservationByReservationIdItems
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
