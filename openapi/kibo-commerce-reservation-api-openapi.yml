    put:
      description: Activate a reservation. Kibo does not recommend using this API, as it is intended for internal use.
      parameters:
      - in: path
        name: reservationId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservati'
            text/json:
              schema:
                $ref: '#/components/schemas/Reservati'
            text/plain:
              schema:
                $ref: '#/components/schemas/Reservati'
          description: OK
      summary: Activate Reservation
      tags:
      - Reservation
      operationId: putCommerceReservationByReservationIdActivate
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/reservation/{reservationId}/items:
