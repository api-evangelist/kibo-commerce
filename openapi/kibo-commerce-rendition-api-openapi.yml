openapi: 3.2.0
info:
  title: Kibo Commerce Rendition API
  version: '1.0'
  description: 'Operations tagged Rendition across 2 of this provider''s published API definitions: openapi_openapi_fulfillment.json, kibo-commerce-fulfillment-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Rendition
paths:
  /commerce/fulfillment/orders/{orderId}/summary/html:
    get:
      deprecated: false
      description: Render an order summary in HTML.
      parameters:
      - description: orderId
        in: path
        name: orderId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelOfRenderedContent'
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Render Order Summary
      tags:
      - Rendition
      operationId: getCommerceFulfillmentOrdersByOrderIdSummaryHtml
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/fulfillment/returns/{returnId}/receipt/html:
    get:
      deprecated: false
      description: Render a return receipt in HTML.
      parameters:
      - description: returnId
        in: path
        name: returnId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelOfRenderedContent'
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Render Return Receipt
      tags:
      - Rendition
      operationId: getCommerceFulfillmentReturnsByReturnIdReceiptHtml
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    EntityModelOfRenderedContent:
      properties:
        _links:
          $ref: '#/components/schemas/Links'
        content:
          type: string
      title: EntityModelOfRenderedContent
      type: object
    Links:
      properties:
        empty:
          type: boolean
      title: Links
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_fulfillment.json
- kibo-commerce-fulfillment-openapi.yml
x-provenance:
  method: harvested
  publisher: Kibo Commerce
  source: https://docs.kibocommerce.com/openapi/openapi_fulfillment.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
