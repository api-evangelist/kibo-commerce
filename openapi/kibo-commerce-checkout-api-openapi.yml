components:
  schemas:
    Category:
      description: Categories to which the product belongs. Discounts can apply to categories where any product in the category is discounted.
      properties:
        id:
          description: Unique identifier of the category. System-supplied and read-only.
          format: int32
          type:
          - integer
          - 'null'
        parent:
          $ref: '#/components/schemas/Category'
      type: object
    Payment:
      description: "Payment transaction associated with this order. It is the entire payment interchange between the merchant who is forwarding the customer's payment \ninformation and the payment service who is authorizing and capturing payment. Payment can be either by credit card, check, or PayPal. (PayPal not\ncurrently supported.)"
      properties:
        amountCollected:
          description: Amount collected on the payment
          format: double
          type: number
        amountCredited:
          description: Amount credited back to the payment.
          format: double
          type: number
        amountRequested:
          description: 'Derived from the Amount on the initial payment create, used to help storefront determine how much can be captured for multiple payments.

            See Order.AmountRemainingForPayment for an example.'
          format: double
          type: number
        auditInfo:
          $ref: '#/components/schemas/CoreApiContractsAuditInfo'
        availableActions:
          description: Actions available to the payment
          items:
            type: string
          type:
          - array
          - 'null'
        billingInfo:
          $ref: '#/components/schemas/BillingInfo'
        changeMessages:
          description: Change messages related to the payment.
          items:
            $ref: '#/components/schemas/ChangeMessage'
          type:
          - array
          - 'null'
        data:
          description: Custom data from payment providers
          type:
          - object
          - 'null'
        externalTransactionId:
          description: The external/third party transaction Id for this payment. This is used to store the transaction Id from digital wallet like Visa Checkout
          type:
          - string
          - 'null'
        gatewayGiftCard:
          $ref: '#/components/schemas/GatewayGiftCard'
        groupId:
          $ref: '#/components/schemas/PaymentActionTarget'
        id:
          description: Unique identifier of this order transaction.
          type:
          - string
          - 'null'
        installmentPlanCode:
          description: Stores the Installment Plan code. Installment is only supported on subscription orders
          type:
          - string
          - 'null'
        interactions:
          description: "List of interactions for this transaction. A transaction is created upon authorization and lasts across the payment \ninterchange, which can consist of multiple interactions, such as consecutive captures."
          items:
            $ref: '#/components/schemas/PaymentInteraction'
          type:
          - array
          - 'null'
        isRecurring:
          description: "If true, the product is purchased or fulfilled at regular intervals, for example, \nmonthly billing or a subscription. (Not currently supported.)"
          type: boolean
        orderId:
          description: Unique identifier of the order with which this transaction is associated.
          type:
          - string
          - 'null'
        paymentServiceTransactionId:
          description: Unique identifier of the transaction, specified by the payment service processesing this transaction.
          type:
          - string
          - 'null'
        paymentType:
          description: Type of Payment
          type:
          - string
          - 'null'
        paymentWorkflow:
          description: The source of data for this payment.  By default, this will be set to 'mozu'
          type:
          - string
          - 'null'
        status:
          description: Current status of this transaction which are described by the PaymentStatusConst class.
          type:
          - string
          - 'null'
        subPayments:
          description: List of sub payments that correspond to child orders in case of multiship orders.
          items:
            $ref: '#/components/schemas/SubPayment'
          type:
          - array
          - 'null'
      type: object
    SubPayment:
      properties:
        amountCollected:
          format: double
          type: number
        amountCredited:
          format: double
          type: number
        amountRefunded:
          format: double
          type: number
        amountRequested:
          format: double
          type: number
        status:
          type:
          - string
          - 'null'
        target:
          $ref: '#/components/schemas/PaymentActionTarget'
      type: object
    ProductPropertyValue:
      properties:
        stringValue:
          type:
          - string
          - 'null'
        value: {}
      type: object
    CheckoutGroupShippingMethod:
      properties:
        groupingId:
          type:
          - string
          - 'null'
        shippingRate:
          $ref: '#/components/schemas/ShippingRate'
      type: object
    PurchaseOrderPaymentTerm:
      properties:
        code:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
      type: object
    PaymentGatewayInteraction:
      description: Represents a manually entered payment gateway interaction.
      properties:
        gatewayAVSCodes:
          description: Not populated by incoming request.
          type:
          - string
          - 'null'
        gatewayAuthCode:
          description: Gateway Transaction Id from PCIaaS.  Not populated by incoming request.
          type:
          - string
          - 'null'
        gatewayCVV2Codes:
          description: Not populated by incoming request.
          type:
          - string
          - 'null'
        gatewayInteractionId:
          description: Gateway Transaction Id from PCIaaS.  Not populated by incoming request.
          format: int32
          type:
          - integer
          - 'null'
        gatewayResponseCode:
          description: Not populated by incoming request.
          type:
          - string
          - 'null'
        gatewayResponseText:
          description: Gateway response text. Supplied by PCIaaS.
          type:
          - string
          - 'null'
        gatewayTransactionId:
          description: Gateway Transaction Id from PCIaaS.  Not populated by incoming request.
          type:
          - string
          - 'null'
        isOrderRefund:
          description: Indicates the manual interaction is for a refund on an order.
          type: boolean
      type: object
    ItemsAndDeliveryDates:
      properties:
        deliveryDate:
          format: date-time
          type: string
        itemIds:
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    PaymentActionTarget:
      properties:
        targetId:
          description: The Id of the Checkout/Order/Return to target.
          type:
          - string
          - 'null'
        targetNumber:
          description: The number of the Checkout/Order/Return to target.
          format: int32
          type:
          - integer
          - 'null'
        targetType:
          description: Specifies if the Mozu.CommerceRuntime.Contracts.Payments.PaymentActionTarget.TargetId is a Checkout Id, Order Id, or Return Id.
          type:
          - string
          - 'null'
      type: object
    ReturnRuleInfo:
      properties:
        isReturnable:
          description: Indicate product is returnable or not
          type:
          - boolean
          - 'null'
        maxDays:
          description: Return window within which an item can be returned
          format: int32
          type:
          - integer
          - 'null'
        maxQty:
          description: Maximum quantity that can be returned
          format: int32
          type:
          - integer
          - 'null'
        ruleCode:
          description: Return rule code which is applied
          type:
          - string
          - 'null'
      type: object
    PackageMeasurements:
      description: Physical dimensions of the package required to ship the product and its weight.
      properties:
        height:
          $ref: '#/components/schemas/Measurement'
        length:
          $ref: '#/components/schemas/Measurement'
        weight:
          $ref: '#/components/schemas/Measurement'
        width:
          $ref: '#/components/schemas/Measurement'
      type: object
    Destination:
      properties:
        data:
          description: Custom data
          type:
          - object
          - 'null'
        destinationContact:
          $ref: '#/components/schemas/Contact'
        id:
          description: An identifier for this entry.
          type:
          - string
          - 'null'
        isDestinationCommercial:
          description: Indicates that the destination is commercial
          type:
          - boolean
          - 'null'
      type: object
    BillingInfo:
      description: 'Customer''s payment details such as payment type (credit card, check by mail, or PayPal)

        and cardholder information if payment is by credit card.'
      properties:
        auditInfo:
          $ref: '#/components/schemas/CoreApiContractsAuditInfo'
        billingContact:
          $ref: '#/components/schemas/Contact'
        card:
          $ref: '#/components/schemas/PaymentCard'
        check:
