      operationId: putCommerceCheckoutsByCheckoutIdAttributes
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts:
    get:
      description: Retrieves a list of checkouts according to any specified filter criteria and sort options.
      parameters:
      - description: "Used to page results from a query. Indicates the zero-based offset in the complete result set where the returned entities begin. \n            For example, with a PageSize of 25, to get the 51st through the 75th items, startIndex=50. The default value is 0. Optional."
        in: query
        name: startIndex
        schema:
          format: int32
          type: integer
      - description: Used to page results from a query. Indicates the maximum number of entities to return from a query. The default value is 20 and the maximum value is 200. Optional.
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: The element to sort the results by and the order in which the results appear. Either ascending (a-z) or descending (z-a) order. Optional.
        in: query
        name: sortBy
        schema:
          type: string
      - description: "A set of filter expressions representing the search parameters for a query: eq=equals, ne=not equals, gt=greater than, lt = less than or equals, \n            gt = greater than or equals, lt = less than or equals, sw = starts with, or cont = contains. Optional."
        in: query
        name: filter
        schema:
          type: string
      - description: Text to perform a search on
        in: query
        name: q
        schema:
          type: string
      - description: Limit of the records to include in a search, used for global search
        in: query
        name: qLimit
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/CheckoutCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/CheckoutCollection'
          description: OK
      summary: Get Checkouts
      tags:
      - Checkout
      operationId: getCommerceCheckouts
      x-operation-id-source: derived
    post:
      description: Creates a new checkout from an existing cart, that is, when the customer chooses to proceed to checkout.
      parameters:
      - description: Unique identifier of the cart. This is the original cart ID expressed as a GUID.
        in: query
        name: cartId
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Create Checkout From Cart
      tags:
      - Checkout
      operationId: postCommerceCheckouts
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts/{checkoutId}/destinations/{destinationId}:
