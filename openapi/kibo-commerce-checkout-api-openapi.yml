openapi: 3.2.0
info:
  title: Kibo Commerce Checkout API
  version: '1.0'
  description: 'Operations tagged Checkout across 2 of this provider''s published API definitions: openapi_openapi_commerce.json, kibo-commerce-commerce-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Checkout
paths:
  /commerce/checkouts/{checkoutId}/items:
    post:
      description: Adds a product or other item to the checkout of the current shopper.
      parameters:
      - description: ID of the checkout to add an item to.
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItem'
        description: 'All properties of the new item. Required property: Product.ProductCode.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Add Checkout Item
      tags:
      - Checkout
      operationId: postCommerceCheckoutsByCheckoutIdItems
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts/{checkoutId}/coupons/{couponCode}:
    delete:
      description: Removes a coupon that had been previously applied to the checkout.
      parameters:
      - description: Unique identifier of the checkout with the coupon you want to remove.
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: Coupon code to remove.
        in: path
        name: couponCode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Remove Coupon
      tags:
      - Checkout
      operationId: deleteCommerceCheckoutsByCheckoutIdCouponsByCouponCode
      x-operation-id-source: derived
    put:
      description: Apply a coupon to the Checkout.
      parameters:
      - description: Unique identifier of the Checkout with which to associate the coupon.
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: Coupon code that the customer supplies to get the discounted price.
        in: path
        name: couponCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Apply Coupon
      tags:
      - Checkout
      operationId: putCommerceCheckoutsByCheckoutIdCouponsByCouponCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts/{checkoutId}/items/destinations:
    post:
      description: Associate items to destinations in bulk.
      parameters:
      - description: ID of the checkout
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/ItemsForDestination'
              type: array
        description: Pairings of destination IDs with their associated items by ID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Bulk Update Item Destinations
      tags:
      - Checkout
      operationId: postCommerceCheckoutsByCheckoutIdItemsDestinations
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts/{checkoutId}/priceList:
    put:
      description: Changes the pricelist associated with a checkout.The desired price list code should be specified on the ApiContext.
      parameters:
      - description: Unique identifier of the checkout to change
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
        description: The code for the pricelist to apply
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Change Checkout Price List
      tags:
      - Checkout
      operationId: putCommerceCheckoutsByCheckoutIdPriceList
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts/{checkoutId}/payments/actions:
    post:
      description: Sets the action of the specified payment transaction interaction. Available actions depend on the current status of the payment transaction. If in doubt, get a list of available payment actions first.
      parameters:
      - description: Unique identifier of the checkout whose payment action you want to change.
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAction'
        description: Action to be performed, along with any metadata.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Create Payment Action
      tags:
      - Checkout
      operationId: postCommerceCheckoutsByCheckoutIdPaymentsActions
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts/{checkoutId}/items/{itemId}:
    delete:
      description: Removes a particular item from the checkout of the current shopper.
      parameters:
      - description: ''
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: Unique identifier of the item.
        in: path
        name: itemId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Delete Checkout Item
      tags:
      - Checkout
      operationId: deleteCommerceCheckoutsByCheckoutIdItemsByItemId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts/{checkoutId}/actions:
    get:
      description: Retrieves available actions which depends on the status of the checkout.
      parameters:
      - description: Unique identifier of the checkout whose available actions you want to get.
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
            text/json:
              schema:
                items:
                  type: string
                type: array
            text/plain:
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Get Available Actions
      tags:
      - Checkout
      operationId: getCommerceCheckoutsByCheckoutIdActions
      x-operation-id-source: derived
    post:
      description: Perform an action on the checkout. Available actions depend on the current state of the checkout. If in doubt, get a list of available checkout actions first.
      parameters:
      - description: Unique identifier of the checkout.
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutAction'
        description: The action to perform
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Perform Checkout Action
      tags:
      - Checkout
      operationId: postCommerceCheckoutsByCheckoutIdActions
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts/{checkoutId}/shippingMethods:
    get:
      description: Retrieves available shipping methods for groupings. Typically used to display available shipping method options on the checkout page.
      parameters:
      - description: Unique identifier of the checkout whose shipping methods you want to get.
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CheckoutGroupRates'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/CheckoutGroupRates'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/CheckoutGroupRates'
                type: array
          description: OK
      summary: Get Available Shipping Methods
      tags:
      - Checkout
      operationId: getCommerceCheckoutsByCheckoutIdShippingMethods
      x-operation-id-source: derived
    post:
      description: Sets the shipping method for specified groupings.
      parameters:
      - description: Unique identifier of the checkout whose shipping methods you want to set.
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/CheckoutGroupShippingMethod'
              type: array
        description: Pairings of checkout group to shipping method
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Set Shipping Methods
      tags:
      - Checkout
      operationId: postCommerceCheckoutsByCheckoutIdShippingMethods
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts/{checkoutId}:
    get:
      description: Retrieves the details of a checkout specified by the checkout ID.
      parameters:
      - description: Unique identifier of the checkout whose details you want.
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Get Checkout
      tags:
      - Checkout
      operationId: getCommerceCheckoutsByCheckoutId
      x-operation-id-source: derived
    post:
      description: Updates the details of a checkout specified by the checkout ID.
      parameters:
      - description: Unique identifier of the checkout whose details you want.
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
        description: Checkout that needs update
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/json:
              schema:
                $ref: '#/components/schemas/Checkout'
            text/plain:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: OK
      summary: Update Checkout
      tags:
      - Checkout
      operationId: postCommerceCheckoutsByCheckoutId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/checkouts/{checkoutId}/attributes:
    get:
      description: Gets the list of attributes specified by checkout Id.
      parameters:
      - description: ''
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrderAttribute'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrderAttribute'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OrderAttribute'
                type: array
          description: OK
      summary: Get Checkout Attributes
      tags:
      - Checkout
      operationId: getCommerceCheckoutsByCheckoutIdAttributes
      x-operation-id-source: derived
    post:
      description: Creates list of checkout attributes specified by checkout Id.
      parameters:
      - description: ''
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/OrderAttribute'
              type: array
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrderAttribute'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrderAttribute'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OrderAttribute'
                type: array
          description: OK
      summary: Create Checkout Attributes
      tags:
      - Checkout
      operationId: postCommerceCheckoutsByCheckoutIdAttributes
      x-operation-id-source: derived
    put:
      description: Updates the list of checkout attributes specified by checkout id and removes the missing attributes if not passed when removeMissing flag is set.
      parameters:
      - description: ''
        in: path
        name: checkoutId
        required: true
        schema:
          type: string
      - description: ''
        in: query
        name: removeMissing
        schema:
          default: false
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/OrderAttribute'
              type: array
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrderAttribute'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrderAttribute'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/OrderAttribute'
                type: array
          description: OK
      summary: Update Checkout Attribute
      tags:
