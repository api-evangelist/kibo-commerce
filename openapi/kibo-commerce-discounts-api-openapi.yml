components:
  schemas:
    CategoryDiscountCondition:
      description: Represents a product category and quantity constraint
      properties:
        categoryId:
          description: Unique identifier of the category to which the discount condition applies.
          format: int32
          type: integer
      type: object
    CatalogAdminsTargetedShippingMethod:
      description: 'Shipping method that is eligible for free shipping. This is the shipping method that is defined with the Shipping

        Settings resource.'
      properties:
        code:
          description: 'Unique identifier of the shipping method as it appears in the SiteShippingMethod property of the Shipping Settings

            resource.'
          maxLength: 100
          minLength: 0
          type: string
        name:
          description: Name of the shipping method as it appears in SiteShippingMethodLocalizedContent of the Shipping Settings resource.
          type:
          - string
          - 'null'
      required:
      - code
      type: object
    CatalogAdminsTargetedShippingZone:
      description: 'Shipping method that is eligible for free shipping. This is the shipping method that is defined with the Shipping

        Settings resource.'
      properties:
        zone:
          description: 'Indicates the shipping zone that this discount is valid for.  If zone is provided the

            method selected must be valid for the zone and both populated in the order for the discount

            to be valid.'
          maxLength: 200
          minLength: 0
          type: string
      required:
      - zone
      type: object
    DiscountLocalizedContent:
      description: 'Container for the language-specific name of the discount. You will have a container for each supported language

        (LocaleCode).

        This enables you to display the discount name in multiple languages yet manage it as a single discount internally.'
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        customPropertyValues:
          $ref: '#/components/schemas/CustomPropertyValues'
        friendlyDescription:
          description: Promotional text or HTML that can be utilized as friendly content like "Buy this product now and get X!"
          type:
          - string
          - 'null'
        localeCode:
          description: Lanugage used for the discount in the current catalog. Defaults setting for the active catalog.
          maxLength: 8
          minLength: 0
          type:
          - string
          - 'null'
        name:
          description: Name of the discount.
          maxLength: 200
          minLength: 0
          type: string
      required:
      - name
      type: object
    CatalogAdminsDiscountCondition:
      description: 'Specifies constraints that must be satified for a discount to be applied to a target.

        Constraints are Anded together'
      properties:
        categoriesToExcludeFromMinOrderTotal:
          description: List of categories to discount. When a discount applies to a category, all products in the category are discounted.
          items:
            $ref: '#/components/schemas/CategoryDiscountCondition'
          type:
          - array
          - 'null'
        continuityRecurrenceSettings:
          $ref: '#/components/schemas/ContinuityRecurrenceSettings'
        couponCode:
          description: Code of the coupon associated with the discount (if a coupon code is required). The merchant can supply the code or the system can generate it.
          type:
          - string
          - 'null'
        customerSegments:
          description: List of customer groups for which the discount applies
          items:
            $ref: '#/components/schemas/CatalogAdminsCustomerSegment'
          type:
          - array
          - 'null'
        excludedCategories:
          description: List of categories to discount. When a discount applies to a category, all products in the category are discounted.
          items:
            $ref: '#/components/schemas/CategoryDiscountCondition'
          type:
          - array
          - 'null'
        excludedProducts:
          description: List of products that are eligible for the discount.
          items:
            $ref: '#/components/schemas/ProductDiscountCondition'
          type:
          - array
          - 'null'
        exclusiveLocationCodes:
          description: List of locations where the item/order should be fulfilled for the discount to be valid.
          items:
            type: string
          type:
          - array
          - 'null'
        exclusiveSiteIds:
          description: 'The discount condition for site Ids, if present the discount will be applied only to these sites.

            If not present discount will work for all sites in a catalog.'
          items:
            format: int32
            type: integer
          type:
          - array
          - 'null'
        expirationDate:
          description: Date when the discount expires. Default is null (no expiration date).
          format: date-time
          type:
          - string
          - 'null'
        expression:
          $ref: '#/components/schemas/CatalogAdminsDynamicExpression'
        includedCategories:
          description: List of categories that must be purchased in order for the discount to be valid.
          items:
            $ref: '#/components/schemas/CategoryDiscountCondition'
          type:
          - array
          - 'null'
        includedPaymentWorkflows:
          description: List of payment types that trigger this discount to be valid.
          items:
            type: string
          type:
          - array
          - 'null'
        includedProducts:
          description: List of products that are eligible for the discount.
          items:
            $ref: '#/components/schemas/ProductDiscountCondition'
          type:
          - array
          - 'null'
        maxRedemptionCount:
          description: Maximum number of times that the discount can be redeemed. Default is null (no limit to discount redemptions).
          format: int32
          type:
          - integer
          - 'null'
          exclusiveMinimum: 0
        maximumOrderAmount:
          description: 'Only applies to order.

            Maximum order subtotal after discounts in order for the associated discount to be applied'
          format: double
          type:
          - number
          - 'null'
        minDistinctProductsRequired:
          description: 'The minimum number of distinct products on the order

            Not a quantity calculation.'
          format: int32
          type:
          - integer
          - 'null'
        minTotalOrderQuantity:
          description: 'The order must contain at least this total quantity of items for the discount to apply.

            You must buy a combined quantity of at least x amount.'
          format: int32
          type:
          - integer
          - 'null'
        minimumCategorySubtotalBeforeDiscounts:
          description: "Minimum amount that must be purchased in the combined categories defined in \nIncludedCategories.  Amount is calculated before discounting.\nNot used if IncludedCategories is empty."
          format: double
          type:
          - number
          - 'null'
        minimumLifetimeValueAmount:
          description: Minimum lifetime value amount required for this discount to apply
          format: double
          type:
          - number
          - 'null'
        minimumOrderAmount:
          description: 'Only applies to order.

            Minimum order subtotal after discounts in order for the associated discount to be applied'
          format: double
          type:
          - number
          - 'null'
        minimumQuantityProductsRequiredInCategories:
          description: 'Minimum quantity of products in the categories specified in IncludedCategories that must be purchased to

            qualify for the associated discount.

            Defaults to 1 if  null and IncludedCategories has values'
          format: int32
          type:
          - integer
          - 'null'
          exclusiveMinimum: 0
        minimumQuantityRequiredProducts:
          description: 'Minimum quantity of products in the specified IncludedProducts that must be purchased to

            qualify for the associated discount.

            Defaults to 1 if  null and IncludedProducts has values.'
          format: int32
          type:
          - integer
          - 'null'
          exclusiveMinimum: 0
        minimumRequiredQuantityPerRedemption:
          description: Defines a minimum quantity that is required for a target only discount
          format: int32
          type:
          - integer
          - 'null'
        pricingContext:
          description: 'The pricing context must match on this value for the discount to apply.

            This only matters for tenants that use subscription products'
          type:
          - string
          - 'null'
        productsToExcludeFromMinOrderTotal:
          description: List of products that are eligible for the discount.
          items:
            $ref: '#/components/schemas/ProductDiscountCondition'
          type:
          - array
          - 'null'
        requiresAuthenticatedUser:
          description: "Determines is this discount can be used by an anonymous user \nDefaults to false to allow discounts for anonymous users."
          type: boolean
        requiresCoupon:
          description: If true, the shopper needs to enter a coupon code to redeem the discount.
          type: boolean
        startDate:
          description: Date when the discount can goes into effect, in the format yyyy-mm-dd.
          format: date-time
          type:
          - string
          - 'null'
        validFulfillmentMethods:
          description: 'The discount condition for fulfillment methods, if present the discount will be applied only to these fulfillment methods.

            This must be a value defined in FulfillmentMethodConst below.'
          items:
            type: string
          type:
          - array
          - 'null'
        validSubscriptionContinuityOrdinals:
          description: Ordinals at which a continuity order should receive the discount.
          items:
            format: int32
            type: integer
          type:
          - array
          - 'null'
        validSubscriptionFrequencies:
          description: List of subscription frequencies to which the discount will apply.
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    ThresholdMessageLocalizedContent:
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        localeCode:
          description: Language used for the discount in the current catalog. Defaults setting for the active catalog.
          maxLength: 8
          minLength: 0
          type:
          - string
          - 'null'
        messageTemplate:
          description: Locale-based contents of the Threshold Message.
          type: string
      required:
      - messageTemplate
      type: object
    DiscountTagCollection:
      description: Collection of discounts returned as a whole. A collection is not paged.
      properties:
        items:
          items:
            $ref: '#/components/schemas/DiscountTag'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    CatalogAdminsTargetedCategory:
      description: Category to discount. When a discount applies to a category, all products in the category are discounted.
      properties:
        id:
          description: Unique identifier of the category to which the discount applies.
          format: int32
          type:
          - integer
          - 'null'
      type: object
    ExpressionValidationResult:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/ExpressionValidationError'
          type:
          - array
          - 'null'
        hasErrors:
          readOnly: true
          type: boolean
      type: object
    ExpressionValidationError:
      properties:
        expression:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      type: object
    CatalogAdminsDynamicExpression:
      description: Category
      properties:
        text:
          type:
          - string
          - 'null'
        tree:
          $ref: '#/components/schemas/CatalogAdminsExpression'
      type: object
    DiscountTag:
      properties:
        discountId:
          format: int32
          type: integer
        tagCodes:
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    TargetedProduct:
      description: Product to discount.
      properties:
        productCode:
          description: Product code of the product to discount.
          type:
          - string
          - 'null'
      type: object
    CatalogAdminsExpression:
      properties:
        left:
          description: The field target of a predicate
          type:
          - string
          - 'null'
        logicalOperator:
          description: And or Or (if Container with More than one Node)
          type:
          - string
          - 'null'
        nodes:
          items:
            $ref: '#/components/schemas/CatalogAdminsExpression'
          type:
          - array
          - 'null'
        operator:
          description: The operator of a predicate
          type:
          - string
          - 'null'
        right:
          description: The literal values of a predicate
        type:
          description: Container or Predicate
          type:
          - string
          - 'null'
      type: object
    CatalogAdminsDiscountTarget:
      description: 'What to discount. Specifies the type of discount (percentage off, monetary amount, or free shipping) and which products, categories, or shipping methods are eligible for the discount.

        Can also specify the minimum amount that the order must total for the discount to apply.'
      properties:
        appliesToLeastExpensiveProductsFirst:
          description: "Determines which way the discount is optimized.  Consumers favor(default - false/null) or tenants favor (when this is set to true)\nApplies to discounts where target is not a specific product or list of products.  \nMay also impact behavior of Buy X Get Y so that X is the most expensive items and Y the least expensive."
          type:
          - boolean
          - 'null'
        categories:
          description: List of categories to discount. When a discount applies to a category, all products in the category are discounted.
          items:
            $ref: '#/components/schemas/CatalogAdminsTargetedCategory'
          type:
          - array
          - 'null'
        doNotApplyToHandlingFees:
          description: Prevents the discount from being applied to handling fees
          type:
          - boolean
          - 'null'
        excludeItemsWithExistingProductDiscounts:
          description: "Prevents order scoped discounts from layering over items that already have a product discount with the \nsame type."
          type:
          - boolean
          - 'null'
        excludeItemsWithExistingShippingDiscounts:
          description: "Prevents order scoped discounts from layering over items that already have a shipping discount with the \nsame type."
          type:
          - boolean
          - 'null'
        excludedCategories:
          description: List of categories to exclude from the discount. Useful to exclude specific child categories.
          items:
            $ref: '#/components/schemas/CatalogAdminsTargetedCategory'
          type:
          - array
          - 'null'
        excludedCategoriesOperator:
          description: 'Applies to Included categories

            Defaults to Any'
          type:
          - string
          - 'null'
        excludedProducts:
          description: List of products that are excluded from the discount.
          items:
            $ref: '#/components/schemas/TargetedProduct'
          type:
          - array
          - 'null'
        includeAllProducts:
          description: If yes, the discount applies to all products sold on the storefront.
          type:
          - boolean
          - 'null'
        includedCategoriesOperator:
          description: 'Applies to Included categories

            When Any, the target product can belong to any specified category.

            When All, the target product must belong to all specified categories.

            Defaults to Any'
          type:
          - string
          - 'null'
        maximumQuantityPerRedemption:
          description: "When a condition is specified, this property limits the number of items that can be targeted per discount redemption with an order.\nif multiple redemptions are allowed per order then multiples of this value would be allowed in multiples of the associated \ncondition.\nIf no condition is specified then this value is not used.  \nIf null and condition exists, then defaults to 1."
          format: int32
          type:
          - integer
          - 'null'
          exclusiveMinimum: 0
        products:
          description: List of products that are eligible for the discount.
          items:
            $ref: '#/components/schemas/TargetedProduct'
          type:
          - array
          - 'null'
        shippingMethods:
          description: Shipping method that is eligible for shipping discounts. This is a shipping method defined in Shipping Settings.
          items:
            $ref: '#/components/schemas/CatalogAdminsTargetedShippingMethod'
          type:
          - array
          - 'null'
        shippingZones:
          description: Shipping Zones that are applicable for this discount
          items:
            $ref: '#/components/schemas/CatalogAdminsTargetedShippingZone'
          type:
          - array
          - 'null'
        type:
          description: "    Type of target to which the discount applies. Possible values: <pre>Product</pre> or <pre>Shipping</pre>. \nIf this is a <pre>Product</pre> type, you can specify which products or categories that the discount applies to.\n    If this is a <pre>Shipping</pre> type then you must specify which shipping methods apply."
          minLength: 1
          type: string
      required:
      - type
      type: object
    ProductDiscountCondition:
      description: Represents a product and quantity constraint
      properties:
        productCode:
          description: Product code of the product to discount.
          type:
          - string
          - 'null'
      type: object
    CatalogAdminsCustomerSegment:
      description: Represents a customer segment
      properties:
        id:
          description: 'The Customer segment Id.

            This is the  system Id not the code.'
          format: int32
          type: integer
      type: object
    CatalogAdminsThresholdMessage:
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        content:
          $ref: '#/components/schemas/ThresholdMessageLocalizedContent'
        discountId:
          description: Unique identifier of the discount. System-supplied and read-only.
          format: int32
          type: integer
        isActive:
          description: Indicates if threshold messages are active for this discount
          type: boolean
        localizedContent:
          description: 'Container for the language-specific name of the threshold message. You will have a container for each supported language (LocaleCode).

            This enables you to display the message in multiple languages yet manage it as a single message internally.'
          items:
            $ref: '#/components/schemas/ThresholdMessageLocalizedContent'
          type:
          - array
          - 'null'
        requiresCouponCode:
          description: Indicates if the threshold message will display when a promo code is evaluated
          type: boolean
        showInCart:
          description: Indicates if the threshold message will display in the cart
          type: boolean
        showOnCheckout:
          description: Indicates if the threshold message will display on the checkout page
          type: boolean
        thresholdValue:
          description: The cart total amount that must be met before the threshold message is displayed
          format: double
          type: number
      required:
      - discountId
      - thresholdValue
      type: object
    TagCollection:
      description: Collection of Tags returned as a whole. A collection is not paged.
      properties:
        items:
          items:
            $ref: '#/components/schemas/CatalogAdminsTag'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    ContinuityRecurrenceSettings:
      properties:
        interval:
          description: Interval until next discount applies
          format: int32
          type:
          - integer
          - 'null'
        startOrdinal:
          description: Continuity ordinal to start discounting
          format: int32
          type:
          - integer
          - 'null'
        stopOrdinal:
          description: Continuity ordinal to stop discounting
          format: int32
          type:
          - integer
          - 'null'
      type: object
    CatalogAdminsDiscountCollection:
      description: Collection of discounts returned as a whole. A collection is not paged.
      properties:
        items:
          items:
            $ref: '#/components/schemas/CatalogAdminsDiscount'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    CatalogAdminsTag:
      description: A generic tag that can be used for any purpose.
      properties:
        tagCode:
          description: A unique code per catalog. Limit 500 characters.
          minLength: 1
          type: string
        tagName:
          description: Readonly and computed from TagCode. If using hierarchical tag-codes, only the last node
          readOnly: true
          type:
          - string
          - 'null'
        tagPath:
          description: Readonly and computed from TagCode. If using hierarchical tag-codes, the node path without the TagName
          readOnly: true
          type:
          - string
          - 'null'
      required:
      - tagCode
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    CatalogAdminsDiscount:
      description: 'Allows you to define and manage discounts to apply to your products, product categories, or orders. The discounts can be a specified monetary amount off the price, percentage off the price, or for free shipping.

        You can create a coupon code that applies to the discount.'
      properties:
        amount:
          description: '    Amount of the discount, as a percentage or monetary amount, for example 15% or $15.

            Must be either null or greater than zero.'
          format: double
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
        amountType:
          description: "Type of discount, which can be either a percentage off the price, \na specific monetary amount, or free. \nPossible values: \n\tPercentage \n\tAmount \n\tFree\n\tFixedPrice"
          minLength: 1
          type: string
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        canBeDeleted:
          description: Signifies that the discount is not referenced and can be hard deleted
          type: boolean
        canBeStackedUpon:
          description: Indicates whether or not stacking is enabled for this discount
          type:
          - boolean
          - 'null'
        code:
          description: Indicates unique code for the discount, if not present Discount Id is used as a code.
          maxLength: 50
