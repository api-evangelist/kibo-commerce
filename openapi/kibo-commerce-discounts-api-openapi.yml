          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Generate Random Coupon
      tags:
      - Discounts
      operationId: getCommerceCatalogAdminDiscountsGenerateRandomCoupon
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
