      description: Deletes a discount specified by its discount ID.
      parameters:
      - description: Unique identifier of the discount. System-supplied and read-only.
        in: path
        name: discountId
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          description: OK
