openapi: 3.2.0
info:
  title: Kibo Commerce Return API
  version: '1.0'
  description: 'Operations tagged Return across 2 of this provider''s published API definitions: openapi_openapi_commerce.json, kibo-commerce-commerce-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Return
paths:
  /commerce/returns/{returnId}/packages:
    post:
      description: package?
      parameters:
      - description: Unique identifier of the return with which to associate the package.
        in: path
        name: returnId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceRuntimePackage'
        description: Package to create and add to the return
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommerceRuntimePackage'
            text/json:
              schema:
                $ref: '#/components/schemas/CommerceRuntimePackage'
            text/plain:
              schema:
                $ref: '#/components/schemas/CommerceRuntimePackage'
          description: OK
      summary: Add Package to Return
      tags:
      - Return
      operationId: postCommerceReturnsByReturnIdPackages
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/returns/{returnId}/autorefund:
    post:
      description: Attempt to automatically refund the return
      parameters:
      - description: Return Id
        in: path
        name: returnId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/AutoRefundRequest'
              type: array
        description: List of return item id with proccessing fee
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
            text/json:
              schema:
                $ref: '#/components/schemas/Return'
            text/plain:
              schema:
                $ref: '#/components/schemas/Return'
          description: OK
      summary: Auto Refund Return
      tags:
      - Return
      operationId: postCommerceReturnsByReturnIdAutorefund
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/returns/{returnId}/payments/actions:
    post:
      description: Sets the action of the specified payment transaction interaction. Available actions depend on the current status of the payment transaction.If in doubt, get a list of available payment actions first.
      parameters:
      - description: ''
        in: path
        name: returnId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAction'
        description: Action to specify. Possible actions can be "Create," "Capture," "Void," "AuthCapture," or "ReceiveCheck."
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
            text/json:
              schema:
                $ref: '#/components/schemas/Return'
            text/plain:
              schema:
                $ref: '#/components/schemas/Return'
          description: OK
      summary: Create Payment Action For Return
      tags:
      - Return
      operationId: postCommerceReturnsByReturnIdPaymentsActions
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/returns/{returnId}/shipments:
    post:
      description: Creates a shipment by grouping together multiple packages into logical shipments.
      parameters:
      - description: Unique identifier of the order which is ready to be shipped.
        in: path
        name: returnId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
        description: Package ids to use in creating shipments.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CommerceRuntimePackage'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/CommerceRuntimePackage'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/CommerceRuntimePackage'
                type: array
          description: OK
      summary: Create Return Shipment
      tags:
      - Return
      operationId: postCommerceReturnsByReturnIdShipments
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/returns/{returnId}/ship:
    post:
      description: Creates a child order for the return for processing replacements. The request body (a collection of ReturnItemSpecifier) is optional. If the body is empty, the operation replaces all remaining items marked for replace. If you want to replace only a specific item(s) marked for return, you must specify the item(s) in the request body.
      parameters:
      - description: The ID of the parent return
        in: path
        name: returnId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/ReturnItemSpecifier'
              type: array
        description: Optionally specify which items to include and in what quantities
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            text/json:
              schema:
                $ref: '#/components/schemas/Order'
            text/plain:
              schema:
                $ref: '#/components/schemas/Order'
          description: OK
      summary: Create Return Shipping Order
      tags:
      - Return
      operationId: postCommerceReturnsByReturnIdShip
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/returns/{orderId}/items/{orderItemId}:
    delete:
      description: Removes a particular return item from the return of the current shopper.
      parameters:
      - description: ''
        in: query
        name: returnId
        schema:
          type: string
      - description: Unique identifier of the order item.
        in: query
        name: returnItemId
        schema:
          type: string
      - in: path
        name: orderId
        required: true
        schema:
          type: string
      - in: path
        name: orderItemId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
            text/json:
              schema:
                $ref: '#/components/schemas/Return'
            text/plain:
              schema:
                $ref: '#/components/schemas/Return'
          description: OK
      summary: Delete Order Item
      tags:
      - Return
      operationId: deleteCommerceReturnsByOrderIdItemsByOrderItemId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/returns/{returnId}/disposition:
    post:
      description: Restock return items at a disposition location.
      parameters:
      - description: Return ID
        in: path
        name: returnId
        required: true
