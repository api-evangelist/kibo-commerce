openapi: 3.2.0
info:
  title: Kibo Commerce Product Options API
  version: '1.0'
  description: 'Operations tagged ProductOptions across 2 of this provider''s published API definitions: openapi_openapi_catalog_admin.json, kibo-commerce-catalog-admin-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: ProductOptions
paths:
  /commerce/catalog/admin/products/{productCode}/Options/{attributeFQN}:
    delete:
      description: Delete a individual option for a product.
      parameters:
      - description: ''
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: ''
        in: path
        name: attributeFQN
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete Product Option
      tags:
      - ProductOptions
      operationId: deleteCommerceCatalogAdminProductsByProductCodeOptionsByAttributeFQN
      x-operation-id-source: derived
    get:
      description: Get an individual option for a product. This current version of the Products API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access product data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
      parameters:
      - description: ''
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: ''
        in: path
        name: attributeFQN
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
