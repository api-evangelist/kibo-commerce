      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogAdminsProductOption'
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsProductOption'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsProductOption'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogAdminsProductOption'
          description: OK
      summary: Update Product Option
      tags:
      - ProductOptions
      operationId: putCommerceCatalogAdminProductsByProductCodeOptionsByAttributeFQN
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/products/{productCode}/Options:
    get:
      description: Get options for a product. This current version of the Products API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access product data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
