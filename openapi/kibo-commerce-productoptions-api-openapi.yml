      operationId: getCommerceCatalogAdminProductsByProductCodeOptions
      x-operation-id-source: derived
    post:
      description: Add an option to a product. This current version of the Products API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access product data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
