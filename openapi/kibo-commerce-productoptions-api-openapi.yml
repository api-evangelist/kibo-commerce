        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsProductOption'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsProductOption'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogAdminsProductOption'
          description: OK
      summary: Get Product Option
      tags:
      - ProductOptions
      operationId: getCommerceCatalogAdminProductsByProductCodeOptionsByAttributeFQN
      x-operation-id-source: derived
    put:
      description: Update an individual option for a product. This current version of the Products API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access product data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
      parameters:
      - description: ''
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: ''
