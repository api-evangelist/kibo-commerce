openapi: 3.2.0
info:
  title: Kibo Commerce Return Settings API
  version: '1.0'
  description: 'Operations tagged ReturnSettings across 2 of this provider''s published API definitions: openapi_openapi_settings.json, kibo-commerce-settings-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: ReturnSettings
paths:
  /commerce/settings/return/returnsettings:
    get:
      description: 'Retrieves return settings which includes return processing fee, return shipping location

        and return label creation on fulfillment'
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnSettings'
            text/json:
              schema:
                $ref: '#/components/schemas/ReturnSettings'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReturnSettings'
          description: OK
      summary: Get Return Settings
      tags:
      - ReturnSettings
      operationId: getCommerceSettingsReturnReturnsettings
      x-operation-id-source: derived
    post:
      description: 'Creates return settings which includes return processing fee, return shipping location

        and return label creation on fulfillment'
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnSettings'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnSettings'
            text/json:
              schema:
                $ref: '#/components/schemas/ReturnSettings'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReturnSettings'
          description: OK
      summary: Create Return Settings
      tags:
      - ReturnSettings
      operationId: postCommerceSettingsReturnReturnsettings
      x-operation-id-source: derived
    put:
      description: 'Modifies existing fulfillment settings which includes return processing fee, return shipping location

        and return label creation on fulfillment'
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnSettings'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnSettings'
            text/json:
              schema:
                $ref: '#/components/schemas/ReturnSettings'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReturnSettings'
          description: OK
      summary: Update Return Settings
      tags:
      - ReturnSettings
      operationId: putCommerceSettingsReturnReturnsettings
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    ReturnSettings:
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        createLabelOnFulfillment:
          type: boolean
        defaultProcessingFee:
          format: double
          type: number
        defaultShippingLocation:
          type:
          - string
          - 'null'
        displayRefundToNewGiftCard:
          type: boolean
        refundShippingAndHandling:
          type: boolean
        returnOrCreditOnImportedOrders:
          type: boolean
        updateInventoryOnRestock:
          type: boolean
        useFulfillmentLocationAsReturnLocation:
          type: boolean
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_settings.json
- kibo-commerce-settings-openapi.yml
