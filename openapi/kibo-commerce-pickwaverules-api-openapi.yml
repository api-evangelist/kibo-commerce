components:
  schemas:
    PickWaveRule:
      description: Represents a rule for pick wave in the product administration system.
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        code:
          description: 'Gets or sets the unique identifier of the PickWaveRule.

            If not given provided on create one will be assigned. Read-only after creation.'
          type:
          - string
          - 'null'
        customerRules:
          description: Gets or sets the list of Customer Rule where the PickWaveRule applies.
          items:
            type: string
          type:
          - array
          - 'null'
        description:
          description: Gets or sets the description of the PickWaveRule.
          type:
          - string
          - 'null'
        enabled:
          description: Gets or sets whether the PickWaveRule is enabled.
          type:
          - boolean
          - 'null'
        endDate:
          description: End of the rule's effective window. Null = never expires. Must be >= StartDate when both supplied.
          format: date-time
          type:
          - string
          - 'null'
        isActive:
          description: 'Read-only. Computed server-side: true when the current UTC instant is inside the effective window

            (StartDate null/≤now AND EndDate null/≥now), false otherwise. A rule with no dates is always active.

            This reflects the effective window alone and does not incorporate the enabled flag.'
          type:
          - boolean
          - 'null'
        name:
          description: Gets or sets the name of the PickWaveRule.
          type:
          - string
          - 'null'
        productRules:
          description: Gets or sets the list of product rules associated with the PickWaveRule.
          items:
            $ref: '#/components/schemas/ProductRuleCode'
          type:
          - array
          - 'null'
        shipmentRules:
          description: Gets or sets the list of Shipment Rule where the PickWaveRule applies.
          items:
            $ref: '#/components/schemas/ShipmentRuleCode'
          type:
          - array
          - 'null'
        startDate:
          description: Start of the rule's effective window. Null = no lower bound (already active).
          format: date-time
          type:
          - string
          - 'null'
      type: object
    ProductRuleCode:
      properties:
        code:
          description: Unique identifier of the ProductRule. System-supplied and read-only.
          type:
          - string
          - 'null'
        masterCatalogId:
          description: Master Catalog Id of the ProductRule.
          format: int32
          type: integer
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    ShipmentRuleCode:
      properties:
        code:
          description: Unique identifier of the ProductRule. System-supplied and read-only.
          type:
          - string
          - 'null'
      type: object
    PickWaveRuleCollection:
      description: Represents a collection of Pick Wave Rules.
      properties:
        items:
          items:
            $ref: '#/components/schemas/PickWaveRule'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
  securitySchemes:
    bearerAuth:
