openapi: 3.2.0
info:
  title: Kibo Commerce Drop Ship API
  version: '1.0'
  description: 'Operations tagged DropShip across 2 of this provider''s published API definitions: openapi_openapi_dropship.json, kibo-commerce-dropship-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: DropShip
paths:
  /commerce/dropship/invoice/{shipmentNumber}:
    get:
      parameters:
      - description: The shipment number to generate EDI 810 for
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSet810'
            text/json:
              schema:
                $ref: '#/components/schemas/TransactionSet810'
            text/plain:
              schema:
                $ref: '#/components/schemas/TransactionSet810'
          description: OK
      summary: Generates an EDI 810 Invoice for the specified shipment
      tags:
      - DropShip
      operationId: getCommerceDropshipInvoiceByShipmentNumber
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/dropship/purchaseorder/{shipmentNumber}:
    get:
      description: Generates an EDI 850 Purchase Order (returned as JSON) for the specified shipment, resolving the vendor, contracted pricing, and ship-to address from the shipment's fulfillment location. See the Dropship Developer Guide for the complete segment mapping, validation rules, and workflow.
      parameters:
      - description: The shipment number to generate EDI 850 for
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSet'
            text/json:
              schema:
                $ref: '#/components/schemas/TransactionSet'
            text/plain:
              schema:
                $ref: '#/components/schemas/TransactionSet'
          description: OK
      summary: Retrieve EDI 850 Purchase Order
      tags:
      - DropShip
      operationId: getCommerceDropshipPurchaseorderByShipmentNumber
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/dropship/translate/{shipmentNumber}:
    get:
      description: Translates a shipment into a lightweight response containing vendor SKU mappings and contracted pricing per item. See the Dropship Developer Guide for field details and behavior.
      parameters:
      - description: The shipment number to translate
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedShipment'
            text/json:
              schema:
                $ref: '#/components/schemas/TranslatedShipment'
            text/plain:
              schema:
                $ref: '#/components/schemas/TranslatedShipment'
          description: OK
      summary: Translate Shipment
      tags:
      - DropShip
      operationId: getCommerceDropshipTranslateByShipmentNumber
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
