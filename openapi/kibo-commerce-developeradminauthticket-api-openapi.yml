openapi: 3.2.0
info:
  title: Kibo Commerce Developer Admin Auth Ticket API
  version: '1.0'
  description: 'Operations tagged DeveloperAdminAuthTicket across 3 of this provider''s published API definitions: openapi_openapi_tenant_and_user.json, kibo-commerce-tenant-and-user-openapi.yml, kibo-commerce-user-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: DeveloperAdminAuthTicket
paths:
  /platform/developer/authtickets:
    delete:
      description: Logs out a user by deleting the refresh token
      parameters:
      - description: The refresh token to delete.
        in: query
        name: refreshToken
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete User Auth Ticket
      tags:
      - DeveloperAdminAuthTicket
      operationId: deletePlatformDeveloperAuthtickets
      x-operation-id-source: derived
    post:
      description: Authenticates a user for a particular tenant given a set of user credentials adn a tenantId.
      parameters:
      - description: The users developer account Id
        in: query
        name: developerAccountId
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAuthInfo'
        description: User's email address and password.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperAdminUserAuthTicket'
            text/json:
              schema:
                $ref: '#/components/schemas/DeveloperAdminUserAuthTicket'
            text/plain:
              schema:
                $ref: '#/components/schemas/DeveloperAdminUserAuthTicket'
          description: OK
      summary: Create Developer User Auth Ticket
      tags:
      - DeveloperAdminAuthTicket
      operationId: postPlatformDeveloperAuthtickets
      x-operation-id-source: derived
    put:
      description: Reauthenticates the current user for a different tenant. If the user does not have access to the tenant, the operation fails.
      parameters:
      - description: The users developer account Id
        in: query
        name: developerAccountId
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeveloperAdminUserAuthTicket'
        description: An existing valid auth ticket containing the refresh token.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperAdminUserAuthTicket'
            text/json:
              schema:
                $ref: '#/components/schemas/DeveloperAdminUserAuthTicket'
            text/plain:
              schema:
                $ref: '#/components/schemas/DeveloperAdminUserAuthTicket'
          description: OK
      summary: Refresh Developer Auth Ticket
      tags:
      - DeveloperAdminAuthTicket
      operationId: putPlatformDeveloperAuthtickets
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    DeveloperAdminUserAuthTicket:
      properties:
        accessToken:
          type:
          - string
          - 'null'
        accessTokenExpiration:
          format: date-time
          type: string
        account:
          $ref: '#/components/schemas/DeveloperAccount'
        availableAccounts:
          items:
            $ref: '#/components/schemas/DeveloperAccount'
          type:
          - array
          - 'null'
        createdOn:
          format: date-time
          type: string
        grantedBehaviors:
          items:
            format: int32
            type: integer
          type:
          - array
          - 'null'
        jwtAccessToken:
          type:
          - string
          - 'null'
        refreshToken:
          type:
          - string
          - 'null'
        refreshTokenExpiration:
          format: date-time
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'
      type: object
    UserAuthInfo:
      properties:
        emailAddress:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
        userName:
          type:
          - string
          - 'null'
      type: object
    DeveloperAccount:
      properties:
        id:
          format: int32
          type: integer
        name:
          type:
          - string
          - 'null'
      type: object
    UserProfile:
      properties:
        emailAddress:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        userId:
          type:
          - string
          - 'null'
        userName:
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
