openapi: 3.2.0
info:
  title: Kibo Commerce Return Rules API
  version: '1.0'
  description: 'Operations tagged ReturnRules across 2 of this provider''s published API definitions: openapi_openapi_catalog_admin.json, kibo-commerce-catalog-admin-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: ReturnRules
paths:
  /commerce/rules/return/{code}:
    delete:
      description: Deletes a return rule by code.
      parameters:
      - description: The code of the Return rule to delete.
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete Return Rule
      tags:
      - ReturnRules
      operationId: deleteCommerceRulesReturnByCode
      x-operation-id-source: derived
    get:
      description: Gets return rule details by code.
      parameters:
      - description: The code of the Return rule.
        in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ReturnRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReturnRule'
          description: OK
      summary: Get Return Rule by Code
      tags:
      - ReturnRules
      operationId: getCommerceRulesReturnByCode
      x-operation-id-source: derived
    put:
      description: Updates an existing return rule.
      parameters:
      - description: The code of the Return rule to update.
        in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRule'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ReturnRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReturnRule'
          description: OK
      summary: Update Return Rule
      tags:
      - ReturnRules
      operationId: putCommerceRulesReturnByCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/rules/return:
    get:
      description: Gets a collection of return rules according to any specified filter criteria and sort options.
      parameters:
      - description: The start index for pagination.
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - description: The page size for pagination.
        in: query
        name: pageSize
        schema:
          default: 0
          format: int32
          type: integer
      - description: The sort by parameter.
        in: query
        name: sortBy
        schema:
          type: string
      - description: The filter parameter.
        in: query
        name: filter
        schema:
          type: string
      - description: The response groups parameter.
        in: query
        name: responseGroups
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRuleCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ReturnRuleCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReturnRuleCollection'
          description: OK
      summary: Get Return Rules
      tags:
      - ReturnRules
      operationId: getCommerceRulesReturn
      x-operation-id-source: derived
    post:
      description: Creates a new return rule.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRule'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ReturnRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReturnRule'
          description: OK
      summary: Create Return Rule
      tags:
      - ReturnRules
      operationId: postCommerceRulesReturn
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/rules/return/{code}/rank:
    put:
      description: Updates the rank for a return rule and rearranges the ranks of all other rules accordingly.
      parameters:
      - description: ''
        in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRankRequest'
      responses:
        '200':
          description: OK
      summary: Update Return Rule Rank
      tags:
      - ReturnRules
      operationId: putCommerceRulesReturnByCodeRank
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    UpdateRankRequest:
      description: Represents a request to update the rank of a SafetyStock, PurchaseLimit and Return Rule.
      properties:
        code:
          description: 'Gets or sets the code of the rule to be updated.

            It can be SafetyStock Code , PurchaseLimit Code or Return Rule Code'
          type:
          - string
          - 'null'
        newRank:
          description: Gets or sets the new rank of the rule.
          format: int32
          type: integer
        oldRank:
          description: Gets or sets the old rank of the rule.
          format: int32
          type: integer
      type: object
    ReturnRuleCollection:
      description: Return Rule collection contract
      properties:
        items:
          items:
            $ref: '#/components/schemas/ReturnRule'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    ReturnRule:
      description: Return Rule contract
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        code:
          description: Unique identifier of the Return.
          type:
          - string
          - 'null'
        customerRules:
          description: List of customer rule codes that apply to the Return
          items:
            type: string
          type:
          - array
          - 'null'
        description:
          description: Return description
          type:
          - string
          - 'null'
        enabled:
          description: Indicates if the Return is enabled
          type:
          - boolean
          - 'null'
        endDate:
          description: End of the rule's effective window. Null = never expires. Must be >= StartDate when both supplied.
          format: date-time
          type:
          - string
          - 'null'
        isActive:
          description: 'Read-only. Computed server-side: true when the current UTC instant is inside the effective window

            (StartDate null/≤now AND EndDate null/≥now), false otherwise. A rule with no dates is always active.

            This reflects the effective window alone and does not incorporate the enabled flag.'
          type:
          - boolean
          - 'null'
        isReturnable:
          description: Indicates if the Return is IsReturnable
          type:
          - boolean
          - 'null'
        maxDays:
          description: Maximum Days of the Return
          format: int32
          type:
          - integer
          - 'null'
        maxQty:
          description: Maximum quantity of the Return
          format: int32
          type:
          - integer
          - 'null'
        metaData:
          description: Metadata for the ReturnRule which is a json format, used to store additional information
        name:
          description: Return name
          type:
          - string
          - 'null'
        productRules:
          description: List of product rule codes that apply to the Return
          items:
            type: string
          type:
          - array
          - 'null'
        rank:
          description: Rank of the Return
          format: int32
          type: integer
        startDate:
          description: Start of the rule's effective window. Null = no lower bound (already active).
          format: date-time
          type:
          - string
          - 'null'
        validForAllSites:
          description: Indicates if the ReturnRule is valid for all sites
          type:
          - boolean
          - 'null'
        validSites:
          description: List of site IDs that the ReturnRule is valid for
          items:
            format: int32
            type: integer
          type:
          - array
          - 'null'
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
