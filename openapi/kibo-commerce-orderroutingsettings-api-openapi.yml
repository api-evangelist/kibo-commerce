components:
  schemas:
    APIErrorResponse:
      properties:
        additionalInfo:
          type: string
        errorMessage:
          type: string
      type: object
    OrderRoutingSettings:
      properties:
        allowInternationalAssignment:
          type: boolean
        autoAssignLimit:
          format: int32
          type: integer
        defaultStateChange:
          enum:
          - CANCEL
          - CUSTOMER_CARE
          - AVAILABLE
          - BACKORDER
          type: string
        failoverActions:
          items:
            enum:
            - LINE_ITEM_SPLIT_ASSIGN_IF_FULFILLED
            - LINE_ITEM_SPLIT_CANCEL_WITHOUT_INVENTORY
            - QUANTITY_SPLIT_ASSIGN_IF_FULFILLED
            - QUANTITY_SPLIT_CANCEL_WITHOUT_INVENTORY
            - CANCEL_ORDER
            - ASSIGN_TO_CUSTOMER_CARE
            - ASSIGN_TO_GROUP
            - LINE_ITEM_SPLIT_ASSIGN_CUSTOMER_CARE_WITHOUT_INVENTORY
            - QUANTITY_SPLIT_ASSIGN_CUSTOMER_CARE_WITHOUT_INVENTORY
            - SEND_ORDER_TO_BIDDING
            - LINE_ITEM_SPLIT_BACKORDER_WITHOUT_INVENTORY
            - QUANTITY_SPLIT_BACKORDER_WITHOUT_INVENTORY
            - ASSIGN_TO_BACKORDER
            type: string
          type: array
          uniqueItems: true
        filterAttributes:
          items:
            $ref: '#/components/schemas/FilterAttribute'
          type: array
          uniqueItems: true
        maxFulfillingLocations:
          format: int32
          type: integer
        maxSplitItemLocations:
          format: int32
          type: integer
        productIdentifierMapping:
          enum:
          - PART_NUMBER_ONLY
          - UPC_ONLY
          - SKU_ONLY
          - PART_NUMBER_AND_UPC
          - PART_NUMBER_AND_SKU
          - UPC_AND_SKU
          - PART_NUMBER_AND_UPC_AND_SKU
          type: string
        siteID:
          format: int32
          type: integer
        tenantID:
          format: int32
          type: integer
        tooManyAssignsAction:
          enum:
          - CANCEL
          - CUSTOMER_CARE
          - AVAILABLE
          - BACKORDER
          type: string
      required:
      - allowInternationalAssignment
      - defaultStateChange
      - tooManyAssignsAction
      type: object
    FilterAttribute:
      properties:
        extensibleAttributeFQN:
          type: string
        filterTypeGroup:
          enum:
          - ORDER_INFO
          - FULFILLMENT_LOCATION_INFO
          - FULFILLMENT_INVENTORY_INFO
          - ITEM_ATTRIBUTES
          - CUSTOMER_INFORMATION
          - CALL_OFF_ORDER_INFO
          - CALL_OFF_ORDER_ITEM_ATTRIBUTES
          - UNKNOWN
          - EXTENSIBLE_FULFILLMENT_LOCATION_INFO
          - EXTENSIBLE_ORDER_INFO
          - EXTENSIBLE_PRODUCT_INFO
          - EXTENSIBLE_CUSTOMER_INFO
          - EXTENSIBLE_B2B_CUSTOMER_INFO
          - EXTENSIBLE_INVENTORY_INFO
          - EXTENSIBLE_CALL_OFF_INFO
          - EXTENSIBLE_CALL_OFF_ORDER_ITEM_INFO
          type: string
        langTag:
          type: string
        name:
          type: string
        propertyPath:
          type: string
        unitType:
          enum:
          - unit.type.currency
          - unit.type.distance
          - unit.type.length
          - unit.type.volume
          - unit.type.area
          - unit.type.weight
          - unit.type.dimensionless
          type: string
        vocabularyListValues:
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
