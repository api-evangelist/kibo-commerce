openapi: 3.2.0
info:
  title: Kibo Commerce Categories API
  version: '1.0'
  description: 'Operations tagged Categories across 4 of this provider''s published API definitions: openapi_openapi_catalog_admin.json, openapi_openapi_catalog_storefront.json, kibo-commerce-catalog-admin-openapi.yml, kibo-commerce-catalog-storefront-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Categories
paths:
  /commerce/catalog/admin/categories/{categoryId}/add-products:
    post:
      description: Adds the products in the provided product code list to the specified category.
      parameters:
      - description: Unique identifier of the category that you want produts added to.
        in: path
        name: categoryId
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
        description: A list of products to be added to the category.
      responses:
        '200':
          description: OK
      summary: Add Products to Category
      tags:
      - Categories
      operationId: postCommerceCatalogAdminCategoriesByCategoryIdAddProducts
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/categories:
    get:
      description: Retrieves a list of categories according to any specified filter criteria and sort options. This current version of the Categories API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access category data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
      parameters:
      - description: Used to page results from a query. Indicates the zero-based offset in the complete result set where the returned entities begin. The default value is 0.
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - description: Used to page results from a query. Indicates the maximum number of entities to return from a query. The default value is 20 and the maximum value is 200.
        in: query
        name: pageSize
        schema:
          default: 0
          format: int32
          type: integer
      - description: The element to sort the results by and the order in which the results appear. Either ascending (a-z) or descending (z-a) order.
        in: query
        name: sortBy
        schema:
          type: string
      - description: 'A set of filter expressions representing the search parameters for a query: eq=equals, ne=not equals, gt=greater than, lt = less than or equals, gt = greater than or equals, lt = less than or equals, sw = starts with, or cont = contains. Optional.'
        in: query
        name: filter
        schema:
          type: string
      - in: query
        name: includeAttributes
        schema:
          default: false
          type: boolean
      - description: ''
        in: query
        name: responseGroups
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPagedCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/CategoryPagedCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/CategoryPagedCollection'
          description: OK
      summary: Get Categories
      tags:
      - Categories
      operationId: getCommerceCatalogAdminCategories
      x-operation-id-source: derived
    post:
      description: Adds a new category to the catalog's category hierarchy. Specify a ParentCategoryID to determine where to locate the category in the hierarchy; if not specified it becomes a top-level category. This current version of the Categories API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access category data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
      parameters:
      - description: Sets the sequence number of the category to the current max sequence value plus 1 (e.g. 5 + 1 = 6)
        in: query
        name: incrementSequence
        schema:
          default: false
          type: boolean
      - description: If true, the provided Id value will be used as the CategoryId. If omitted or false, the system will generate a CategoryId
        in: query
        name: useProvidedId
        schema:
          default: false
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogAdminsCategory'
        description: Properties of the new category. Required properties ParentCategoryID and Content.Name.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsCategory'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsCategory'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogAdminsCategory'
          description: OK
      summary: Add Category
      tags:
      - Categories
      operationId: postCommerceCatalogAdminCategories
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/categories/{categoryId}:
    delete:
      description: Deletes the category specified by its category ID. This current version of the Categories API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access category data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
      parameters:
      - description: Unique identifier of the category that you want to delete.
        in: path
        name: categoryId
        required: true
        schema:
          format: int32
          type: integer
      - description: If true, any subcategories of a category are deleted when this category is deleted. Otherwise only the given category is deleted. Default is false.
        in: query
        name: cascadeDelete
        schema:
          default: false
          type: boolean
      - description: If true, category (and optionally subcategories) will be deleted even if there are products referecing them.  Default is false.
        in: query
        name: forceDelete
        schema:
          default: false
          type: boolean
      - description: If true, and child categories of the given category will be reassigned to the parent of the given category. Only applies if cascadeDelete is false. Default is false.
        in: query
        name: reassignToParent
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: OK
      summary: Delete Category
      tags:
      - Categories
      operationId: deleteCommerceCatalogAdminCategoriesByCategoryId
      x-operation-id-source: derived
    get:
      description: Retrieves the details of a single category. This current version of the Categories API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access category data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
      parameters:
      - description: Unique identifier of the category.
        in: path
        name: categoryId
        required: true
        schema:
          format: int32
          type: integer
      - in: query
        name: includeAttributes
        schema:
          default: false
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsCategory'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsCategory'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogAdminsCategory'
          description: OK
      summary: Get Category
      tags:
      - Categories
      operationId: getCommerceCatalogAdminCategoriesByCategoryId
      x-operation-id-source: derived
    put:
      description: 'Modifies a category such as moving it to another location in the category tree, or changing whether it is visible on the storefront. This PUT replaces the existing resource, so be sure to include all the information that you want to maintain for the category. Any unspecified properties are set to null.


        This current version of the Categories API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access category data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".'
      parameters:
      - description: Unique identifier of the category that you want to modify. Required.
        in: path
        name: categoryId
        required: true
        schema:
          format: int32
          type: integer
      - description: If true, when changing the display option for the category, change it for all subcategories also. Optional.
        in: query
        name: cascadeVisibility
        schema:
          default: false
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogAdminsCategory'
        description: Properties of the category that you want to modify. Required properties ParentCategoryID and Content.Name.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsCategory'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsCategory'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogAdminsCategory'
          description: OK
      summary: Update Category
      tags:
      - Categories
      operationId: putCommerceCatalogAdminCategoriesByCategoryId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
