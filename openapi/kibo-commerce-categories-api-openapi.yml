  /commerce/catalog/storefront/categories:
    get:
      description: Retrieves a list of product categories that appear on the storefront as a flat list. Hidden categories do not appear in the list.
      parameters:
      - description: "Optional. A set of filter expressions representing the search parameters for a query:\n            eq=equals, ne=not equals, gt=greater than, lt = less than, gt = greater than or equals, le = less than or equals,\n            sw = starts with, or cont = contains."
        in: query
        name: filter
        schema:
          type: string
      - description: "Optional. Used to page results from a query.\n            Indicates the zero-based offset in the complete result set where the returned entities begin.\n            For example, with a pageSize of 25, to get the 51st through the 75th items, startIndex=3.\n            The default value is 0."
        in: query
        name: startIndex
        schema:
          format: int32
          type: integer
      - description: "Optional. Used to page results from a query.\n            Indicates the maximum number of entities to return from a query. Default value: 20. Maximum value: 200."
        in: query
        name: pageSize
        schema:
