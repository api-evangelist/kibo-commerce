openapi: 3.2.0
info:
  title: Kibo Commerce Storefront Products API
  version: '1.0'
  description: 'Operations tagged StorefrontProducts across 2 of this provider''s published API definitions: openapi_openapi_catalog_storefront.json, kibo-commerce-catalog-storefront-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: StorefrontProducts
paths:
  /commerce/catalog/storefront/products/{productCode}/configure:
    post:
      description: Configure a new product selection. This occurs each time a shopper selects a product option as they configure a product. Once all the required product options are configured, the product can be added to a cart.
      parameters:
      - description: 'Merchant-created code for the product being configured, for example, a SKU. Max length: 30.'
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: If true, the response returns product details such as. If false, returns a product summary such as the product name, price, and sale price.
        in: query
        name: includeOptionDetails
        schema:
          type: boolean
      - description: Determines whether or not to check inventory on an item when validating
        in: query
        name: skipInventoryCheck
        schema:
          default: false
          type: boolean
      - description: Optional.  If specified, will be used for returning pricing based on volume if applicable.  Defaults to 1 if not specified.
        in: query
        name: quantity
        schema:
          format: int32
          type: integer
      - description: ''
        in: query
        name: purchaseLocation
        schema:
          type: string
      - description: ''
        in: query
        name: variationProductCodeFilter
        schema:
          type: string
      - description: ''
        in: query
        name: useSubscriptionPricing
        schema:
          default: false
          type: boolean
      - description: ''
        in: query
        name: subscriptionFrequency
        schema:
          type: string
      - description: ''
        in: query
        name: customerSegments
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductOptionSelections'
        description: Shopper-selected options.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguredProduct'
            text/json:
              schema:
                $ref: '#/components/schemas/ConfiguredProduct'
            text/plain:
              schema:
                $ref: '#/components/schemas/ConfiguredProduct'
          description: OK
      summary: Configure Variation Product
      tags:
      - StorefrontProducts
      operationId: postCommerceCatalogStorefrontProductsByProductCodeConfigure
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/products/locationinventory:
    post:
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInventoryQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationInventoryCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/LocationInventoryCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/LocationInventoryCollection'
          description: OK
      summary: Get location inventories for a list of products
      tags:
      - StorefrontProducts
      operationId: postCommerceCatalogStorefrontProductsLocationinventory
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/products/{productCode}/locationinventory:
    get:
      description: Get product inventory. You can provide up to a maximum of 200 product codes and 200 location codes in the endpoint by default.
      parameters:
      - in: path
        name: productCode
        required: true
        schema:
          type: string
      - in: query
        name: locationCodes
        schema:
          type: string
      - in: query
        name: includeFutureInventory
        schema:
          default: false
          type: boolean
      - in: query
        name: includeSegmentedInventory
        schema:
          default: false
          type: boolean
      - in: query
        name: serialNumber
        schema:
          type: string
      - in: query
        name: condition
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationInventoryCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/LocationInventoryCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/LocationInventoryCollection'
          description: OK
      summary: Get Location Inventory
      tags:
      - StorefrontProducts
      operationId: getCommerceCatalogStorefrontProductsByProductCodeLocationinventory
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/products/{productCode}:
    get:
      description: Retrieves information about a single product given its product code.
      parameters:
      - description: 'Required. Merchant-created code associated with the product, for example, a SKU. Max length: 30.'
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: 'Optional. Merchant-created code associated with a specific product variation. Max length: #.'
        in: query
        name: variationProductCode
        schema:
          type: string
      - description: Optional. Response groups to be determined.
        in: query
        name: responseGroups
        schema:
          type: string
      - description: Optional. If true, return a product if it is located but inactive.
        in: query
        name: allowInactive
        schema:
          type: boolean
      - description: Determines whether or not to check inventory on an item when validating
        in: query
        name: skipInventoryCheck
        schema:
          default: false
          type: boolean
      - description: Optional. If true, will still return the product, even if product is out of stock and the out of stock behavior is set to “Hide Product in Store”. If false or omitted, the same product will return a 404 not found. Suppressing the 404 not found is useful for site SEO.
        in: query
        name: supressOutOfStock404
        schema:
          default: false
          type: boolean
      - description: Optional.  If specified, will be used for returning pricing based on volume if applicable.  Defaults to 1 if not specified.
        in: query
        name: quantity
        schema:
          format: int32
          type: integer
      - in: query
        name: acceptVariantProductCode
        schema:
          default: false
          type: boolean
      - in: query
        name: purchaseLocation
        schema:
          type: string
      - in: query
        name: variationProductCodeFilter
        schema:
          type: string
      - in: query
        name: sliceValue
        schema:
          type: string
      - in: query
        name: includeAllImages
        schema:
          default: false
          type: boolean
      - in: query
        name: useSubscriptionPricing
        schema:
          default: false
          type: boolean
      - in: query
        name: customerSegments
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProduct'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProduct'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProduct'
          description: OK
      summary: Get Product
      tags:
      - StorefrontProducts
      operationId: getCommerceCatalogStorefrontProductsByProductCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/products/costs:
    post:
      description: Get costs for products. This cost is the amount the merchant pays for the product—it is not the price that the shopper sees on the storefront (which is usually higher).
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCostQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCostCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductCostCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductCostCollection'
          description: OK
      summary: Get Product Costs
      tags:
      - StorefrontProducts
      operationId: postCommerceCatalogStorefrontProductsCosts
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/products/indexing/{productCode}:
    get:
      description: Retrieves information about a single product given its product code for Mozu to index in the search engine
      parameters:
      - description: 'Required. Merchant-created code associated with the product, for example, a SKU. Max length: 30.'
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: Optional. Response groups to be determined.
        in: query
        name: responseGroups
        schema:
          type: string
      - description: "Optional. The current version of the product to use for latency checking. \n            \tIf this instance of Product Runtime is configured to run against a replicated database node that has a lesser version than this value, it will read from the primary database node to prevent stale data."
        in: query
        name: productVersion
        schema:
          format: int64
          type: integer
      - in: query
        name: lastModifiedDate
        schema:
          format: date-time
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductForIndexing'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductForIndexing'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductForIndexing'
          description: OK
      summary: Get Product for Indexing
      tags:
      - StorefrontProducts
      operationId: getCommerceCatalogStorefrontProductsIndexingByProductCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/products/{productCode}/substitutions:
    get:
      description: Returns a list of up to 10 products that can be substituted for the provided product code.
      parameters:
      - in: path
        name: productCode
        required: true
        schema:
          type: string
      - in: query
        name: preferredProductCode
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSubstituteCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductSubstituteCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductSubstituteCollection'
          description: OK
      summary: Get Product Substitutions
      tags:
      - StorefrontProducts
      operationId: getCommerceCatalogStorefrontProductsByProductCodeSubstitutions
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/products:
    get:
      description: Retrieves a list of products that appear on the storefront according to any specified filter criteria and sort options.
      parameters:
      - description: 'Optional. A set of filter expressions representing the search parameters for a query: eq=equals, ne=not equals, gt=greater than, lt = less than, gt = greater than or equals, le = less than or equals, sw = starts with, or cont = contains.'
        in: query
        name: filter
        schema:
          type: string
      - description: 'Used to page results from a query. Indicates the zero-based offset in the complete result set where the returned entities begin. For example, with a pageSize of 25, to get the 51st through the 75th items, startIndex=3. Default value: 0.'
        in: query
        name: startIndex
        schema:
          format: int32
          type: integer
      - description: 'Used to page results from a query. Indicates the maximum number of entities to return from a single query. Default value: 20. Maximum value: 200.'
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: 'Optional. Sort the results by and the order in which the results appear. Either ascending order (a-z) which accepts ''asc'' or ''ASC'' or descending order (z-a) which accepts ''desc'' or ''DESC''. The sortBy parameter follows an available property. For example, to sort the results by “ID” ascending then by “CreateDate” descending, use: id asc,createdate desc.'
        in: query
        name: sortBy
        schema:
          type: string
      - description: Optional. Response groups to be determined.
        in: query
        name: responseGroups
        schema:
          type: string
      - description: ''
        in: query
        name: responseOptions
        schema:
          type: string
      - description: Pass in * to begin a deep page operation. The response will include a nextCursorMark value. Pass this into the next call. Continue with this pattern until nextCursorMark is null.
        in: query
        name: cursorMark
        schema:
          type: string
      - in: query
        name: defaultSort
        schema:
          type: string
      - in: query
        name: mid
        schema:
          type: string
      - description: Optional. If true return all images instead of default images.
        in: query
        name: includeAllImages
        schema:
          default: false
          type: boolean
      - in: query
        name: useSubscriptionPricing
        schema:
          default: false
          type: boolean
      - in: query
        name: includeProductDetailsOnlyProperty
        schema:
          default: false
          type: boolean
      - in: query
        name: collapse
        schema:
          default: false
          type: boolean
      - in: query
        name: customerSegments
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProductCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProductCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProductCollection'
          description: OK
      summary: Get Products
      tags:
      - StorefrontProducts
      operationId: getCommerceCatalogStorefrontProducts
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/products/{productCode}/validateDiscounts:
    post:
      description: Validate if a collection of discounts is valid for a product. This includes discounts that would normally be considered order level discounts.
      parameters:
      - description: ''
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: ''
        in: query
        name: variationProductCode
        schema:
          type: string
      - description: Customer Id may be set in the querystring or in the user claims bag if the caller context is a shopper.
        in: query
        name: customerAccountId
        schema:
          format: int32
          type: integer
      - description: ''
        in: query
        name: allowInactive
        schema:
          type: boolean
      - description: ''
        in: query
        name: skipInventoryCheck
        schema:
          default: false
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountSelections'
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountValidationSummary'
            text/json:
              schema:
                $ref: '#/components/schemas/DiscountValidationSummary'
            text/plain:
              schema:
                $ref: '#/components/schemas/DiscountValidationSummary'
          description: OK
      summary: Validate Discounts
      tags:
      - StorefrontProducts
      operationId: postCommerceCatalogStorefrontProductsByProductCodeValidateDiscounts
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/products/{productCode}/validate:
    post:
      description: Validate the final state of shopper-selected options.
      parameters:
      - description: Merchant-created code of product being validated.
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: Determines whether or not to check inventory on an item when validating
        in: query
        name: skipInventoryCheck
        schema:
          default: false
          type: boolean
      - description: Optional.  If specified, will be used for returning pricing based on volume if applicable.  Defaults to 1 if not specified.
        in: query
        name: quantity
        schema:
          format: int32
          type: integer
      - description: Determines whether or not to add configured default-extras on an item when validating
        in: query
        name: skipDefaults
        schema:
          default: false
          type: boolean
      - description: ''
        in: query
        name: purchaseLocation
        schema:
          type: string
      - description: ''
        in: query
        name: useSubscriptionPricing
        schema:
          default: false
          type: boolean
      - description: ''
        in: query
        name: recalculateDynamicCategories
        schema:
          default: false
          type: boolean
      - description: ''
        in: query
        name: acceptVariantProductCode
        schema:
          default: false
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductOptionSelections'
        description: Final state of shopper selected options.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductValidationSummary'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductValidationSummary'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductValidationSummary'
          description: OK
      summary: Validate Variant Product
      tags:
      - StorefrontProducts
      operationId: postCommerceCatalogStorefrontProductsByProductCodeValidate
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    AttributeDetail:
      description: Product Attribute properties common between a Product Propery, Option, and Extra
      properties:
        allowFilteringAndSortingInStorefront:
          description: Indicates whether the attribute should be able to be used in filters, facets, and sorting on the public storefront.
          type: boolean
        availableForOrderRouting:
          description: Indicates whether the attribute is available for order routing
          type: boolean
        customWeightInStorefrontSearch:
          description: Indicates whether the attribtue value is indexed so that it can have a custom relevency weight compared to other attributes in a tokenized text search
          type:
          - boolean
          - 'null'
        dataType:
          description: The DataType of the attribute. Valid values for DataType are defined in DataTypeTypeConst.
          type:
          - string
          - 'null'
        dataTypeSequence:
          description: A unique sequence of the attribute By dataType (used for common naming of fields in search index)
          format: int32
          type: integer
        description:
          description: Description of the attribute in the language specified by LocaleCode.
          type:
          - string
          - 'null'
        displayIntention:
          description: Am optional hint to the theme about how this attribute should be displayed (what control to use)
          type:
          - string
          - 'null'
        indexValueWithCase:
          description: Indicates whether the attribtue value is indexed with case or not
          type:
          - boolean
          - 'null'
        inputType:
          description: The InputType type of the attribute. Valid values for InputType are defined in InputTypeConst.
          type:
          - string
          - 'null'
        name:
          description: Name of the attribute in the language specified by LocaleCode.
          type:
          - string
          - 'null'
        searchDisplayValue:
          description: "If true, the system will index the display value of string attributes instead of the canonical value for searching. \nThe canonical value will always be used for filtering. Does not apply for for non-string attributes."
          type: boolean
        searchableInStorefront:
          description: Indicates whether the attribute value is searchable.
          type: boolean
        usageType:
          description: The UsageType of the attribute. Valid values for the usageType are defined in UsageTypeConst .
          type:
          - string
          - 'null'
        validation:
          $ref: '#/components/schemas/CatalogRuntimesAttributeValidation'
        valueType:
          description: The ValueType of the attribute. Valid values for ValueType are defined in ValueTypeTypeConst.
          type:
          - string
          - 'null'
      type: object
    CatalogRuntimesProductOptionValue:
      description: Value of product option..."red," "white," "blue."
      properties:
        attributeValueId:
          description: Unique Id for the Value
          format: int32
          type: integer
        bundledProduct:
          $ref: '#/components/schemas/CatalogRuntimesBundledProduct'
        deltaPrice:
          description: How much this option costs above the cost of the product.
          format: double
          type:
          - number
          - 'null'
        deltaWeight:
          description: How much this option weighs above the weight of the product.
          format: double
          type:
          - number
          - 'null'
        displayInfo:
          $ref: '#/components/schemas/CatalogRuntimesAttributeVocabularyValueDisplayInfo'
        isDefault:
          description: If true, this is the default value that the merchant supplied.
          type:
          - boolean
          - 'null'
        isEnabled:
          description: If true, this option is enabled and can be selected. During configuration, this returns false of this option value is invalid with other current selected options.
          type:
          - boolean
          - 'null'
        isSelected:
          description: If true, this is the option that is currently selected. It can be either the default value or one that the shopper has selected.
          type:
          - boolean
          - 'null'
        shopperEnteredValue:
          description: How much this option costs above the cost of the product.
        stringValue:
          description: Localized Value in the language of the locale code only available for dataType string
          type:
          - string
          - 'null'
        value: {}
      type: object
    CatalogRuntimesProductImageGroupTag:
      properties:
        attributeFqn:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      type: object
    CatalogRuntimesDiscount:
      description: Discount name and expiration date.
      properties:
        discountId:
          description: Unique identifier of the discount.
          format: int32
          type: integer
        expirationDate:
          description: Date when the discount expires.
          format: date-time
          type:
          - string
          - 'null'
        friendlyDescription:
          description: Description of the discount.
          type:
          - string
          - 'null'
        impact:
          description: The Impact of the individual Discount
          format: double
          type: number
        name:
          description: Name of the discount.
          type:
          - string
          - 'null'
      type: object
    VariationOption:
      properties:
        attributeFQN:
          type:
          - string
          - 'null'
        value: {}
        valueSequence:
          format: int32
          type: integer
      type: object
    CatalogRuntimesAttributeValidation:
      description: Used to validate attributes.
      properties:
        maxDateValue:
          description: For validating a DateTime attribute value, maximum datetime allowed.
          format: date-time
          type:
          - string
          - 'null'
        maxNumericValue:
          description: For validating Number attribute value, maximum number allowed.
          format: double
          type:
          - number
          - 'null'
        maxStringLength:
          description: For validating strings, maximum length allowed for a string.
          format: int32
          type:
          - integer
          - 'null'
        minDateValue:
          description: For validating a DateTime attribute value, minimum datetime allowed.
          format: date-time
          type:
          - string
          - 'null'
        minNumericValue:
