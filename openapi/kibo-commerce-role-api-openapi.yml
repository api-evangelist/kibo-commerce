      description: Retrieves a list of all roles defined for this tenant.
      parameters:
      - in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: pageSize
        schema:
          default: 25
          format: int32
          type: integer
      - description: Optional filter param to filter the roles
        in: query
        name: filter
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/RoleCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/RoleCollection'
          description: OK
      summary: Get Roles
      tags:
      - Role
      operationId: getPlatformAdminuserRoles
      x-operation-id-source: derived
