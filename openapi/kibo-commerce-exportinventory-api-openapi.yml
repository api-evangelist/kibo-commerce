      required: true
    CreateExportSettingsFTPRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateExportSettingsFTPRequest'
      description: Request to create a new Export Settings FTP
      required: true
    ExportInventoryRequest:
      content:
        application/json:
          schema:
