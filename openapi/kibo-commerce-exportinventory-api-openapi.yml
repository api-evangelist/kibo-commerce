          type: integer
      title: Export Inventory Request
      type: object
    ExportSettingsFTP:
      description: Export Settings FTP
      properties:
        active:
          description: Flag for Active State
          type: boolean
        controlFile:
          description: Control File
          type: string
        controlFileEmail:
          description: Control File Email
