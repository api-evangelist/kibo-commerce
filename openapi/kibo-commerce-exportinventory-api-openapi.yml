            $ref: '#/components/schemas/ExportSettingsS3'
          type: array
        safetyStock:
          description: Safety Stock
          enum:
          - SAFETY_STOCK_MAX
          - SAFETY_STOCK_MIN
          - SAFETY_STOCK_AVG
          - SAFETY_STOCK_SUM
          type: string
        shortenFilename:
          description: Flag for using shortened filenames
          type: boolean
        siteIDs:
          description: Site Ids associated with the settings
          items:
            type: integer
          type: array
        tags:
          $ref: '#/components/schemas/tags'
        transfer:
