openapi: 3.2.0
info:
  title: Kibo Commerce Subscription API
  version: '1.0'
  description: 'Operations tagged Subscription across 2 of this provider''s published API definitions: openapi_openapi_subscription.json, kibo-commerce-subscription-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Subscription
paths:
  /commerce/subscriptions/{subscriptionId}/items:
    post:
      description: Add a subscription item in existing subscription.
      parameters:
      - description: subscription id
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
      - description: Determines the update strategy for this update (ApplyToOriginal, ApplyToDraft).
        in: query
        name: updateMode
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionItem'
        description: subscription item to add.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
          description: OK
      summary: Add Subscription Item
      tags:
      - Subscription
      operationId: postCommerceSubscriptionsBySubscriptionIdItems
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/subscriptions/{subscriptionId}/coupons/{couponCode}:
    put:
      description: Apply coupon to the Subscription.
      parameters:
      - description: Unique identifier of the Subscription with which to associate the coupon.
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
      - description: Coupon code that the customer supplies to get the discounted price.
        in: path
        name: couponCode
        required: true
        schema:
          type: string
