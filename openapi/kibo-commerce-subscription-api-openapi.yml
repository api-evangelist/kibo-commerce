    PaymentInteraction:
      description: 'A single interaction of a potential list of intereactions for a transaction. The scope of the transaction is the entire payment

        interchange. It is created upon authorization and is used for all subsequent interactions performed against the authorize,

        such as consecutive captures.'
      properties:
        amount:
          description: Amount of funds associated with this interaction.
          format: double
          type:
          - number
          - 'null'
        auditInfo:
          $ref: '#/components/schemas/CoreApiContractsAuditInfo'
