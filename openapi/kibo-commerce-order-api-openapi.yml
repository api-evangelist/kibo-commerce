openapi: 3.2.0
info:
  title: Kibo Commerce Order API
  version: '1.0'
  description: 'Operations tagged Order across 2 of this provider''s published API definitions: openapi_openapi_commerce.json, kibo-commerce-commerce-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
