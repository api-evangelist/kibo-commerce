          description: Ids of digital packages to mark as fulfilled
          items:
            type: string
          type:
          - array
          - 'null'
        packageIds:
          description: Ids of packages to mark as fulfilled
          items:
            type: string
          type:
          - array
          - 'null'
        pickupIds:
          description: Ids of pickups to mark as fulfilled
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    PaymentCollection:
      description: A collection of payment transactions.
      properties:
        items:
