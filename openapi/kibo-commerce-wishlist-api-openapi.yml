openapi: 3.2.0
info:
  title: Kibo Commerce Wishlist API
  version: '1.0'
  description: 'Operations tagged Wishlist across 2 of this provider''s published API definitions: openapi_openapi_commerce.json, kibo-commerce-commerce-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Wishlist
paths:
  /commerce/wishlists/{wishlistId}:
    delete:
      description: Deletes a wishlist specified by wishlist Id.
      parameters:
      - description: ''
        in: path
        name: wishlistId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Deletes Wishlist
      tags:
      - Wishlist
      operationId: deleteCommerceWishlistsByWishlistId
      x-operation-id-source: derived
    get:
      description: Retrieves the details of a wishlist specified by the wishlist ID.
      parameters:
      - description: ''
        in: path
        name: wishlistId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
            text/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
            text/plain:
              schema:
                $ref: '#/components/schemas/Wishlist'
          description: OK
      summary: Get Wishlist
      tags:
      - Wishlist
      operationId: getCommerceWishlistsByWishlistId
      x-operation-id-source: derived
    put:
      description: Updates a wishlist specified by wishlist Id.
      parameters:
      - description: ''
        in: path
        name: wishlistId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Wishlist'
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
            text/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
            text/plain:
              schema:
                $ref: '#/components/schemas/Wishlist'
          description: OK
      summary: Update Wishlist
      tags:
      - Wishlist
      operationId: putCommerceWishlistsByWishlistId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/wishlists/customers/{customerAccountId}/{wishlistName}:
    get:
      description: Retrieves wishlist by name.
      parameters:
      - description: ''
        in: path
        name: customerAccountId
        required: true
        schema:
          format: int32
          type: integer
      - description: ''
        in: path
        name: wishlistName
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
            text/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
            text/plain:
              schema:
                $ref: '#/components/schemas/Wishlist'
          description: OK
      summary: Get Wishlist By Name
      tags:
      - Wishlist
      operationId: getCommerceWishlistsCustomersByCustomerAccountIdByWishlistName
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/wishlists/{wishlistId}/items/{wishlistItemId}:
    delete:
      description: Delete/remove wishlist item.
      parameters:
      - description: ''
        in: path
        name: wishlistId
        required: true
        schema:
          type: string
      - description: ''
        in: path
        name: wishlistItemId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete Wishlist Item
      tags:
      - Wishlist
      operationId: deleteCommerceWishlistsByWishlistIdItemsByWishlistItemId
      x-operation-id-source: derived
    get:
      description: Retrieves an individual wishlist item from a wishlist.
      parameters:
      - description: ''
        in: path
        name: wishlistId
        required: true
        schema:
          type: string
      - description: ''
        in: path
        name: wishlistItemId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
            text/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
            text/plain:
              schema:
                $ref: '#/components/schemas/WishlistItem'
          description: OK
      summary: Get Wishlist Item
      tags:
      - Wishlist
      operationId: getCommerceWishlistsByWishlistIdItemsByWishlistItemId
      x-operation-id-source: derived
    put:
      description: Updates a wishlist item.
      parameters:
      - description: ''
        in: path
        name: wishlistId
        required: true
        schema:
          type: string
      - description: ''
        in: path
        name: wishlistItemId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistItem'
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
            text/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
            text/plain:
              schema:
                $ref: '#/components/schemas/WishlistItem'
          description: OK
      summary: Update Wishlist Item
      tags:
      - Wishlist
      operationId: putCommerceWishlistsByWishlistIdItemsByWishlistItemId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/wishlists/{wishlistId}/items:
    delete:
      description: Clears all items in the wishlist.
      parameters:
      - description: ''
        in: path
        name: wishlistId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
            text/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
            text/plain:
              schema:
                $ref: '#/components/schemas/Wishlist'
          description: OK
      summary: Remove All Wishlist Items
      tags:
      - Wishlist
      operationId: deleteCommerceWishlistsByWishlistIdItems
      x-operation-id-source: derived
    get:
      description: Returns a listing of wishlists.
      parameters:
      - description: ''
        in: path
        name: wishlistId
        required: true
        schema:
          type: string
      - description: ''
        in: query
        name: startIndex
        schema:
          format: int32
          type: integer
      - description: ''
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: ''
        in: query
        name: sortBy
        schema:
          type: string
      - description: ''
        in: query
        name: filter
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItemCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/WishlistItemCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/WishlistItemCollection'
          description: OK
      summary: Get Wishlist Items
      tags:
      - Wishlist
      operationId: getCommerceWishlistsByWishlistIdItems
      x-operation-id-source: derived
    post:
      description: Adds an item to the wishlist of the current shopper.
      parameters:
      - description: ''
        in: path
        name: wishlistId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistItem'
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
            text/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
            text/plain:
              schema:
                $ref: '#/components/schemas/WishlistItem'
          description: OK
      summary: Add Item To Wishlist
      tags:
      - Wishlist
      operationId: postCommerceWishlistsByWishlistIdItems
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/wishlists/customers/{customerAccountId}/{wishlistName}/items:
    get:
      description: Returns a listing of wishlists.
      parameters:
      - description: ''
        in: path
        name: customerAccountId
        required: true
        schema:
          format: int32
          type: integer
      - description: ''
        in: path
        name: wishlistName
        required: true
        schema:
          type: string
      - description: ''
        in: query
        name: startIndex
        schema:
          format: int32
          type: integer
      - description: ''
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: ''
        in: query
        name: sortBy
        schema:
          type: string
      - description: ''
        in: query
        name: filter
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItemCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/WishlistItemCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/WishlistItemCollection'
          description: OK
      summary: Get Wishlist Items By WishlistName
      tags:
      - Wishlist
      operationId: getCommerceWishlistsCustomersByCustomerAccountIdByWishlistNameItems
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/wishlists:
    get:
      description: Retrieves a list of wishlists according to any specified filter criteria and sort options.
      parameters:
      - description: "Used to page results from a query. Indicates the zero-based offset in the complete result set where the returned entities begin. \n            For example, with a PageSize of 25, to get the 51st through the 75th items, startIndex=50. The default value is 0. Optional."
        in: query
        name: startIndex
        schema:
          format: int32
          type: integer
      - description: Used to page results from a query. Indicates the maximum number of entities to return from a query. The default value is 20 and the maximum value is 200. Optional.
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: The element to sort the results by and the order in which the results appear. Either ascending (a-z) or descending (z-a) order. Optional.
        in: query
        name: sortBy
        schema:
          type: string
      - description: "A set of filter expressions representing the search parameters for a query: eq=equals, ne=not equals, gt=greater than, lt = less than or equals, \n            gt = greater than or equals, lt = less than or equals, sw = starts with, or cont = contains. Optional."
        in: query
        name: filter
        schema:
          type: string
      - description: Text to perform a search on
        in: query
        name: q
        schema:
          type: string
      - description: Limit of the records to include in a search, used for global search
        in: query
        name: qLimit
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/WishlistCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/WishlistCollection'
          description: OK
      summary: Get Wishlists
      tags:
      - Wishlist
      operationId: getCommerceWishlists
      x-operation-id-source: derived
    post:
      description: Create wishlist.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Wishlist'
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
            text/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
            text/plain:
              schema:
                $ref: '#/components/schemas/Wishlist'
          description: OK
      summary: Create Wishlist
      tags:
      - Wishlist
      operationId: postCommerceWishlists
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/wishlists/{wishlistId}/items/{wishlistItemId}/{quantity}:
    put:
      description: Updates the quantity of an item in the wishlist.
      parameters:
      - description: ''
        in: path
        name: wishlistId
        required: true
        schema:
          type: string
      - description: ''
        in: path
        name: wishlistItemId
        required: true
        schema:
          type: string
      - description: ''
        in: path
        name: quantity
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
            text/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
            text/plain:
              schema:
                $ref: '#/components/schemas/WishlistItem'
          description: OK
      summary: Update Wishlist Item Quantity
      tags:
      - Wishlist
      operationId: putCommerceWishlistsByWishlistIdItemsByWishlistItemIdByQuantity
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    WishlistItemCollection:
      description: Paged collection of wishlists.
      properties:
        items:
          items:
            $ref: '#/components/schemas/WishlistItem'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    ProductPropertyValue:
      properties:
        stringValue:
          type:
          - string
          - 'null'
        value: {}
      type: object
    Category:
      description: Categories to which the product belongs. Discounts can apply to categories where any product in the category is discounted.
      properties:
        id:
          description: Unique identifier of the category. System-supplied and read-only.
          format: int32
          type:
          - integer
          - 'null'
        parent:
          $ref: '#/components/schemas/Category'
      type: object
    Wishlist:
      description: Details of the wishlist, items listed in the wishlist, and any system messages.
      properties:
        auditInfo:
          $ref: '#/components/schemas/CoreApiContractsAuditInfo'
        changeMessages:
          description: List of messages displayed by the system based on the last cart action, for example, when a product price has changed or is out-of-stock. System-supplied and read-only.
          items:
            $ref: '#/components/schemas/ChangeMessage'
          type:
          - array
          - 'null'
        channelCode:
          description: Unique identifier of the channel for this item.
          type:
          - string
          - 'null'
        currencyCode:
          description: ISO Currency Code. Currently, only USD is supported.
          type:
          - string
          - 'null'
        customerAccountId:
          description: Unique identifier of the customer account.
          format: int32
          type:
          - integer
          - 'null'
        customerInteractionType:
          description: 'Determines the interaction type that a customer will use to create this object.

            Valid values are: Website, Store, Call, Unknown'
          type:
          - string
          - 'null'
        data:
          description: Custom data for a given vendor set within the commerce process.
          type:
          - object
          - 'null'
        discountThresholdMessages:
          description: List of Mozu.CommerceRuntime.Contracts.Commerce.ThresholdMessage objects that are valid for the current value of the cart/order.
          items:
            $ref: '#/components/schemas/ThresholdMessage'
          type:
          - array
          - 'null'
        discountTotal:
          description: Amount of the discounts applied to all items in the cart. This is a negative number.  This also includes the order level discounts.
          format: double
          type:
          - number
          - 'null'
        discountedSubtotal:
          description: Combined price for all cart items, including all selected options as well as any discounts.
          format: double
          type:
          - number
          - 'null'
        discountedTotal:
          description: Subtotal minus the discounted total
          format: double
          type:
          - number
          - 'null'
        expirationDate:
          description: "When the order will no longer be active. That is, the order is considered abandoned. \nOrders of anonymous shoppers expire after 14 days of inactivity. \nAn order never expires for shoppers who are logged into their account. \nDate in UTC Date/Time."
          format: date-time
          type:
          - string
          - 'null'
        extendedProperties:
          description: Extra properties (key-value pairs) that extend the primary object. Think of this as a property bag of string keys and string values.
          items:
            $ref: '#/components/schemas/ExtendedProperty'
          type:
          - array
          - 'null'
        externalId:
          description: Id in an external system this item may have been imported from
          type:
          - string
          - 'null'
        feeTotal:
          description: Not implemented. Total cost of fees for all items in the cart.
          format: double
          type:
          - number
          - 'null'
        fulfillmentInfo:
          $ref: '#/components/schemas/FulfillmentInfo'
        handlingTaxTotal:
          description: Total tax on handling
          format: double
          type:
          - number
          - 'null'
        id:
          description: Unique identifier of the CommerceAggregate object (e.g. order, cart, wishlist, etc.).
          type:
          - string
          - 'null'
        importDate:
          description: Date this item was imported
          format: date-time
          type:
          - string
          - 'null'
        isImport:
          description: Was this object imported from an external system?
          type:
          - boolean
          - 'null'
        itemTaxTotal:
          description: Not implemented. Tax does not appear on cart.
          format: double
          type:
          - number
          - 'null'
        items:
          description: List of items in the wishlist.
          items:
            $ref: '#/components/schemas/WishlistItem'
          type:
          - array
          - 'null'
        lastValidationDate:
          description: "Occasionally the commerce runtime may validate that item/product names, descriptions, and prices have not changed. \nIf changed, it updates LastValidationDate."
          format: date-time
          type:
          - string
          - 'null'
        lineItemSubtotalWithOrderAdjustments:
          description: Line Item Subtotals with Order Adjustments
          format: double
          type:
          - number
          - 'null'
        name:
          description: Name of the list that is display or potentially shared (e.g. friends and family may view this description if the list is public and the list owner may see this description when viewing the list)
          type:
          - string
          - 'null'
        orderDiscounts:
          description: The discount that has been applied to the cart itself. If multiple discounts exist, this is the discount that the system applies because it offers the best savings for the shopper. This is a negative number.
          items:
            $ref: '#/components/schemas/AppliedDiscount'
          type:
          - array
          - 'null'
        privacyType:
          description: Is the wishlist public, viewable only through a shared link, or private (only the owner of the list may view the wishlist)?
          type:
          - string
          - 'null'
        rejectedDiscounts:
          items:
            $ref: '#/components/schemas/SuggestedDiscount'
          type:
          - array
          - 'null'
        shippingAmountBeforeDiscountsAndAdjustments:
          description: Shipping Amount before discount and adjustments
          format: double
          type:
          - number
          - 'null'
        shippingSubTotal:
          description: Shipping total without discounts applied.
          format: double
          type:
          - number
          - 'null'
        shippingTaxTotal:
          description: Not implemented. Tax does not appear on cart.
          format: double
          type:
          - number
          - 'null'
        shippingTotal:
          description: Shipping does not appear on cart.
          format: double
          type:
          - number
          - 'null'
        siteId:
          description: Unique identifier of the Site.
          format: int32
          type:
          - integer
          - 'null'
        sortOrder:
          description: The wishlist sort order.  Useful for scenarios where there is a default wishlist and other wishlists or arbitrary ordering
          format: int32
          type:
          - integer
          - 'null'
        subtotal:
          description: Combined price for all cart items, including all selected options but excluding any discounts.
          format: double
          type:
          - number
          - 'null'
        suggestedDiscounts:
          items:
            $ref: '#/components/schemas/SuggestedDiscount'
          type:
          - array
          - 'null'
        taxData:
          description: Storage for any additional/custom tax data.
          type:
          - object
          - 'null'
        taxTotal:
          description: Tax does not appear on cart.
          format: double
          type:
          - number
          - 'null'
        tenantId:
          description: Unique identifier of the Tenant.
          format: int32
          type:
          - integer
          - 'null'
        total:
          description: Final total amount of the order including all discounts, shipping, and tax.
          format: double
          type:
          - number
          - 'null'
        typeTag:
          description: Open-ended Wishlist type, e.g. giftlist, gift, wish, wishlist, wedding, baby.  If the merchant does not need this level of granularity this is always null.
          type:
          - string
          - 'null'
        userId:
          description: Unique identifier of the shopper who created the cart.
          type:
          - string
          - 'null'
        version:
          description: Version for concurrency purposes
          type:
          - string
          - 'null'
        visitId:
          description: Identifies the Visit ID that was current when the order was placed or when the cart was last updated.
          type:
          - string
          - 'null'
        webSessionId:
          description: Identifies the web session used to place the order or last update the cart.
          type:
          - string
          - 'null'
      type: object
    ExtendedProperty:
      properties:
        key:
          maxLength: 128
          minLength: 1
          type: string
        value:
          maxLength: 800
          type:
          - string
          - 'null'
      type: object
    PackageMeasurements:
      description: Physical dimensions of the package required to ship the product and its weight.
      properties:
        height:
          $ref: '#/components/schemas/Measurement'
        length:
          $ref: '#/components/schemas/Measurement'
        weight:
          $ref: '#/components/schemas/Measurement'
        width:
          $ref: '#/components/schemas/Measurement'
      type: object
    ChangeMessage:
      description: A message displayed by the system based on the last  action, for example, when a product price has changed. System-supplied and read-only.
      properties:
        amount:
