openapi: 3.2.0
info:
  title: Kibo Commerce Currencies API
  version: '1.0'
  description: 'Operations tagged Currencies across 2 of this provider''s published API definitions: openapi_openapi_catalog_storefront.json, kibo-commerce-catalog-storefront-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Currencies
paths:
  /commerce/catalog/storefront/currencies/exchangerates:
    get:
      description: Retrieves a list of currency exchange rates based on the context's currency code.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CatalogRuntimesCurrencyExchangeRate'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/CatalogRuntimesCurrencyExchangeRate'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/CatalogRuntimesCurrencyExchangeRate'
                type: array
          description: OK
      summary: Get Exchange Rates
      tags:
      - Currencies
      operationId: getCommerceCatalogStorefrontCurrenciesExchangerates
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    CatalogRuntimesCurrencyExchangeRate:
      description: The currency exchange rates from one currency to another.
      properties:
        decimalPlaces:
          description: Number of decimal places
          format: int32
          type:
          - integer
          - 'null'
        fromCurrencyCode:
          description: The source currency code
          type:
          - string
          - 'null'
        multiplier:
          description: An additional multiplier to use in calculations
          format: double
          type:
          - number
          - 'null'
        rate:
          description: The exchange rate
          format: double
          type:
          - number
          - 'null'
        referenceData:
          description: Reference data for miscellaneous metadata from updates
          type:
          - string
          - 'null'
        roundingStrategy:
          description: Rounding strategy
          format: int32
          type:
          - integer
          - 'null'
        toCurrencyCode:
          description: The target currency code
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_catalog_storefront.json
- kibo-commerce-catalog-storefront-openapi.yml
