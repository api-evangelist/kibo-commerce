openapi: 3.2.0
info:
  title: Kibo Commerce Products V1 API
  version: '1.0'
  description: 'Operations tagged ProductsV1 across 2 of this provider''s published API definitions: openapi_openapi_catalog_admin.json, kibo-commerce-catalog-admin-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: ProductsV1
paths:
  /commerce/catalog/admin/productsV1/{productCode}:
    get:
      description: Retrieves details about a product based on the specified response group. This is the legacy version of the Products API, which allows you to access product data that hasn't yet been rewritten to the newer API model with localizedContent. If possible, Kibo recommends calling the /products endpoint with an x-api-version header set to "1" instead of using this V1 endpoint (as it may be deprecated at some point). This is only necessary if you upgraded your implementation to use the new API version by default to support multi-locale catalogs.
      parameters:
      - description: Merchant-created code associated with the product, for example, a SKU. Required.
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: 'Used to get more specific information from the request. For example to get discounts applied to a product use the AppliedProducts response group. Available response groups: ApplicableDiscounts, VariationOptions, and BaseProductCode.'
        in: query
        name: responseGroups
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductV1'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductV1'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductV1'
          description: OK
      summary: Get Product
      tags:
      - ProductsV1
      operationId: getCommerceCatalogAdminProductsV1ByProductCode
      x-operation-id-source: derived
    put:
      description: Modifies an existing product. This is the legacy version of the Products API, which allows you to access product data that hasn't yet been rewritten to the newer API model with localizedContent. If possible, Kibo recommends calling the /products endpoint with an x-api-version header set to "1" instead of using this V1 endpoint (as it may be deprecated at some point). This is only necessary if you upgraded your implementation to use the new API version by default to support multi-locale catalogs.
      parameters:
      - description: Merchant-created code associated with the product, for example, a SKU. Required.
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - in: query
        name: batchJobCode
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductV1'
        description: 'Properties of the product that you want to update. Required properties: ProductCode, Content.ProductName, and Price.ListPrice.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductV1'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductV1'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductV1'
          description: OK
      summary: Update Product
      tags:
      - ProductsV1
      operationId: putCommerceCatalogAdminProductsV1ByProductCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/productsV1/{productCode}/ProductInCatalogs/{catalogId}:
    get:
      description: Retrieves a product in a particular catalog. This is the legacy version of the Products API, which allows you to access product data that hasn't yet been rewritten to the newer API model with localizedContent. If possible, Kibo recommends calling the /products endpoint with an x-api-version header set to "1" instead of using this V1 endpoint (as it may be deprecated at some point). This is only necessary if you upgraded your implementation to use the new API version by default to support multi-locale catalogs.
      parameters:
      - in: path
        name: productCode
        required: true
        schema:
          type: string
      - in: path
        name: catalogId
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductInCatalogInfoV1'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductInCatalogInfoV1'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductInCatalogInfoV1'
          description: OK
      summary: Get Product in Catalog
      tags:
      - ProductsV1
      operationId: getCommerceCatalogAdminProductsV1ByProductCodeProductInCatalogsByCatalogId
      x-operation-id-source: derived
    put:
      description: Updates products in a particular catalog. This is the legacy version of the Products API, which allows you to access product data that hasn't yet been rewritten to the newer API model with localizedContent. If possible, Kibo recommends calling the /products endpoint with an x-api-version header set to "1" instead of using this V1 endpoint (as it may be deprecated at some point). This is only necessary if you upgraded your implementation to use the new API version by default to support multi-locale catalogs.
      parameters:
      - in: path
        name: productCode
        required: true
        schema:
          type: string
      - in: path
        name: catalogId
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInCatalogInfoV1'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductInCatalogInfoV1'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductInCatalogInfoV1'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductInCatalogInfoV1'
          description: OK
      summary: Update Product in Catalog
      tags:
      - ProductsV1
      operationId: putCommerceCatalogAdminProductsV1ByProductCodeProductInCatalogsByCatalogId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/productsV1:
    get:
      description: Retrieves a list of products according to any specified filter criteria and sort options. This is the legacy version of the Products API, which allows you to access product data that hasn't yet been rewritten to the newer API model with localizedContent. If possible, Kibo recommends calling the /products endpoint with an x-api-version header set to "1" instead of using this V1 endpoint (as it may be deprecated at some point). This is only necessary if you upgraded your implementation to use the new API version by default to support multi-locale catalogs.
      parameters:
      - description: Used to page results from a query. Indicates the zero-based offset in the complete result set where the returned entities begin. For example, with a PageSize of 25, to get the 51st through the 75th items, startIndex=3. The default value is 0.
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - description: Used to page results from a query. Indicates the maximum number of entities to return from a single query. The default value is 20 and the maximum value is 200.
        in: query
        name: pageSize
        schema:
          default: 0
          format: int32
          type: integer
      - description: 'The element to sort the results by and the order in which the results appear. Either ascending or descending order. For example, to sort the results by “ID” ascending then by “CreateDate” descending, use: id asc,createdate desc.'
        in: query
        name: sortBy
        schema:
          type: string
      - description: 'Used to get more specific information from the request. For example to get discounts applied to a product use the AppliedProducts response group. Available response groups: ApplicableDiscounts, VariationOptions, and BaseProductCode.'
        in: query
        name: responseGroups
        schema:
          type: string
      - description: 'A set of filter expressions representing the search parameters for a query: eq=equals, ne=not equals, gt=greater than, lt = less than or equals, gt = greater than or equals, lt = less than or equals, sw = starts with, or cont = contains. Optional.'
        in: query
        name: filter
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: qLimit
        schema:
          format: int32
          type: integer
      - in: query
        name: noCount
        schema:
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollectionV1'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductCollectionV1'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductCollectionV1'
          description: OK
      summary: Get Products
      tags:
      - ProductsV1
      operationId: getCommerceCatalogAdminProductsV1
      x-operation-id-source: derived
    post:
      description: Creates a new product. This is the legacy version of the Products API, which allows you to access product data that hasn't yet been rewritten to the newer API model with localizedContent. If possible, Kibo recommends calling the /products endpoint with an x-api-version header set to "1" instead of using this V1 endpoint (as it may be deprecated at some point). This is only necessary if you upgraded your implementation to use the new API version by default to support multi-locale catalogs.
      parameters:
      - in: query
        name: batchJobCode
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductV1'
        description: 'Properties of the new product. Required properties: ProductCode, Content.ProductName, and Price.ListPrice. Mozu.ProductAdmin.Contracts.Product'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductV1'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductV1'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductV1'
          description: OK
      summary: Add Product
      tags:
      - ProductsV1
      operationId: postCommerceCatalogAdminProductsV1
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/productsV1/{productCode}/ProductInCatalogs:
    get:
      description: Retrieve existing products across all catalog. This is the legacy version of the Products API, which allows you to access product data that hasn't yet been rewritten to the newer API model with localizedContent. If possible, Kibo recommends calling the /products endpoint with an x-api-version header set to "1" instead of using this V1 endpoint (as it may be deprecated at some point). This is only necessary if you upgraded your implementation to use the new API version by default to support multi-locale catalogs.
      parameters:
      - in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductInCatalogInfoV1'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductInCatalogInfoV1'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/ProductInCatalogInfoV1'
                type: array
          description: OK
      summary: Get Products in Catalogs
      tags:
      - ProductsV1
      operationId: getCommerceCatalogAdminProductsV1ByProductCodeProductInCatalogs
      x-operation-id-source: derived
    post:
      description: Adds a new product to your catalogs. This is the legacy version of the Products API, which allows you to access product data that hasn't yet been rewritten to the newer API model with localizedContent. If possible, Kibo recommends calling the /products endpoint with an x-api-version header set to "1" instead of using this V1 endpoint (as it may be deprecated at some point). This is only necessary if you upgraded your implementation to use the new API version by default to support multi-locale catalogs.
      parameters:
      - in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInCatalogInfoV1'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductInCatalogInfoV1'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductInCatalogInfoV1'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductInCatalogInfoV1'
          description: OK
      summary: Add Product in Catalogs
      tags:
      - ProductsV1
      operationId: postCommerceCatalogAdminProductsV1ByProductCodeProductInCatalogs
      x-operation-id-source: derived
    put:
      description: Updates existing products across your catalogs. This is the legacy version of the Products API, which allows you to access product data that hasn't yet been rewritten to the newer API model with localizedContent. If possible, Kibo recommends calling the /products endpoint with an x-api-version header set to "1" instead of using this V1 endpoint (as it may be deprecated at some point). This is only necessary if you upgraded your implementation to use the new API version by default to support multi-locale catalogs.
      parameters:
      - in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/ProductInCatalogInfoV1'
              type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductInCatalogInfoV1'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductInCatalogInfoV1'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/ProductInCatalogInfoV1'
                type: array
          description: OK
      summary: Update Products in Catalogs
      tags:
      - ProductsV1
      operationId: putCommerceCatalogAdminProductsV1ByProductCodeProductInCatalogs
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    CatalogAdminsActiveDateRange:
      description: Active Effectivity Dates
      properties:
        endDate:
          format: date-time
          type:
          - string
          - 'null'
        startDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    ProductLocalizedContent:
      description: Container for language-specific content to display on the storefront. You'll have a container for each supported language (LocaleCode). This enables you to display a product in multiple languages yet manage it as a single product internally.
      properties:
        localeCode:
          description: Lanugage used for product content. Currently, only en_US is supported.
          type:
          - string
          - 'null'
        productFullDescription:
          description: Long description of the product typically used for a product details page.
          type:
          - string
          - 'null'
        productImages:
          description: List of images associated with the product.
          items:
            $ref: '#/components/schemas/ProductLocalizedImage'
          type:
          - array
          - 'null'
        productName:
          description: Name of the product.
          pattern: ^(?!\s+).+(?<!\s)$
          type: string
        productShortDescription:
          description: Brief description of the product typically used when the product is displayed in a list or search results.
          type:
          - string
          - 'null'
      type: object
    CategoryDiscountCondition:
      description: Represents a product category and quantity constraint
      properties:
        categoryId:
          description: Unique identifier of the category to which the discount condition applies.
          format: int32
          type: integer
      type: object
    CatalogAdminsTargetedShippingZone:
      description: 'Shipping method that is eligible for free shipping. This is the shipping method that is defined with the Shipping

        Settings resource.'
      properties:
        zone:
          description: 'Indicates the shipping zone that this discount is valid for.  If zone is provided the

            method selected must be valid for the zone and both populated in the order for the discount

            to be valid.'
          maxLength: 200
          minLength: 0
          type: string
      required:
      - zone
      type: object
    CatalogAdminsTargetedShippingMethod:
      description: 'Shipping method that is eligible for free shipping. This is the shipping method that is defined with the Shipping

        Settings resource.'
      properties:
        code:
          description: 'Unique identifier of the shipping method as it appears in the SiteShippingMethod property of the Shipping Settings

            resource.'
          maxLength: 100
          minLength: 0
          type: string
        name:
          description: Name of the shipping method as it appears in SiteShippingMethodLocalizedContent of the Shipping Settings resource.
          type:
          - string
          - 'null'
      required:
      - code
      type: object
    ProductSupplierInfo:
      description: Supplier info for the product
      properties:
        cost:
          $ref: '#/components/schemas/ProductCost'
        distPartNumber:
          type:
          - string
          - 'null'
        mfgPartNumber:
          type:
          - string
          - 'null'
      type: object
    ProductInventoryInfo:
      description: Use the Products resource to create and manage products for your store. You can create products with options that a shopper configures (such as a T-shirt color and size). The system can manage inventory for all combinations of your product options, and can calculate tax and shipping costs.
      properties:
        manageStock:
          description: If true, the Products service manages inventory for this product.
          type:
          - boolean
          - 'null'
        outOfStockBehavior:
          description: The behvior when the ManageStock is true and the product is not in stock.
          type:
          - string
          - 'null'
      type: object
    CatalogAdminsDiscountCondition:
      description: 'Specifies constraints that must be satified for a discount to be applied to a target.

        Constraints are Anded together'
      properties:
        categoriesToExcludeFromMinOrderTotal:
          description: List of categories to discount. When a discount applies to a category, all products in the category are discounted.
          items:
            $ref: '#/components/schemas/CategoryDiscountCondition'
          type:
          - array
          - 'null'
        continuityRecurrenceSettings:
          $ref: '#/components/schemas/ContinuityRecurrenceSettings'
        couponCode:
          description: Code of the coupon associated with the discount (if a coupon code is required). The merchant can supply the code or the system can generate it.
          type:
          - string
          - 'null'
        customerSegments:
          description: List of customer groups for which the discount applies
          items:
            $ref: '#/components/schemas/CatalogAdminsCustomerSegment'
          type:
          - array
          - 'null'
        excludedCategories:
          description: List of categories to discount. When a discount applies to a category, all products in the category are discounted.
          items:
            $ref: '#/components/schemas/CategoryDiscountCondition'
          type:
          - array
          - 'null'
        excludedProducts:
          description: List of products that are eligible for the discount.
          items:
            $ref: '#/components/schemas/ProductDiscountCondition'
          type:
          - array
          - 'null'
        exclusiveLocationCodes:
          description: List of locations where the item/order should be fulfilled for the discount to be valid.
          items:
            type: string
          type:
          - array
          - 'null'
        exclusiveSiteIds:
          description: 'The discount condition for site Ids, if present the discount will be applied only to these sites.

            If not present discount will work for all sites in a catalog.'
          items:
            format: int32
            type: integer
          type:
          - array
          - 'null'
        expirationDate:
          description: Date when the discount expires. Default is null (no expiration date).
          format: date-time
          type:
          - string
          - 'null'
        expression:
          $ref: '#/components/schemas/CatalogAdminsDynamicExpression'
        includedCategories:
          description: List of categories that must be purchased in order for the discount to be valid.
          items:
            $ref: '#/components/schemas/CategoryDiscountCondition'
          type:
          - array
          - 'null'
        includedPaymentWorkflows:
          description: List of payment types that trigger this discount to be valid.
          items:
            type: string
          type:
          - array
          - 'null'
        includedProducts:
          description: List of products that are eligible for the discount.
          items:
            $ref: '#/components/schemas/ProductDiscountCondition'
          type:
          - array
          - 'null'
        maxRedemptionCount:
          description: Maximum number of times that the discount can be redeemed. Default is null (no limit to discount redemptions).
          format: int32
          type:
          - integer
          - 'null'
          exclusiveMinimum: 0
        maximumOrderAmount:
          description: 'Only applies to order.

            Maximum order subtotal after discounts in order for the associated discount to be applied'
          format: double
          type:
          - number
          - 'null'
        minDistinctProductsRequired:
          description: 'The minimum number of distinct products on the order

            Not a quantity calculation.'
          format: int32
          type:
          - integer
          - 'null'
        minTotalOrderQuantity:
          description: 'The order must contain at least this total quantity of items for the discount to apply.

            You must buy a combined quantity of at least x amount.'
          format: int32
          type:
          - integer
          - 'null'
        minimumCategorySubtotalBeforeDiscounts:
          description: "Minimum amount that must be purchased in the combined categories defined in \nIncludedCategories.  Amount is calculated before discounting.\nNot used if IncludedCategories is empty."
          format: double
          type:
          - number
          - 'null'
        minimumLifetimeValueAmount:
          description: Minimum lifetime value amount required for this discount to apply
          format: double
          type:
          - number
          - 'null'
        minimumOrderAmount:
          description: 'Only applies to order.

            Minimum order subtotal after discounts in order for the associated discount to be applied'
          format: double
          type:
          - number
          - 'null'
        minimumQuantityProductsRequiredInCategories:
          description: 'Minimum quantity of products in the categories specified in IncludedCategories that must be purchased to

            qualify for the associated discount.

            Defaults to 1 if  null and IncludedCategories has values'
          format: int32
          type:
          - integer
          - 'null'
          exclusiveMinimum: 0
        minimumQuantityRequiredProducts:
          description: 'Minimum quantity of products in the specified IncludedProducts that must be purchased to

            qualify for the associated discount.

            Defaults to 1 if  null and IncludedProducts has values.'
          format: int32
          type:
          - integer
          - 'null'
          exclusiveMinimum: 0
        minimumRequiredQuantityPerRedemption:
          description: Defines a minimum quantity that is required for a target only discount
          format: int32
          type:
          - integer
          - 'null'
        pricingContext:
          description: 'The pricing context must match on this value for the discount to apply.

            This only matters for tenants that use subscription products'
          type:
          - string
          - 'null'
        productsToExcludeFromMinOrderTotal:
          description: List of products that are eligible for the discount.
          items:
            $ref: '#/components/schemas/ProductDiscountCondition'
          type:
          - array
          - 'null'
        requiresAuthenticatedUser:
          description: "Determines is this discount can be used by an anonymous user \nDefaults to false to allow discounts for anonymous users."
          type: boolean
        requiresCoupon:
          description: If true, the shopper needs to enter a coupon code to redeem the discount.
          type: boolean
        startDate:
          description: Date when the discount can goes into effect, in the format yyyy-mm-dd.
          format: date-time
          type:
          - string
          - 'null'
        validFulfillmentMethods:
          description: 'The discount condition for fulfillment methods, if present the discount will be applied only to these fulfillment methods.

            This must be a value defined in FulfillmentMethodConst below.'
          items:
            type: string
          type:
          - array
          - 'null'
        validSubscriptionContinuityOrdinals:
          description: Ordinals at which a continuity order should receive the discount.
          items:
            format: int32
            type: integer
          type:
          - array
          - 'null'
        validSubscriptionFrequencies:
          description: List of subscription frequencies to which the discount will apply.
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    ProductExtraValueDeltaPrice:
      description: How much a product option costs above the cost of the base product, if at all.
      properties:
        currencyCode:
          description: Which currency to use.
          type:
          - string
          - 'null'
        deltaPrice:
          description: Amount of money saved when discounts are applied.
          format: double
          type: number
      type: object
    ThresholdMessageLocalizedContent:
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        localeCode:
          description: Language used for the discount in the current catalog. Defaults setting for the active catalog.
          maxLength: 8
          minLength: 0
          type:
          - string
          - 'null'
        messageTemplate:
          description: Locale-based contents of the Threshold Message.
          type: string
      required:
      - messageTemplate
      type: object
    CatalogAdminsProductOption:
      description: "Product options for configurable or stand-alone products. A configurable option is one that the shopper chooses when ordering, for example, \nthe color of a T-shirt. A stand-alone option is independent of the product and can be added to the product order. For example, a monogram."
      properties:
