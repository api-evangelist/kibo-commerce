    CatalogAdminsDiscountTarget:
      description: 'What to discount. Specifies the type of discount (percentage off, monetary amount, or free shipping) and which products, categories, or shipping methods are eligible for the discount.

        Can also specify the minimum amount that the order must total for the discount to apply.'
      properties:
        appliesToLeastExpensiveProductsFirst:
          description: "Determines which way the discount is optimized.  Consumers favor(default - false/null) or tenants favor (when this is set to true)\nApplies to discounts where target is not a specific product or list of products.  \nMay also impact behavior of Buy X Get Y so that X is the most expensive items and Y the least expensive."
          type:
          - boolean
          - 'null'
        categories:
          description: List of categories to discount. When a discount applies to a category, all products in the category are discounted.
          items:
            $ref: '#/components/schemas/CatalogAdminsTargetedCategory'
          type:
          - array
          - 'null'
        doNotApplyToHandlingFees:
          description: Prevents the discount from being applied to handling fees
          type:
          - boolean
          - 'null'
        excludeItemsWithExistingProductDiscounts:
          description: "Prevents order scoped discounts from layering over items that already have a product discount with the \nsame type."
          type:
          - boolean
          - 'null'
        excludeItemsWithExistingShippingDiscounts:
          description: "Prevents order scoped discounts from layering over items that already have a shipping discount with the \nsame type."
          type:
          - boolean
          - 'null'
        excludedCategories:
          description: List of categories to exclude from the discount. Useful to exclude specific child categories.
          items:
            $ref: '#/components/schemas/CatalogAdminsTargetedCategory'
          type:
          - array
          - 'null'
        excludedCategoriesOperator:
          description: 'Applies to Included categories

            Defaults to Any'
          type:
          - string
          - 'null'
        excludedProducts:
          description: List of products that are excluded from the discount.
          items:
            $ref: '#/components/schemas/TargetedProduct'
          type:
          - array
          - 'null'
        includeAllProducts:
          description: If yes, the discount applies to all products sold on the storefront.
          type:
          - boolean
          - 'null'
        includedCategoriesOperator:
          description: 'Applies to Included categories

            When Any, the target product can belong to any specified category.

            When All, the target product must belong to all specified categories.

            Defaults to Any'
          type:
          - string
          - 'null'
        maximumQuantityPerRedemption:
          description: "When a condition is specified, this property limits the number of items that can be targeted per discount redemption with an order.\nif multiple redemptions are allowed per order then multiples of this value would be allowed in multiples of the associated \ncondition.\nIf no condition is specified then this value is not used.  \nIf null and condition exists, then defaults to 1."
          format: int32
          type:
          - integer
          - 'null'
          exclusiveMinimum: 0
        products:
          description: List of products that are eligible for the discount.
          items:
            $ref: '#/components/schemas/TargetedProduct'
          type:
          - array
          - 'null'
        shippingMethods:
          description: Shipping method that is eligible for shipping discounts. This is a shipping method defined in Shipping Settings.
          items:
            $ref: '#/components/schemas/CatalogAdminsTargetedShippingMethod'
          type:
          - array
          - 'null'
        shippingZones:
          description: Shipping Zones that are applicable for this discount
          items:
            $ref: '#/components/schemas/CatalogAdminsTargetedShippingZone'
          type:
          - array
          - 'null'
        type:
          description: "    Type of target to which the discount applies. Possible values: <pre>Product</pre> or <pre>Shipping</pre>. \nIf this is a <pre>Product</pre> type, you can specify which products or categories that the discount applies to.\n    If this is a <pre>Shipping</pre> type then you must specify which shipping methods apply."
          minLength: 1
          type: string
      required:
      - type
      type: object
    ProductDiscountCondition:
