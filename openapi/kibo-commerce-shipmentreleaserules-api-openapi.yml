openapi: 3.2.0
info:
  title: Kibo Commerce Shipment Release Rules API
  version: '1.0'
  description: 'Operations tagged ShipmentReleaseRules across 2 of this provider''s published API definitions: openapi_openapi_catalog_admin.json, kibo-commerce-catalog-admin-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: ShipmentReleaseRules
paths:
  /commerce/rules/shipmentrelease/{code}:
    delete:
      description: Deletes a shipment release rule by code.
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete shipment release rule
      tags:
      - ShipmentReleaseRules
      operationId: deleteCommerceRulesShipmentreleaseByCode
      x-operation-id-source: derived
    get:
      description: Gets a shipment release rule details by code.
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRule'
          description: OK
      summary: Get shipment release rule by code
      tags:
      - ShipmentReleaseRules
      operationId: getCommerceRulesShipmentreleaseByCode
      x-operation-id-source: derived
    put:
      description: Updates an existing shipment release rule.
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentReleaseRule'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRule'
          description: OK
      summary: Update shipment release rule
      tags:
      - ShipmentReleaseRules
      operationId: putCommerceRulesShipmentreleaseByCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/rules/shipmentrelease:
    get:
      description: Gets a collection of shipment release rules according to any specified filter criteria and sort options.
      parameters:
      - in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: pageSize
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: sortBy
        schema:
          type: string
      - in: query
        name: filter
        schema:
          type: string
      - in: query
        name: responseGroups
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRuleCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRuleCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRuleCollection'
          description: OK
      summary: Get shipment release rules
      tags:
      - ShipmentReleaseRules
      operationId: getCommerceRulesShipmentrelease
      x-operation-id-source: derived
    post:
      description: Creates a new shipment release rule.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentReleaseRule'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseRule'
          description: OK
      summary: Create shipment release rule
      tags:
      - ShipmentReleaseRules
      operationId: postCommerceRulesShipmentrelease
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/rules/shipmentrelease/{code}/rank:
    put:
      description: Updates the rank for a shipment release rule and rearranges the ranks of all other rules accordingly.
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRankRequest'
      responses:
        '200':
          description: OK
      summary: Update shipment release rule rank
      tags:
      - ShipmentReleaseRules
      operationId: putCommerceRulesShipmentreleaseByCodeRank
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    ProductRuleCode:
      properties:
        code:
          description: Unique identifier of the ProductRule. System-supplied and read-only.
          type:
          - string
          - 'null'
        masterCatalogId:
          description: Master Catalog Id of the ProductRule.
          format: int32
          type: integer
      type: object
    ShipmentReleaseRule:
      properties:
        attributeSelection: {}
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        code:
          type:
          - string
          - 'null'
        customerRules:
          items:
            type: string
          type:
          - array
          - 'null'
        description:
          type:
          - string
          - 'null'
        enabled:
          type:
          - boolean
          - 'null'
        endDate:
          description: End of the rule's effective window. Null = never expires. Must be >= StartDate when both supplied.
          format: date-time
          type:
          - string
          - 'null'
        isActive:
          description: 'Read-only. Computed server-side: true when the current UTC instant is inside the effective window

            (StartDate null/≤now AND EndDate null/≥now), false otherwise. A rule with no dates is always active.

            This reflects the effective window alone and does not incorporate the enabled flag.'
          type:
          - boolean
          - 'null'
        locationCodes:
          items:
            type: string
          type:
          - array
          - 'null'
        locationGroups:
          items:
            type: string
          type:
          - array
          - 'null'
        metaData: {}
        name:
          type:
          - string
          - 'null'
        productRules:
          items:
            $ref: '#/components/schemas/ProductRuleCode'
          type:
          - array
          - 'null'
        rank:
          format: int32
          type:
          - integer
          - 'null'
        shipmentRules:
          items:
            $ref: '#/components/schemas/ShipmentRuleCode'
          type:
          - array
          - 'null'
        startDate:
          description: Start of the rule's effective window. Null = no lower bound (already active).
          format: date-time
          type:
          - string
          - 'null'
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    ShipmentRuleCode:
      properties:
        code:
          description: Unique identifier of the ProductRule. System-supplied and read-only.
          type:
          - string
          - 'null'
      type: object
    ShipmentReleaseRuleCollection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ShipmentReleaseRule'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    UpdateRankRequest:
      description: Represents a request to update the rank of a SafetyStock, PurchaseLimit and Return Rule.
      properties:
        code:
          description: 'Gets or sets the code of the rule to be updated.

            It can be SafetyStock Code , PurchaseLimit Code or Return Rule Code'
          type:
          - string
          - 'null'
        newRank:
          description: Gets or sets the new rank of the rule.
          format: int32
          type: integer
        oldRank:
          description: Gets or sets the old rank of the rule.
          format: int32
          type: integer
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_catalog_admin.json
- kibo-commerce-catalog-admin-openapi.yml
