openapi: 3.2.0
info:
  title: Kibo Commerce Location Admin API
  version: '1.0'
  description: 'Operations tagged LocationAdmin across 3 of this provider''s published API definitions: openapi_openapi_location.json, kibo-commerce-location-admin-openapi.yml, kibo-commerce-location-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: LocationAdmin
paths:
  /commerce/admin/locations/{locationCode}/cutofftime:
    post:
      description: Gets an override if available, otherwise returns the Cut Off Time of the location.
      parameters:
      - in: path
        name: locationCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CutOffTimeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CutoffTimeResponse'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/CutoffTimeResponse'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/CutoffTimeResponse'
                type: array
          description: OK
      summary: Get Location Cut Off Time
      tags:
      - LocationAdmin
      operationId: postCommerceAdminLocationsByLocationCodeCutofftime
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/admin/locations/{locationCode}/attributes:
    post:
      description: Add a new attribute to a location.
      parameters:
      - description: The unique code for a location
        in: path
        name: locationCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationAttributeAddRequest'
        description: The location attribute to add
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationAttribute'
            text/json:
              schema:
                $ref: '#/components/schemas/LocationAttribute'
            text/plain:
              schema:
                $ref: '#/components/schemas/LocationAttribute'
          description: OK
      summary: Add Location Attribute
      tags:
      - LocationAdmin
      operationId: postCommerceAdminLocationsByLocationCodeAttributes
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/admin/locations/cutoffoverrides:
    get:
      description: Gets all Cut Off Time overrides. Location and/or Date Range and/or FulfillmentType can be used to filter the results. For a single date, pass only the fromDate parameter.
      parameters:
      - in: query
        name: locationCode
        schema:
          type: string
      - in: query
        name: fromDate
        schema:
          format: date-time
          type: string
      - in: query
        name: toDate
        schema:
          format: date-time
          type: string
      - in: query
        name: fulfillmentType
        schema:
          type: string
      - in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: pageSize
        schema:
          default: 100
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutoffTimeOverrideCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/CutoffTimeOverrideCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/CutoffTimeOverrideCollection'
          description: OK
      summary: Get all Cutoff Time Overrides
      tags:
      - LocationAdmin
      operationId: getCommerceAdminLocationsCutoffoverrides
      x-operation-id-source: derived
    post:
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CutoffTimeOverride'
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutoffTimeOverride'
            text/json:
              schema:
                $ref: '#/components/schemas/CutoffTimeOverride'
            text/plain:
              schema:
                $ref: '#/components/schemas/CutoffTimeOverride'
          description: OK
      summary: Create a new Cutoff Time Override
      tags:
      - LocationAdmin
      operationId: postCommerceAdminLocationsCutoffoverrides
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/admin/locations/cutoffoverrides/{overrideId}:
    delete:
      description: Deletes a specific Cut Off Time override
      parameters:
      - description: ''
        in: path
        name: overrideId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete a Cutoff Time Override
      tags:
      - LocationAdmin
      operationId: deleteCommerceAdminLocationsCutoffoverridesByOverrideId
      x-operation-id-source: derived
    get:
      description: Retrieves a Cutoff Time override by Id
      parameters:
      - in: path
        name: overrideId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutoffTimeOverride'
            text/json:
              schema:
                $ref: '#/components/schemas/CutoffTimeOverride'
            text/plain:
              schema:
                $ref: '#/components/schemas/CutoffTimeOverride'
          description: OK
      summary: Get Cutoff Time Override by Id
      tags:
      - LocationAdmin
      operationId: getCommerceAdminLocationsCutoffoverridesByOverrideId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/admin/locations/{locationCode}:
    get:
      description: Get a location by its unique locationCode.
      parameters:
      - description: ''
        in: path
        name: locationCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
            text/json:
              schema:
                $ref: '#/components/schemas/Location'
            text/plain:
              schema:
                $ref: '#/components/schemas/Location'
          description: OK
      summary: Get Location
      tags:
      - LocationAdmin
      operationId: getCommerceAdminLocationsByLocationCode
      x-operation-id-source: derived
    patch:
      description: Update specific fields of a location using RFC 6902 JSON Patch format.
      parameters:
      - description: the unique code for a location
        in: path
        name: locationCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                properties:
                  from:
                    type: string
                  op:
                    type: string
                  path:
                    type: string
                  value: {}
                required:
                - op
                - path
                type: object
              type: array
        description: JSON Patch document with operations to apply
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
            text/json:
              schema:
                $ref: '#/components/schemas/Location'
            text/plain:
              schema:
                $ref: '#/components/schemas/Location'
          description: OK
      summary: Partially Update Location
      tags:
      - LocationAdmin
      operationId: patchCommerceAdminLocationsByLocationCode
      x-operation-id-source: derived
    put:
      description: Update a location by providing its locationCode.
      parameters:
      - description: the unique code for a location
        in: path
        name: locationCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
        description: the location update
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
            text/json:
              schema:
                $ref: '#/components/schemas/Location'
            text/plain:
              schema:
                $ref: '#/components/schemas/Location'
          description: OK
      summary: Update Location
      tags:
      - LocationAdmin
      operationId: putCommerceAdminLocationsByLocationCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/admin/locations/{locationCode}/attributes/{fullyQualifiedName}:
    delete:
      description: Remove an attribute from a location.
      parameters:
      - description: The unique code for a location
        in: path
        name: locationCode
        required: true
        schema:
          type: string
      - description: The fully qualified name of the attribute to remove
        in: path
        name: fullyQualifiedName
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Remove Location Attribute
      tags:
      - LocationAdmin
      operationId: deleteCommerceAdminLocationsByLocationCodeAttributesByFullyQualifiedName
      x-operation-id-source: derived
    get:
      description: Get a specific attribute from a location.
      parameters:
      - description: The unique code for a location
        in: path
        name: locationCode
        required: true
        schema:
          type: string
      - description: The fully qualified name of the attribute to retrieve
        in: path
        name: fullyQualifiedName
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationAttribute'
            text/json:
              schema:
                $ref: '#/components/schemas/LocationAttribute'
            text/plain:
              schema:
                $ref: '#/components/schemas/LocationAttribute'
          description: OK
      summary: Get Location Attribute
      tags:
      - LocationAdmin
      operationId: getCommerceAdminLocationsByLocationCodeAttributesByFullyQualifiedName
      x-operation-id-source: derived
    put:
      description: Update an existing attribute for a location.
      parameters:
      - description: The unique code for a location
        in: path
        name: locationCode
        required: true
        schema:
          type: string
      - description: The fully qualified name of the attribute to update
        in: path
        name: fullyQualifiedName
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationAttributeUpdateRequest'
        description: The location attribute update
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationAttribute'
            text/json:
              schema:
                $ref: '#/components/schemas/LocationAttribute'
            text/plain:
              schema:
                $ref: '#/components/schemas/LocationAttribute'
          description: OK
      summary: Update Location Attribute
      tags:
      - LocationAdmin
      operationId: putCommerceAdminLocationsByLocationCodeAttributesByFullyQualifiedName
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/admin/locations:
    get:
      description: Get locations with optional filtering and paging.
      parameters:
      - description: ''
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - description: ''
        in: query
        name: pageSize
        schema:
          default: 100
          format: int32
          type: integer
      - description: ''
        in: query
        name: sortBy
        schema:
          type: string
      - description: ''
        in: query
        name: filter
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/LocationCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/LocationCollection'
          description: OK
      summary: Get Locations
      tags:
      - LocationAdmin
      operationId: getCommerceAdminLocations
      x-operation-id-source: derived
    post:
      description: Add a new location.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
        description: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
            text/json:
              schema:
                $ref: '#/components/schemas/Location'
            text/plain:
              schema:
                $ref: '#/components/schemas/Location'
          description: OK
      summary: Add Location
      tags:
      - LocationAdmin
      operationId: postCommerceAdminLocations
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
