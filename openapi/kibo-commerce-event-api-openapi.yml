openapi: 3.2.0
info:
  title: Kibo Commerce Event API
  version: '1.0'
  description: 'Operations tagged Event across 2 of this provider''s published API definitions: openapi_openapi_event.json, kibo-commerce-event-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Event
paths:
  /event/pull/{eventId}:
    get:
      description: Retrieves the details of a single event.
      parameters:
      - description: Unique identifier of the event. System-supplied and read-only.
        in: path
        name: eventId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEvent'
            text/json:
              schema:
                $ref: '#/components/schemas/EventEvent'
            text/plain:
              schema:
                $ref: '#/components/schemas/EventEvent'
          description: OK
      summary: Get Event
      tags:
      - Event
      operationId: getEventPullByEventId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /event/pull:
    get:
      description: Retrieves a list of events according to any specified filter criteria and sort options.
      parameters:
      - description: Used to page results from a query. Indicates the zero-based offset in the complete result set where the returned entities begin. For example, with a PageSize of 25, to get the 51st through the 75th items, startIndex=3. The default value is 0. Optional.
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - description: Used to page results from a query. Indicates the maximum number of entities to return from a query. The default value is 20 and the maximum value is 200. Optional.
        in: query
        name: pageSize
        schema:
          default: 0
          format: int32
          type: integer
      - description: The element to sort the results by and the order in which the results appear. Either ascending (a-z) or descending (z-a) order. Optional.
        in: query
        name: sortBy
        schema:
          type: string
      - description: 'A set of filter expressions representing the search parameters for a query: eq=equals, ne=not equals, gt=greater than, lt = less than or equals, gt = greater than or equals, lt = less than or equals, sw = starts with, or cont = contains. Optional.'
        in: query
        name: filter
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/EventCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/EventCollection'
          description: OK
      summary: Get Events
      tags:
      - Event
      operationId: getEventPull
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    EventExtendedProperty:
      description: Event Extended Property
      properties:
        key:
          type:
          - string
          - 'null'
        value: {}
      type: object
    EventCollection:
      description: Collection of events returned as a whole.
      properties:
        items:
          items:
            $ref: '#/components/schemas/EventEvent'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    EventEvent:
      description: The external/public Event entity used specifically in PULL/POLL event scenarios
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        catalogId:
          description: CatalogId
          format: int32
          type:
          - integer
          - 'null'
        correlationId:
          description: The Correlation Id of the original API request that caused this event to occur
          type:
          - string
          - 'null'
        entityId:
          description: The identifier / ID of the entity that changed (i.e. product code)
          type:
          - string
          - 'null'
        extendedProperties:
          description: 'Extended properties. Note: This is purposefully not a CollectionBase type wrapper so consumers start to get used to not having counts returned.'
          items:
            $ref: '#/components/schemas/EventExtendedProperty'
          type:
          - array
          - 'null'
        id:
          description: The unique identifier for an event
          type:
          - string
          - 'null'
        isTest:
          description: Is this a test?
          type:
          - boolean
          - 'null'
        masterCatalogId:
          description: MasterCatalogId
          format: int32
          type:
          - integer
          - 'null'
        siteId:
          description: SiteId
          format: int32
          type:
          - integer
          - 'null'
        tenantId:
          description: TenantId
          format: int32
          type:
          - integer
          - 'null'
        topic:
          description: The topic of the event (i.e. product.created)
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_event.json
- kibo-commerce-event-openapi.yml
