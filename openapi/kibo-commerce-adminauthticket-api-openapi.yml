openapi: 3.2.0
info:
  title: Kibo Commerce Admin Auth Ticket API
  version: '1.0'
  description: 'Operations tagged AdminAuthTicket across 3 of this provider''s published API definitions: openapi_openapi_tenant_and_user.json, kibo-commerce-tenant-and-user-openapi.yml, kibo-commerce-user-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: AdminAuthTicket
paths:
  /platform/adminuser/authtickets/tenants:
    post:
      description: Authenticates a user for a particular tenant given a set of user credentials and a tenantId.
      parameters:
      - description: Optional tenant Id parameter
        in: query
        name: tenantId
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAuthInfo'
        description: User's email address and password.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/plain:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
          description: OK
      summary: Create User Auth Ticket
      tags:
      - AdminAuthTicket
      operationId: postPlatformAdminuserAuthticketsTenants
      x-operation-id-source: derived
    put:
      description: Reauthenticates the current user for a different tenant. If the user does not have access to the tenant, the operation fails.
      parameters:
      - description: The tenant to authenticate the user in
        in: query
        name: tenantId
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantAdminUserAuthTicket'
        description: An existing valid auth ticket containing the refresh token.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/plain:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
          description: OK
      summary: Refresh Auth Ticket
      tags:
      - AdminAuthTicket
      operationId: putPlatformAdminuserAuthticketsTenants
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /platform/adminuser/authtickets/wsfed/auth/{id}:
    post:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: scopeid
        schema:
          format: int32
          type: integer
      - in: query
        name: scopeType
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/plain:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
          description: OK
      summary: Create User Auth Ticket With Ws Fed
      tags:
      - AdminAuthTicket
      operationId: postPlatformAdminuserAuthticketsWsfedAuthById
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /platform/adminuser/authtickets:
    delete:
      description: Logs out a user by deleting the refresh token
      parameters:
      - description: The refresh token to delete.
        in: query
        name: refreshToken
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete User Auth Ticket
      tags:
      - AdminAuthTicket
      operationId: deletePlatformAdminuserAuthtickets
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /platform/adminuser/authtickets/wsfed/challenge/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: scopeid
        schema:
          format: int32
          type: integer
      - in: query
        name: scopeType
        schema:
          type: string
      - in: query
        name: redirect
        schema:
          type: string
      - in: query
        name: invitationToken
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Get Ws Fed Challenge Url
      tags:
      - AdminAuthTicket
      operationId: getPlatformAdminuserAuthticketsWsfedChallengeById
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /platform/adminuser/authtickets/wsfed/SignOut/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: redirect
        schema:
          type: string
      - in: query
        name: ssoNameId
        schema:
          type: string
      - in: query
        name: session
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Get Ws Fed Sign Out Url
      tags:
      - AdminAuthTicket
      operationId: getPlatformAdminuserAuthticketsWsfedSignOutById
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
