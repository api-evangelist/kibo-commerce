components:
  schemas:
    CustomerPurchaseOrderAccount:
      properties:
        accountId:
          format: int32
          type: integer
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        availableBalance:
          format: double
          type: number
        creditLimit:
          format: double
          type: number
        customerPurchaseOrderPaymentTerms:
          items:
            $ref: '#/components/schemas/CustomerPurchaseOrderPaymentTerm'
          type:
          - array
          - 'null'
        id:
          format: int32
          type: integer
        isEnabled:
          type: boolean
        overdraftAllowance:
          format: double
          type:
          - number
          - 'null'
        overdraftAllowanceType:
          description: Indicates type of overdraft. Possible values are "Percent" and "Amount"
          type:
          - string
          - 'null'
        totalAvailableBalance:
          format: double
          type: number
      type: object
    CustomerAttribute:
      properties:
        attributeDefinitionId:
          format: int32
          type:
          - integer
          - 'null'
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        fullyQualifiedName:
          type:
          - string
          - 'null'
        values:
          items: {}
          type:
          - array
          - 'null'
      type: object
    ChangePasswordResult:
      properties:
        accountId:
          format: int32
          type: integer
        errorMessage:
          type:
          - string
          - 'null'
        succeeded:
          type: boolean
      type: object
    AccountPasswordInfo:
      description: Password information for an Account
      properties:
        accountId:
          description: The Id of the Account which this password info applies
          format: int32
          type: integer
        passwordInfo:
          $ref: '#/components/schemas/CustomerPasswordInfo'
        unlockAccount:
          description: Indicates to unlock the Account
          type:
          - boolean
          - 'null'
        userId:
          description: If the account has multiple users, provide the Id of a specific user
          type:
          - string
          - 'null'
      type: object
    CustomerAuditEntryCollection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CustomerAuditEntry'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    Card:
      properties:
        cardNumberPart:
          type:
          - string
          - 'null'
        cardType:
          type:
          - string
          - 'null'
        contactId:
          format: int32
          type: integer
        expireMonth:
          format: int32
          type:
          - integer
          - 'null'
        expireYear:
          format: int32
          type:
          - integer
          - 'null'
        id:
          description: Card ID from Payment Service
          type:
          - string
          - 'null'
        isDefaultPayMethod:
          type: boolean
        nameOnCard:
          type:
          - string
          - 'null'
      type: object
    PurchaseOrderTransaction:
      description: Customer purchase order transaction log
      properties:
        additionalTransactionDetail:
          description: Any additional transaction detail other than transaction description
          type:
          - string
          - 'null'
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        author:
          type:
          - string
          - 'null'
        availableBalance:
          description: Current available balance on Purchase Order account
          format: double
          type: number
        creditLimit:
          description: Maximum credit available on a purchase order account
          format: double
          type: number
        customerPurchaseOrderAccountId:
          description: Unique identifier for Customer purchase order account
          format: int32
          type: integer
        externalId:
          type:
          - string
          - 'null'
        orderId:
          description: Unique identifier for an order
          type:
          - string
          - 'null'
        purchaseOrderNumber:
          description: Purchase order number
          type:
          - string
          - 'null'
        siteId:
          description: Site Id associated with transaction log
          format: int32
          type: integer
        tenantId:
          description: Tenant Id associated with transaction log
          format: int32
          type: integer
        transactionAmount:
          description: Transaction amount in transaction log for a purchase order account
          format: double
          type: number
        transactionDate:
          description: Date when the transaction was made on a purchase order account
          format: date-time
          type: string
        transactionDescription:
          description: 'Purchase Order transaction description

            Line of Credit Change

            Order Submitted

            Payment Collected

            Payment Voided

            Payment Refund

            Manual Adjustment'
          type:
          - string
          - 'null'
        transactionTypeId:
          description: ' Purchase Order transaction type

            1 - Line of Credit Change

            2 - Order Submitted

            3 - Payment Collected

            4 - Payment Voided

            5 - Payment Refund

            6 - Manual Adjustment'
          format: int32
          type: integer
      type: object
    CurrencyAmount:
      description: The currency code and amount of an order listed in the order history of a customer account. Currently, only USD is supported.
      properties:
        amount:
          description: Total amount of the order. Currently, only US dollar amounts are supported.
          format: double
          type: number
        currencyCode:
          description: Currency code for the amount of the order. Currently, only "USD" is supported.
          type:
          - string
          - 'null'
      type: object
    CustomerPurchaseOrderAccountCollection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CustomerPurchaseOrderAccount'
