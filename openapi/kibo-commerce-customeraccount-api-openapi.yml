      - description: Unique identifier of the customer account to delete.
        in: path
        name: accountId
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          description: OK
      summary: Delete Account
      tags:
      - CustomerAccount
      operationId: deleteCommerceCustomerAccountsByAccountId
      x-operation-id-source: derived
