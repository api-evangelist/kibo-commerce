  /commerce/customer/accounts/{accountId}:
    delete:
      description: Deletes a customer account. A customer account cannot be deleted if any orders exist, past or present. To erase a customer's personal data for a data subject erasure or right-to-deletion request under GDPR, CCPA, and other privacy regulations — including PII attached to existing orders, payments, and shipments — use the Redaction Services two-phase workflow instead.
