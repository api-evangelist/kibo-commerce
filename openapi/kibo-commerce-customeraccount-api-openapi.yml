          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAccountAndAuthInfo'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAuthTicket'
            text/json:
              schema:
                $ref: '#/components/schemas/CustomerAuthTicket'
            text/plain:
              schema:
                $ref: '#/components/schemas/CustomerAuthTicket'
          description: OK
      summary: Add Account And Login
      tags:
