  /commerce/catalog/admin/products/{productCode}/variations:
    get:
      description: Retrieves a paged list of product variations for a specific product according to any specified filter criteria and sort options. This current version of the Products API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access product data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
      parameters:
      - description: Merchant-supplied code associated with the product, for example, a SKU. Required.
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: 'Used to page results from a query. Indicates the zero-based offset in the complete result set

          where the returned entities begin. For example, with a PageSize of 25, to get the 51st through the 75th items,

          startIndex=3. The default value is 0. Optional.'
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - description: 'Used to page results from a query. Indicates the maximum number of entities to return from a

          query. The default value is 20 and the maximum value is 200. Optional.'
        in: query
        name: pageSize
        schema:
          default: 0
          format: int32
          type: integer
      - description: 'The element to sort the results by and the order in which the results appear. Either ascending

          (a-z) or descending (z-a) order. Optional.'
        in: query
        name: sortBy
        schema:
          type: string
      - description: 'A set of filter expressions representing the search parameters for a query: eq=equals, ne=not

          equals, gt=greater than, lt = less than or equals, gt = greater than or equals, lt = less than or equals, sw =

          starts with, or cont = contains. Optional.'
        in: query
        name: filter
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariationPagedCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductVariationPagedCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductVariationPagedCollection'
          description: OK
      summary: Get Product Variations
      tags:
      - ProductVariations
      operationId: getCommerceCatalogAdminProductsByProductCodeVariations
      x-operation-id-source: derived
    put:
      description: 'Modifies multiple product variations for an existing product in one operation. Use to set IsActive to true for variations that represent configurable options for sale. Also use to change the price or inventory count of an existing product variation. Read-only options are ignored.


        This current version of the Products API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access product data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".'
      parameters:
      - description: Merchant-supplied code associated with the product, for example, a SKU. Required.
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariationCollection'
        description: Properties of the product variations that you are modifying. Required.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariationCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductVariationCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductVariationCollection'
          description: OK
      summary: Update Product Variations
      tags:
      - ProductVariations
      operationId: putCommerceCatalogAdminProductsByProductCodeVariations
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
