openapi: 3.2.0
info:
  title: Kibo Commerce Product Variations API
  version: '1.0'
  description: 'Operations tagged ProductVariations across 2 of this provider''s published API definitions: openapi_openapi_catalog_admin.json, kibo-commerce-catalog-admin-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: ProductVariations
paths:
  /commerce/catalog/admin/products/{productCode}/variations/{variationKey}:
    delete:
      description: Deletes an existing product variation. This current version of the Products API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access product data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
      parameters:
      - description: Merchant-created code associated with the product, for example, a SKU. Required.
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: Unique identifier for a single product variation. System-supplied and read-only.
        in: path
        name: variationKey
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete Product Variation
      tags:
      - ProductVariations
      operationId: deleteCommerceCatalogAdminProductsByProductCodeVariationsByVariationKey
      x-operation-id-source: derived
    get:
      description: Retrieves an existing product variation for a specific product and variation key. This current version of the Products API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access product data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".
      parameters:
      - description: Merchant-created code associated with the product, for example, a SKU. Required.
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: Unique identifier for a single product variation. System-supplied and read-only.
        in: path
        name: variationKey
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariation'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductVariation'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductVariation'
          description: OK
      summary: Get Product Variation
      tags:
      - ProductVariations
      operationId: getCommerceCatalogAdminProductsByProductCodeVariationsByVariationKey
      x-operation-id-source: derived
    put:
      description: 'Modifies an existing product variation specified by its variation key. Typically used to change the price or inventory count of an existing product variation. Read-only options are ignored.


        This current version of the Products API includes localizedContent to support multi-locale catalogs, which was not present in the previous API model. If you were a client prior to May 2024 and have upgraded your implementation to support this feature, you can still access product data that has not yet been rewritten to the new model by providing an x-api-version header set to "1".'
      parameters:
      - description: Merchant-created code associated with the product, for example, a SKU. Required.
        in: path
        name: productCode
        required: true
        schema:
          type: string
      - description: Unique identifier for a single variation. System-supplied and read-only.
        in: path
        name: variationKey
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariation'
        description: Properties of the product variation that you are modifying. Required.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariation'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductVariation'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductVariation'
          description: OK
      summary: Update Product Variation
      tags:
      - ProductVariations
      operationId: putCommerceCatalogAdminProductsByProductCodeVariationsByVariationKey
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
