openapi: 3.2.0
info:
  title: Kibo Commerce Product Rules API
  version: '1.0'
  description: 'Operations tagged ProductRules across 2 of this provider''s published API definitions: openapi_openapi_catalog_admin.json, kibo-commerce-catalog-admin-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: ProductRules
paths:
  /commerce/rules/product/product-rule-fields:
    get:
      description: Get expression field definition
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpressionFieldDefinitionCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ExpressionFieldDefinitionCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ExpressionFieldDefinitionCollection'
          description: OK
      summary: Get Expression Field Definition
      tags:
      - ProductRules
      operationId: getCommerceRulesProductProductRuleFields
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/rules/product/{code}:
    delete:
      description: Delete a product rules.
      parameters:
      - description: The code of the rule to delete.
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete Product Rules
      tags:
      - ProductRules
      operationId: deleteCommerceRulesProductByCode
      x-operation-id-source: derived
    get:
      description: Retrieves the details of a single product rule.
      parameters:
      - description: The code of the rule.
        in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductRule'
          description: OK
      summary: Get Product Rule by Code
      tags:
      - ProductRules
      operationId: getCommerceRulesProductByCode
      x-operation-id-source: derived
    put:
      description: Update an existing product rules.
      parameters:
      - description: The code of the rule to update.
        in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRule'
        description: The updated product rule.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductRule'
          description: OK
      summary: Update Product Rule
      tags:
      - ProductRules
      operationId: putCommerceRulesProductByCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/rules/product:
    get:
      description: Retrieves a list of product rules according to any specified filter criteria and sort options.
      parameters:
      - description: The start index.
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - description: The page size.
        in: query
        name: pageSize
        schema:
          default: 0
          format: int32
          type: integer
      - description: The sort by.
        in: query
        name: sortBy
        schema:
          type: string
      - description: The filter.
        in: query
        name: filter
        schema:
          type: string
      - description: The response groups.
        in: query
        name: responseGroups
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRuleCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductRuleCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductRuleCollection'
          description: OK
      summary: Get Product Rules
      tags:
      - ProductRules
      operationId: getCommerceRulesProduct
      x-operation-id-source: derived
    post:
      description: Creates a new product rule.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRule'
        description: The product rule to create.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductRule'
          description: OK
      summary: Create Product Rule
      tags:
      - ProductRules
      operationId: postCommerceRulesProduct
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/rules/product/validate:
    post:
      description: Validate the expression for a product rules
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogAdminsDynamicExpression'
        description: The expression to validate.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsDynamicExpression'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogAdminsDynamicExpression'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogAdminsDynamicExpression'
          description: OK
      summary: Validate Expression
      tags:
      - ProductRules
      operationId: postCommerceRulesProductValidate
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    ProductRuleCollection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProductRule'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    CatalogAdminsDynamicExpression:
      description: Category
      properties:
        text:
          type:
          - string
          - 'null'
        tree:
          $ref: '#/components/schemas/CatalogAdminsExpression'
      type: object
    ExpressionFieldDefinitionCollection:
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    CatalogAdminsExpression:
      properties:
        left:
          description: The field target of a predicate
          type:
          - string
          - 'null'
        logicalOperator:
          description: And or Or (if Container with More than one Node)
          type:
          - string
          - 'null'
        nodes:
          items:
            $ref: '#/components/schemas/CatalogAdminsExpression'
          type:
          - array
          - 'null'
        operator:
          description: The operator of a predicate
          type:
          - string
          - 'null'
        right:
          description: The literal values of a predicate
        type:
          description: Container or Predicate
          type:
          - string
          - 'null'
      type: object
    ProductRule:
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        code:
          description: Unique identifier of the ProductRule. System-supplied and read-only.
          type:
          - string
          - 'null'
        description:
          description: ProductRule description
          type:
          - string
          - 'null'
        expression:
          $ref: '#/components/schemas/CatalogAdminsDynamicExpression'
        metaData: {}
        name:
          description: ProductRule name
          type:
          - string
          - 'null'
        ruleType:
          description: The type of rule this ProductRule belongs to.
          minLength: 1
          type: string
        scope:
          description: 'Scope to which the ProductRule applies, valid values are: Product, Variant'
          type:
          - string
          - 'null'
      required:
      - ruleType
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_catalog_admin.json
- kibo-commerce-catalog-admin-openapi.yml
