openapi: 3.2.0
info:
  title: Kibo Commerce Shipment Release API
  version: '1.0'
  description: 'Operations tagged ShipmentRelease across 2 of this provider''s published API definitions: openapi_openapi_fulfillment.json, kibo-commerce-fulfillment-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: ShipmentRelease
paths:
  /commerce/shipments/{shipmentNumber}/release:
    delete:
      deprecated: false
      parameters:
      - description: If-Match
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      - description: shipmentNumber
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-site
        required: false
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-tenant
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EntityModelOfShipment'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelOfShipment'
            application/xml:
              schema:
                $ref: '#/components/schemas/EntityModelOfShipment'
          description: OK
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      summary: Clear Release Info
      tags:
      - ShipmentRelease
      operationId: deleteCommerceShipmentsByShipmentNumberRelease
      x-operation-id-source: derived
    get:
      deprecated: false
      parameters:
      - description: shipmentNumber
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-site
        required: false
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-tenant
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/ShipmentReleaseDto'
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get Release Info
      tags:
      - ShipmentRelease
      operationId: getCommerceShipmentsByShipmentNumberRelease
      x-operation-id-source: derived
    patch:
      deprecated: false
      parameters:
      - description: If-Match
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      - description: shipmentNumber
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-site
        required: false
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-tenant
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        $ref: '#/components/requestBodies/ShipmentReleaseDto'
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EntityModelOfShipment'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelOfShipment'
            application/xml:
              schema:
                $ref: '#/components/schemas/EntityModelOfShipment'
          description: OK
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      summary: Patch Release Info
      tags:
      - ShipmentRelease
      operationId: patchCommerceShipmentsByShipmentNumberRelease
      x-operation-id-source: derived
    put:
      deprecated: false
      parameters:
      - description: If-Match
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      - description: shipmentNumber
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-site
        required: false
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-tenant
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        $ref: '#/components/requestBodies/ShipmentReleaseDto'
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EntityModelOfShipment'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelOfShipment'
            application/xml:
              schema:
                $ref: '#/components/schemas/EntityModelOfShipment'
          description: OK
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Update Release Info
      tags:
      - ShipmentRelease
      operationId: putCommerceShipmentsByShipmentNumberRelease
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
