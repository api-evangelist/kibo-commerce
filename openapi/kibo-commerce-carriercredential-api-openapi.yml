components:
  schemas:
    CarrierCredentialSet:
      description: 'Stores a set of <see cref="T:Mozu.ShippingAdmin.Contracts.Carriers.CarrierCredentialSetValue">carrier credential key-value pairs</see>.

        Sets are stored at the tenant level and referenced by a Mozu.ShippingAdmin.Contracts.Carriers.CarrierCredential.'
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        carrierId:
          description: 'The Carrier ID associated with this credential set.

            Usually the short name of a carrier (e.g., "FedEx").'
          type:
          - string
          - 'null'
        code:
          description: 'A unique code identifying this credential set.

            The code is only guaranteed to be unique at the tenant and carrier level.'
          type:
          - string
          - 'null'
        integrationId:
          description: Specifies the ID returned from an integration.
          type:
          - string
          - 'null'
        name:
          description: A name (i.e., nickname) for this credential set.
          type:
          - string
          - 'null'
        values:
          description: A collection of values contained in this credential set.
          items:
            $ref: '#/components/schemas/CarrierCredentialSetValue'
          type:
          - array
          - 'null'
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    CarrierCredential:
      description: 'Stores a reference to a Mozu.ShippingAdmin.Contracts.Carriers.CarrierCredentialSet for use at different levels.

        Valid levels include Site, Location Group, and Location. Different levels may be used for rates versus labels.

        Site level is overriden by Location Group level which is overriden by Location level.'
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        carrierId:
          description: 'The Carrier ID associated with this carrier credential.

            Usually the short name of a carrier (e.g., "FedEx").'
          type:
          - string
          - 'null'
        credentialSet:
          $ref: '#/components/schemas/CarrierCredentialSet'
        locationCode:
          description: The Location Code associated with this carrier credential, if any.
          type:
          - string
          - 'null'
        locationGroupCode:
          description: The Location Group Code associated with this carrier credential, if any.
          type:
          - string
          - 'null'
        siteId:
          description: The Site ID associated with this carrier credential, if any.
          format: int32
          type:
          - integer
          - 'null'
      type: object
    CarrierCredentialSetValue:
      properties:
        key:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      type: object
    CarrierCredentialCollection:
      description: A collection of <see cref="T:Mozu.ShippingAdmin.Contracts.Carriers.CarrierCredential">carrier credentials</see>.
      properties:
        items:
          items:
            $ref: '#/components/schemas/CarrierCredential'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
