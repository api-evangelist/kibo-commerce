openapi: 3.2.0
info:
  title: Kibo Commerce Cart API
  version: '1.0'
  description: 'Operations tagged Cart across 2 of this provider''s published API definitions: openapi_openapi_commerce.json, kibo-commerce-commerce-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Cart
paths:
  /commerce/carts/current/bulkitems:
    post:
      description: Adds multiple cart items to the cart of the current shopper.
      parameters:
      - description: When set to true none of the items will be added when some items are invalid. when set to false valid items are added and invalid items are removed
        in: query
        name: throwErrorOnInvalidItems
        schema:
          type: boolean
      - description: Zip Code used for inventory reservation if cart having STH items.
        in: query
        name: zipCode
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/CartItem'
              type: array
        description: The items to add to the cart
      responses:
        '200':
          description: OK
      summary: Add Items To Cart
      tags:
      - Cart
      operationId: postCommerceCartsCurrentBulkitems
      x-operation-id-source: derived
    put:
      description: Updates multiple cart items in the cart of the current shopper.
      parameters:
      - description: When set to true none of the items will be updated when some items are invalid. when set to false valid items are updated and invalid items are reverted or removed based on removeInvalidItems flag
        in: query
        name: throwErrorOnInvalidItems
        schema:
          type: boolean
      - description: Zip Code used for inventory reservation if cart having STH items.
        in: query
        name: zipCode
        schema:
          type: string
      - description: When set to true and throwErrorOnInvalidItems is false, invalid items will be removed from cart instead of reverted. This parameter is ignored when throwErrorOnInvalidItems is true.
        in: query
        name: removeInvalidItems
        schema:
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/CartItem'
              type: array
        description: The items to update in the cart. Each item must include Id property.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CartItem'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/CartItem'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/CartItem'
                type: array
          description: OK
      summary: Update Cart Items
      tags:
      - Cart
      operationId: putCommerceCartsCurrentBulkitems
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/carts/{cartId}/bulkitems:
    post:
      description: Adds multiple cart items to the cart specified by cartId.
      parameters:
      - description: Unique identifier of the cart.
        in: path
        name: cartId
        required: true
        schema:
          type: string
      - description: When set to true none of the items will be added when some items are invalid. when set to false valid items are added and invalid items are removed
        in: query
        name: throwErrorOnInvalidItems
        schema:
          type: boolean
      - description: Zip Code used for inventory reservation if cart having STH items.
        in: query
