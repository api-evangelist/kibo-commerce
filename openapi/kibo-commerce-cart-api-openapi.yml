            text/json:
              schema:
                $ref: '#/components/schemas/Cart'
            text/plain:
              schema:
                $ref: '#/components/schemas/Cart'
          description: OK
      summary: Apply Coupon
      tags:
      - Cart
      operationId: putCommerceCartsByCartIdCouponsByCouponCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/carts/current/bulkitems/delete:
