                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/CartItem'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/CartItem'
                type: array
          description: OK
      summary: Update Cart Items By CartId
      tags:
      - Cart
      operationId: putCommerceCartsByCartIdBulkitems
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/carts/{cartId}/coupons/{couponCode}:
    delete:
      description: Remove a coupon that had been previously applied to the cart.
      parameters:
      - description: Unique identifier of the cart with the coupon you want to remove.
        in: path
        name: cartId
        required: true
        schema:
          type: string
      - description: Coupon code to remove.
        in: path
        name: couponCode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
