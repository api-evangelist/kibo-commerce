      summary: Add Items To Cart By CartId
      tags:
      - Cart
      operationId: postCommerceCartsByCartIdBulkitems
      x-operation-id-source: derived
    put:
      description: Updates multiple cart items in the cart specified by cartId.
      parameters:
      - description: Unique identifier of the cart.
        in: path
        name: cartId
        required: true
        schema:
          type: string
      - description: When set to true none of the items will be updated when some items are invalid. when set to false valid items are updated and invalid items are reverted or removed based on removeInvalidItems flag
        in: query
        name: throwErrorOnInvalidItems
        schema:
