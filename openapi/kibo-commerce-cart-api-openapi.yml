                $ref: '#/components/schemas/Cart'
            text/json:
              schema:
                $ref: '#/components/schemas/Cart'
            text/plain:
              schema:
                $ref: '#/components/schemas/Cart'
          description: OK
      summary: Remove Coupon
      tags:
      - Cart
      operationId: deleteCommerceCartsByCartIdCouponsByCouponCode
      x-operation-id-source: derived
    put:
      description: Apply coupon to the cart.
      parameters:
      - description: Unique identifier of the cart with which to associate the coupon.
        in: path
        name: cartId
        required: true
        schema:
          type: string
      - description: Coupon code that the customer supplies to get the discounted price.
        in: path
        name: couponCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
