        name: zipCode
        schema:
          type: string
      - description: When set to true and throwErrorOnInvalidItems is false, invalid items will be removed from cart instead of reverted. This parameter is ignored when throwErrorOnInvalidItems is true.
        in: query
        name: removeInvalidItems
        schema:
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/CartItem'
              type: array
        description: The items to update in the cart. Each item must include Id property.
      responses:
