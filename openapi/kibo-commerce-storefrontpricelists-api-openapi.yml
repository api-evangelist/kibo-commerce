paths:
  /commerce/catalog/storefront/pricelists/{priceListCode}:
    get:
      description: Retrieves the price list for the given priceListCode
      parameters:
      - in: path
        name: priceListCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesPriceList'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesPriceList'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesPriceList'
          description: OK
      summary: Get Price List
      tags:
      - StorefrontPriceLists
      operationId: getCommerceCatalogStorefrontPricelistsByPriceListCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/pricelists/resolved:
    get:
      description: This is primarily used when creating an offline order for a shopper. You can use this operation alongside custom Arc.js actions to alter the price list to which a shopper resolves.
      parameters:
      - in: query
        name: customerAccountId
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPriceList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResolvedPriceList'
            text/plain:
              schema:
                $ref: '#/components/schemas/ResolvedPriceList'
          description: OK
      summary: Get Resolved Price List (GET)
      tags:
      - StorefrontPriceLists
      operationId: getCommerceCatalogStorefrontPricelistsResolved
      x-operation-id-source: derived
    post:
      description: This is primarily used when creating an offline order for a shopper. You can use this operation alongside custom Arc.js actions to alter the price list to which a shopper resolves.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
