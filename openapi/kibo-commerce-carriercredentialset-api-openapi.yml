    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/shipping/admin/carriers/credential-sets/{carrierId}/{code}:
    delete:
      description: Deletes a carrier credential set
      parameters:
      - description: The carrier ID.
        in: path
        name: carrierId
        required: true
        schema:
          type: string
      - description: The carrier credential set code.
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
