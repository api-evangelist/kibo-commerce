      operationId: getCommerceShippingAdminCarriersCredentialSetsByCarrierIdByCode
      x-operation-id-source: derived
    put:
      description: Update an existing carrier credential set. See this guide for details about the fields that are required for each carrier.
      parameters:
      - description: The carrier ID.
        in: path
        name: carrierId
        required: true
        schema:
          type: string
      - description: The carrier credential set code.
        in: path
        name: code
        required: true
        schema:
