          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierCredentialSet'
        description: The carrier credential set data.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierCredentialSet'
            text/json:
              schema:
                $ref: '#/components/schemas/CarrierCredentialSet'
            text/plain:
              schema:
                $ref: '#/components/schemas/CarrierCredentialSet'
          description: Success
      summary: Create Carrier Credential Set
      tags:
      - CarrierCredentialSet
      operationId: postCommerceShippingAdminCarriersCredentialSetsByCarrierId
