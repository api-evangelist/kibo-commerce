      summary: Delete Carrier Credential Set
      tags:
      - CarrierCredentialSet
      operationId: deleteCommerceShippingAdminCarriersCredentialSetsByCarrierIdByCode
      x-operation-id-source: derived
    get:
      description: Returns a credential set based on a specific Carrier ID and Code
      parameters:
      - description: The carrier ID.
        in: path
        name: carrierId
        required: true
        schema:
          type: string
      - description: The carrier credential set code.
