            text/json:
              schema:
                $ref: '#/components/schemas/VendorDocument'
            text/plain:
              schema:
                $ref: '#/components/schemas/VendorDocument'
          description: OK
      summary: Get a specific document for a vendor and template
      tags:
      - Vendor
      operationId: getCommerceVendorsByVendorCodeDocumentsByTemplateId
      x-operation-id-source: derived
    post:
      parameters:
      - in: path
        name: vendorCode
        required: true
        schema:
          type: string
      - in: path
        name: templateId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                style: form
            schema:
              properties:
                file:
                  format: binary
                  type: string
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDocument'
            text/json:
              schema:
                $ref: '#/components/schemas/VendorDocument'
            text/plain:
              schema:
                $ref: '#/components/schemas/VendorDocument'
          description: OK
      summary: Upload a document from form data (memory-efficient streaming)
      tags:
      - Vendor
      operationId: postCommerceVendorsByVendorCodeDocumentsByTemplateId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
