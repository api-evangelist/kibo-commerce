openapi: 3.2.0
info:
  title: Kibo Commerce Vendor API
  version: '1.0'
  description: 'Operations tagged Vendor across 3 of this provider''s published API definitions: openapi_openapi_location.json, kibo-commerce-location-admin-openapi.yml, kibo-commerce-location-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Vendor
paths:
  /commerce/vendors/{vendorCode}/attributes:
    post:
      parameters:
      - in: path
        name: vendorCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorAttributeAddRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorAttribute'
            text/json:
              schema:
                $ref: '#/components/schemas/VendorAttribute'
            text/plain:
              schema:
                $ref: '#/components/schemas/VendorAttribute'
          description: OK
      summary: Add Vendor Attribute
      tags:
      - Vendor
      operationId: postCommerceVendorsByVendorCodeAttributes
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/vendors/{vendorCode}/documents/{templateId}/approve:
    put:
      parameters:
      - in: path
        name: vendorCode
        required: true
        schema:
          type: string
      - in: path
        name: templateId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorDocumentApprovalRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDocument'
            text/json:
              schema:
                $ref: '#/components/schemas/VendorDocument'
            text/plain:
              schema:
                $ref: '#/components/schemas/VendorDocument'
          description: OK
      summary: Approve a vendor document (US3)
      tags:
      - Vendor
      operationId: putCommerceVendorsByVendorCodeDocumentsByTemplateIdApprove
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/vendors/{vendorCode}/status:
    post:
      description: 'Transitions to Active status require full validation (address, SKU mappings, ReceiverId for EDIKibo).

        Transitions to Inactive or OnboardingInProcess have no validation requirements.'
      parameters:
      - description: Unique vendor code
        in: path
        name: vendorCode
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeVendorStatusRequest'
        description: Request containing new status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
            text/json:
              schema:
                $ref: '#/components/schemas/Vendor'
            text/plain:
              schema:
                $ref: '#/components/schemas/Vendor'
          description: OK
      summary: Change vendor status with validation based on target status
      tags:
      - Vendor
      operationId: postCommerceVendorsByVendorCodeStatus
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/vendors/{vendorCode}/documents/{templateId}/download:
    get:
      parameters:
      - description: The vendor code
        in: path
        name: vendorCode
        required: true
        schema:
          type: string
      - description: The document template ID
        in: path
        name: templateId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Download a document file for a vendor and template (memory-efficient streaming)
      tags:
      - Vendor
      operationId: getCommerceVendorsByVendorCodeDocumentsByTemplateIdDownload
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/vendors/{vendorCode}/documents/{templateId}:
    delete:
