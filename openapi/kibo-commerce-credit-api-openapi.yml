info:
  title: Kibo Commerce Credit API
  version: '1.0'
  description: 'Operations tagged Credit across 2 of this provider''s published API definitions: openapi_openapi_customer.json, kibo-commerce-customer-openapi.yml. Each path carries the servers of the definition it was published in.'
