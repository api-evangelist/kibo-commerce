components:
  schemas:
    CustomerCredit:
      description: Represetation of a store credit or gift card.
      properties:
        activationDate:
          description: 'Date the credit was activated.  Null if card is not active.

            Credits must be activated before they can be used.

            ReadOnly after activation'
          format: date-time
          type:
          - string
          - 'null'
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        code:
          description: 'Unique number identifier representing this credit.

            Number may be generated or set by the Tenant

            Number is unique within the Tenant context.

            ReadOnly after credit creation'
          type:
          - string
          - 'null'
        creditType:
          description: 'Type of Credit.

            Mozu.Customer.Contracts.Credit.Credit.CreditTypeConst

            Required.

            ReadOnly after credit creation'
          type:
          - string
          - 'null'
        creditTypeId:
          format: int32
          type: integer
        currencyCode:
          description: Currency Code
          type:
          - string
          - 'null'
        currentBalance:
          description: 'Do we want to track this here?

            Current Balance

            ReadOnly'
          format: double
          type:
          - number
          - 'null'
        customCreditType:
          description: 'Name of custom credit type

            Optional.'
          type:
          - string
          - 'null'
        customerId:
          description: 'Id of the N:Mozu.Customer

            that this credit is assigned to.

            Optional.'
          format: int32
          type:
          - integer
          - 'null'
        expirationDate:
          description: 'Date after which this credit is no longer valid

            Optional

            Defaults to 365 days'
          format: date-time
          type:
          - string
          - 'null'
        initialBalance:
          description: 'Balance assigned when credit was initially created.

            May be zero and updated later.

            ReadOnly after intial credit creation'
          format: double
          type:
          - number
          - 'null'
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    CreditCollection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CustomerCredit'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    CreditTransaction:
      description: Credit Transactions are used to make adjustments to a Credit Balance
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        comments:
          description: Comments about the transaction.  Depending on the user interface, these comments may be readable by authorized users or customers.
          type:
          - string
          - 'null'
        data:
          description: Custom data for credit transactions
        id:
          description: 'Id unique within the tenant

            ReadOnly'
          format: int32
          type:
          - integer
          - 'null'
        impactAmount:
          description: 'Amount to apply to Credit Balance

            Required'
          format: double
          type:
          - number
          - 'null'
        orderId:
          type:
          - string
          - 'null'
        transactionType:
          description: "Mozu.Customer.Contracts.Credit.CreditTransaction.CreditTransactionType\n            Requried"
          type:
          - string
          - 'null'
      type: object
    CreditAuditEntry:
      description: 'Log entry for any change made to a Credit.


        The system will generate all entries.  Contract is for display only.

        All values are ReadOnly.'
      properties:
        activityType:
          description: Mozu.Customer.Contracts.Credit.CreditAuditEntry.CreditAuditActivityType
          type:
          - string
          - 'null'
        activityTypeId:
          format: int32
          type: integer
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        details:
          description: Detials of what was done
          type:
          - string
          - 'null'
      type: object
    CreditTransactionCollection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CreditTransaction'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
    CreditAuditEntryCollection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CreditAuditEntry'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_customer.json
- kibo-commerce-customer-openapi.yml
