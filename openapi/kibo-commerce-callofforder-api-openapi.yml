      type: object
    CreditHoldStatus:
      description: 'Header-level credit-hold state for a CallOffOrder. Replaces the per-item

        CreditHold + CreditHoldReason fields that lived on CallOffOrderItem prior

        to this change — credit-hold is a header concern (one decision per order)

        not a per-line concern.'
      properties:
        onHold:
          description: True when the order is on credit hold.
          type: boolean
        reason:
          $ref: '#/components/schemas/CreditHoldReason'
      type: object
    Destination:
      properties:
        data:
          description: Custom data
          type:
          - object
          - 'null'
        destinationContact:
          $ref: '#/components/schemas/Contact'
        id:
          description: An identifier for this entry.
          type:
          - string
          - 'null'
        isDestinationCommercial:
          description: Indicates that the destination is commercial
          type:
          - boolean
          - 'null'
      type: object
    BillingInfo:
      description: 'Customer''s payment details such as payment type (credit card, check by mail, or PayPal)

        and cardholder information if payment is by credit card.'
      properties:
        auditInfo:
          $ref: '#/components/schemas/CoreApiContractsAuditInfo'
        billingContact:
          $ref: '#/components/schemas/Contact'
        card:
          $ref: '#/components/schemas/PaymentCard'
        check:
          $ref: '#/components/schemas/CheckPayment'
        customCreditType:
          description: Name of custom stored credit type
          type:
          - string
          - 'null'
        data:
          description: Custom data from payment providers
          type:
          - object
          - 'null'
        externalToken:
          $ref: '#/components/schemas/ExternalPaymentToken'
        externalTransactionId:
          description: Transaction Id from third party payment source like Visa Checkout, Amazon
          type:
          - string
          - 'null'
        isRecurring:
          description: Indicates whether the payment is used in recurring transactions. ex- subscription payments
          type: boolean
        isSameBillingShippingAddress:
          description: Indicates that billing and shipping address are the same
          type: boolean
        paymentType:
          description: 'Type of payment, such as credit card, check by mail, or PayPal.

            see Mozu.CommerceRuntime.Contracts.Payments.PaymentTypeConst for valid values'
          type:
          - string
          - 'null'
        paymentWorkflow:
          type:
          - string
          - 'null'
        purchaseOrder:
          $ref: '#/components/schemas/PurchaseOrderPayment'
        recurringTransactionId:
          description: 'Recurring Payment Id returned by Payment Gateway

            networkTransactionId for vantiv

            previousTransactionId for cybersource etc'
          type:
          - string
          - 'null'
        storeCreditCode:
          description: The store credit to use for this purchase
          type:
          - string
          - 'null'
        storeCreditType:
          description: The type of store credit used for this purchase
          type:
          - string
          - 'null'
        token:
          $ref: '#/components/schemas/PaymentToken'
      type: object
    BulkCancelResultItem:
      properties:
        cancelledResource: {}
        error:
          $ref: '#/components/schemas/BulkCancelError'
        orderId:
          type:
          - string
          - 'null'
        outcome:
          type:
          - string
          - 'null'
        resourceType:
          type:
          - string
          - 'null'
      type: object
    BulkCancelRequest:
      properties:
