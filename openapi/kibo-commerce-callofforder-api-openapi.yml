          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    PurchaseOrderCustomField:
      properties:
        code:
          type:
          - string
          - 'null'
        label:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      type: object
    CallOffOrderDemandEntry:
      description: 'A single bucket in a call-off order aggregate breakdown: the summed requested quantity

        for a group (product code, customer account, status, or month) plus a count of matching orders.'
      properties:
        key:
          description: 'The grouping key value. Meaning depends on the breakdown dimension:

            product code string, customer account id string, order status string,

            or ISO-8601 month string (yyyy-MM) for the monthly breakdown.'
          type:
          - string
          - 'null'
        orderCount:
          description: Number of distinct call-off orders in this bucket.
          format: int32
          type: integer
        totalRequestedQty:
          description: Sum of `items[].requestedQty` for call-off orders in this bucket.
          format: int64
          type: integer
      type: object
    CheckPayment:
      properties:
        checkNumber:
          type:
          - string
          - 'null'
      type: object
    PaymentCard:
      description: "If the customer is paying by credit card, the card holder's details, such as the name on the card, number, billing \naddress, and expiration dates."
      properties:
        bin:
          description: Year when the card expires.
          type:
          - string
          - 'null'
        cardNumberPartOrMask:
          description: "The visible part of the card number that the merchant uses to refer to \npayment information, for example, the last for digits of the card number."
          type:
          - string
          - 'null'
        ccLastFour:
          description: 'Last four digit of Credit card

            Only for OMS Only tenant.'
          type:
          - string
          - 'null'
        expireMonth:
          description: Month when the card expires.
          format: int32
          type: integer
        expireYear:
          description: Year when the card expires.
          format: int32
          type: integer
        isCardInfoSaved:
          description: If true, the card information is stored in the customer's account.
          type: boolean
        isTokenized:
          description: If true, the card is tokenized by external provider
          type: boolean
        isUsedRecurring:
          description: If true, the credit card is charged on a regular interval, such as for a subscription. (Not supported currently.)
          type:
          - boolean
          - 'null'
        nameOnCard:
          description: Card holder's name as it appears on the card.
          type:
          - string
          - 'null'
        paymentOrCardType:
          description: Card type such as Visa, MasterCard, American Express, or Discover.
          type:
          - string
          - 'null'
        paymentServiceCardId:
          description: Credit card number.
          type:
          - string
          - 'null'
      type: object
    BulkCancelResult:
      properties:
        correlationId:
          type:
          - string
          - 'null'
        resourceType:
          type:
          - string
          - 'null'
        results:
          items:
            $ref: '#/components/schemas/BulkCancelResultItem'
          type:
          - array
          - 'null'
        totalFailed:
          format: int32
          type: integer
        totalProcessed:
          format: int32
          type: integer
        totalRequested:
          format: int32
          type: integer
        totalSucceeded:
          format: int32
          type: integer
      type: object
    CallOffOrderItem:
      description: A requested product quantity for delivery to a specific address.
      properties:
        actualDeliveryDate:
          description: Actual delivery date, recorded once the line has been physically delivered.
          format: date-time
          type:
          - string
          - 'null'
        attributes:
          description: Line-level custom attributes extending AbstractAttribute.
          items:
            $ref: '#/components/schemas/CallOffOrderItemAttribute'
          type:
          - array
          - 'null'
        blanketOrderItemId:
          description: 'Identifier of the Blanket Order item this item draws from. Required

            when the parent call-off references a Blanket Order.'
          type:
          - string
          - 'null'
        cancelledBy:
          description: User who cancelled this line.
          type:
          - string
          - 'null'
        cancelledDate:
          description: Line cancellation timestamp.
          format: date-time
          type:
          - string
          - 'null'
        cancelledReason:
          $ref: '#/components/schemas/CanceledReason'
        destinationId:
          description: 'Identifier of the Destination in the parent call-off''s Destinations

            collection that this line ships to.'
          type:
          - string
          - 'null'
        eddStatus:
          description: 'Lifecycle state of Mozu.CommerceRuntime.Contracts.CallOffOrders.CallOffOrderItem.ExpectedDeliveryDate: null until first calculated,

            "Provisional" while Hold/PartiallyReserved/FullyReserved, then locked to "Final"

            at release. Exposed as a string on this Contracts DTO (not the Domain-layer enum),

            matching this entity''s existing convention for enum-backed fields (see FulfillmentType).'
          type:
          - string
          - 'null'
        expectedDeliveryDate:
          description: Expected delivery date, typically provided by the supplier or fulfillment system.
          format: date-time
          type:
          - string
          - 'null'
        fillRate:
          description: Computed fill ratio (ReservedQty / RequestedQty). Phase 2+.
          format: double
          type:
          - number
          - 'null'
        fulfillmentLocationCode:
          description: 'Pickup location code. Meaningful only when `FulfillmentType == "Pickup"`;

            ignored for Ship / Digital / Curbside / Delivery (downstream Order

            Routing handles those). Carried into the SalesOrder created by the

            Release Rules Engine (spec 005 FR-021).'
          type:
          - string
          - 'null'
        fulfillmentType:
          description: 'Per-line fulfillment method. One of: Ship, Pickup, Digital, Curbside, Delivery.

            In a future release, CallOffOrderItem may extend FulfillableCommerceItem.'
          type:
          - string
          - 'null'
        id:
          description: System-generated item identifier.
          type:
          - string
          - 'null'
        inventoryTags:
          description: 'Name-value pairs scoping the inventory pool for reservation. Set at

            item creation and immutable once a reservation exists.'
          items:
            $ref: '#/components/schemas/InventoryTags'
          type:
          - array
          - 'null'
        lineId:
          description: Sequential line identifier within the call-off, auto-assigned.
          format: int32
          type:
          - integer
          - 'null'
        lineTotal:
          description: 'Total amount for this line. Client-supplied in Mode 1; computed in

            Mode 2.'
          format: double
          type:
          - number
          - 'null'
        product:
          $ref: '#/components/schemas/CallOffOrderProductReference'
        purchaseLocation:
          description: 'Purchase location (store/location code) captured from the request context at

            line creation. Used for catalog price resolution and carried to the released

            Sales Order. Immutable after create.'
          type:
          - string
          - 'null'
        releasedDate:
          description: Timestamp when this line was released to a Sales Order (Phase 3).
          format: date-time
          type:
          - string
          - 'null'
        releasedQty:
          description: 'Quantity released to a Sales Order. Written in Phase 3; zero in

            Phases 1–2.'
          format: int32
          type: integer
        requestedDeliveryDate:
          description: Buyer-requested delivery date for this line.
          format: date-time
          type:
          - string
          - 'null'
        requestedQty:
          description: Buyer-requested quantity.
          format: int32
          type: integer
        requestedShipDate:
          description: 'Buyer-requested ship date. Must fall within the parent Blanket Order''s

            validity period when a Blanket Order is referenced.'
          format: date-time
          type:
          - string
          - 'null'
        reservedQty:
          description: 'Quantity reserved by the inventory reservation engine.

            Written in Phase 2; zero in Phase 1.'
          format: int32
          type: integer
        salesOrderId:
          description: 'The SalesOrder id this line was released into. Null until the line

            transitions to `Released` by the Release Rules Engine (spec 005).

            Immutable thereafter.'
          type:
          - string
          - 'null'
        status:
          description: 'Current line status. One of: Hold, PartiallyReserved, Released,

            Converted, Cancelled.'
          type:
          - string
          - 'null'
        timeFenceDays:
          description: 'Time-fence tolerance (days) from the ReservationRule that produced this line''s most

            recent reservation delta (spec COM-10941 follow-up).'
          format: int32
          type:
          - integer
          - 'null'
        unitPrice:
          description: 'Per-line unit price. Overridable — may come from the Blanket Order,

            be client-supplied, or be buyer-negotiated.'
          format: double
          type:
          - number
          - 'null'
      type: object
    CallOffOrderAttribute:
      description: 'Custom attribute for Call-Off Orders, following the same pattern

        as BlanketOrderAttribute and OrderAttribute.'
      properties:
        attributeDefinitionId:
          format: int32
          type:
          - integer
          - 'null'
        auditInfo:
          $ref: '#/components/schemas/CoreApiContractsAuditInfo'
        fullyQualifiedName:
          type:
          - string
          - 'null'
        values:
          items: {}
          type:
          - array
          - 'null'
      type: object
    ExternalPaymentToken:
      description: 'Structured payment token for external (non-Mozu) payment processors.


        Distinct from legacy PaymentToken (Apple Pay / PayPal).


        Used in COM-10873 externally tokenized payments feature.


        Validation rules:

        - All three fields (PaymentServiceTokenId, Type, Provider) are required

        - Type must match BillingInfo.PaymentType (case-insensitive)

        - Feature gate (externalTokenizationEnabled) must be true'
      properties:
        paymentServiceTokenId:
          description: Actual token value from the external payment provider.
          type:
          - string
          - 'null'
        provider:
          description: External token provider identifier (e.g., "Stripe", "Square", "PayPal").
          type:
          - string
          - 'null'
        type:
          description: 'Payment method type (e.g., "CreditCard", "PayPal", "ApplePay").

            Must match BillingInfo.PaymentType exactly (case-insensitive).'
          type:
          - string
          - 'null'
      type: object
    InventoryTags:
      properties:
        name:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      type: object
    BundledProduct:
      description: Describes products that are bundled inside of a main bundle product.
      properties:
        allocationExpiration:
          description: Allocation ID associated with this product on this order.
          format: date-time
          type:
          - string
          - 'null'
        allocationId:
          description: Allocation ID associated with this product on this order.
          format: int32
          type:
          - integer
          - 'null'
        creditValue:
          description: Credit value.  Only populated if the bundled product is a gift card or digital credit
          format: double
          type:
          - number
          - 'null'
        deltaPrice:
          description: Only populated for extras
          format: double
          type:
