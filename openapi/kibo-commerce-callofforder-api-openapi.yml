          type:
          - string
          - 'null'
        orderIds:
          items:
            type: string
          type:
          - array
          - 'null'
        reason:
          $ref: '#/components/schemas/CanceledReason'
      type: object
    CallOffOrderItemAttribute:
      description: 'Custom attribute for Call-Off Order line items, following the same pattern

        as CallOffOrderAttribute.'
      properties:
        attributeDefinitionId:
          format: int32
          type:
          - integer
          - 'null'
        auditInfo:
          $ref: '#/components/schemas/CoreApiContractsAuditInfo'
        fullyQualifiedName:
          type:
          - string
          - 'null'
        values:
          items: {}
          type:
          - array
          - 'null'
      type: object
    ProductStock:
      properties:
        aggregateInventory:
          format: int32
          type:
          - integer
          - 'null'
        availableDate:
          format: date-time
          type:
          - string
          - 'null'
        availableFutureInventories:
          format: int32
          readOnly: true
          type: integer
        futureInventories:
          items:
            $ref: '#/components/schemas/FutureInventory'
          type:
          - array
          - 'null'
        isOnBackOrder:
          type: boolean
        isSubstitutable:
          type:
          - boolean
          - 'null'
        manageStock:
          type: boolean
        stockAvailable:
          format: int32
          type:
          - integer
          - 'null'
        totalAvailableStock:
          format: int32
          readOnly: true
          type: integer
      type: object
    CanceledReason:
      allOf:
      - $ref: '#/components/schemas/Reason'
      - additionalProperties: false
        type: object
    CreditHoldReason:
      allOf:
      - $ref: '#/components/schemas/Reason'
      - additionalProperties: false
        type: object
    CallOffPayment:
      description: 'Optional payment commitment on a call-off order.

        v1 supports only PurchaseOrder payment type.

        At release, this payment is mapped onto each sibling Sales Order via

        `IPaymentHandler.CreatePaymentActionAsync` with Amount = that order''s Total.'
      properties:
        amount:
          description: 'Optional total authorization amount. Defaults to the call-off TotalAmount when null.

            Per-destination Sales Order payment uses that order''s individual Total.'
          format: double
          type:
          - number
          - 'null'
        billingInfo:
          $ref: '#/components/schemas/BillingInfo'
        data:
          description: ERP / extensibility data bag.
          type:
          - object
          - 'null'
        paymentTerms:
          description: Payment terms code (e.g. "Net30"). Optional; defaults to B2B account terms downstream.
          type:
          - string
          - 'null'
        paymentType:
          description: 'Payment type — only `PurchaseOrder` is supported in v1.

            See Mozu.CommerceRuntime.Contracts.CallOffOrders.CallOffPayment.PaymentTypeConst.'
          type:
          - string
          - 'null'
        purchaseOrderNumber:
          description: Buyer's PO number. Required when Mozu.CommerceRuntime.Contracts.CallOffOrders.CallOffPayment.PaymentType is PurchaseOrder.
          type:
          - string
          - 'null'
      type: object
    CallOffOrderChangeMessageCollection:
      description: Paged result for Call-Off Order change-message queries.
      properties:
        items:
          description: Page of change messages matching the query.
          items:
            $ref: '#/components/schemas/CallOffOrderChangeMessage'
          type:
          - array
          - 'null'
        pageSize:
          description: Maximum number of records per page.
          format: int32
          type: integer
        startIndex:
          description: Zero-based index of the first record in this page.
          format: int32
          type: integer
        totalCount:
          description: Total number of matching messages across all pages.
          format: int32
          type: integer
      type: object
    Contact:
      properties:
        address:
