          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        id:
          format: int32
          type:
          - integer
          - 'null'
        lastNameOrSurname:
          type:
          - string
          - 'null'
        middleNameOrInitial:
