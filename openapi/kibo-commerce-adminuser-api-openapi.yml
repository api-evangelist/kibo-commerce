            text/plain:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
      summary: Get User
      tags:
      - AdminUser
      operationId: getPlatformAdminuserAccountsByUserId
      x-operation-id-source: derived
    put:
      description: Modifies user information for a specified user.
      parameters:
      - description: Unique identifier of the user whose login information you want to change.
        in: path
        name: userId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        description: 'Details of the new user account. Required properties: EmailAddress, FirstName, LastName, and Password. Note that the site ID is passed in the request header.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            text/json:
              schema:
                $ref: '#/components/schemas/User'
            text/plain:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
      summary: Update User
      tags:
      - AdminUser
      operationId: putPlatformAdminuserAccountsByUserId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
