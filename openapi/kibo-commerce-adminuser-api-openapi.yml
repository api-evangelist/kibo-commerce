openapi: 3.2.0
info:
  title: Kibo Commerce Admin User API
  version: '1.0'
  description: 'Operations tagged AdminUser across 3 of this provider''s published API definitions: openapi_openapi_tenant_and_user.json, kibo-commerce-tenant-and-user-openapi.yml, kibo-commerce-user-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: AdminUser
paths:
  /platform/adminuser/accounts/{userId}/roles/{roleId}:
    delete:
      description: Removes a role from the specified Admin account.
      parameters:
      - description: Unique identifier of the user with the role to delete.
        in: path
        name: userId
        required: true
        schema:
          type: string
      - description: Unique identifer of the role to delete.
        in: path
        name: roleId
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          description: OK
      summary: Remove User Role
      tags:
      - AdminUser
      operationId: deletePlatformAdminuserAccountsByUserIdRolesByRoleId
      x-operation-id-source: derived
    post:
      description: Adds a role to the specified user's Admin account.
      parameters:
      - description: Unique identifier of the user who receives the role.
        in: path
        name: userId
        required: true
        schema:
          type: string
      - description: Unique identifier of the role to add.
        in: path
        name: roleId
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Add User Role
      tags:
      - AdminUser
      operationId: postPlatformAdminuserAccountsByUserIdRolesByRoleId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /platform/adminuser/accounts/{userId}/Change-Password:
    post:
      description: Change a password
      parameters:
      - description: Unique identifier of the user for whom to change the password.
        in: path
        name: userId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInfo'
        description: Old password and new password.
      responses:
        '200':
          description: OK
      summary: Change Password
      tags:
      - AdminUser
