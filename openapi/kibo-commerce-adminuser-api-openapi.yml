        description: New password info for this user
      responses:
        '200':
          description: OK
      summary: Change User Password
      tags:
      - AdminUser
      operationId: postPlatformAdminuserAccountsByUserIdChangeUserPassword
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
