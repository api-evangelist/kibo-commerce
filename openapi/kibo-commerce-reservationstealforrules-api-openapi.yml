      summary: Get reservation steal-for rule by code
      tags:
      - ReservationStealForRules
      operationId: getCommerceRulesReservationstealforByCode
      x-operation-id-source: derived
    put:
      description: Updates an existing reservation steal-for rule with full replacement semantics (FR-009).
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationStealForRule'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationStealForRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ReservationStealForRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReservationStealForRule'
          description: OK
      summary: Update reservation steal-for rule
      tags:
      - ReservationStealForRules
      operationId: putCommerceRulesReservationstealforByCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
