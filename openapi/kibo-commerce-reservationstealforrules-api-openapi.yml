      tags:
      - ReservationStealForRules
      operationId: deleteCommerceRulesReservationstealforByCode
      x-operation-id-source: derived
    get:
      description: Gets a reservation steal-for rule by its unique code.
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationStealForRule'
            text/json:
