      operationId: getCommerceCustomerCustomerSetsByCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/customer/customerSets:
    get:
      description: Retrieves a list of all customerSets defined for the site according to any specified filter criteria and sort options.
      parameters:
      - description: "Used to page results from a query. Indicates the zero-based offset in the complete result set where the returned entities begin. \n            For example, with a PageSize of 25, to get the 51st through the 75th items, startIndex=3. The default value is 0. Optional."
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - description: "Used to page results from a query. \n            Indicates the maximum number of entities to return from a query. The default value is 20 and the maximum value is 200. Optional."
        in: query
        name: pageSize
        schema:
          default: 20
          format: int32
          type: integer
      - description: The element to sort the results by and the order in which the results appear. Either ascending (a-z) or descending (z-a) order. Optional.
        in: query
        name: sortBy
        schema:
          default: ''
          type: string
      - in: query
        name: responseGroups
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
