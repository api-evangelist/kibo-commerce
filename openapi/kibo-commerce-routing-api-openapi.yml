        created:
          format: date-time
          type: string
        creatorUsername:
          type: string
        durationType:
          enum:
          - HOURS
          - DAYS
          - WEEKS
          - MONTHS
          type: string
        environmentID:
          format: int32
          type: integer
        fulfillmentLimit:
          minimum: 0
