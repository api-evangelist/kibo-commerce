          type: integer
        extensibleAttributeFQN:
          type: string
        extensibleAttributeName:
          type: string
        extensibleFilter:
          type: boolean
        filterID:
          format: int32
          type: integer
        filterLogicalGroupOrderIndex:
          format: int32
          type: integer
        filterUnit:
