            standardUnit:
              properties:
                dimension:
                  type: object
              type: object
          type: object
        inventoryBasedFilter:
          type: boolean
        itemBasedFilter:
          type: boolean
        locationBasedFilter:
          type: boolean
        name:
          maxLength: 255
          minLength: 1
          type: string
        orderIndex:
          format: int32
          type: integer
        orderLocationFilterEqualToLocationOrInventoryFilter:
          type: boolean
        pathString:
          type: string
        persisted:
          type: boolean
        siteID:
          format: int32
          type: integer
        suggestionEventListeners:
          items:
            $ref: '#/components/schemas/SuggestionEventListener'
          type: array
          uniqueItems: true
        tenantID:
          format: int32
          type: integer
        updated:
          format: date-time
          type: string
        updaterUsername:
          type: string
        userContext:
          $ref: '#/components/schemas/UserContextInformation'
