openapi: 3.2.0
info:
  title: Kibo Commerce Reservation Rules API
  version: '1.0'
  description: 'Operations tagged ReservationRules across 4 of this provider''s published API definitions: openapi_openapi_catalog_admin.json, openapi_openapi_commerce.json, kibo-commerce-catalog-admin-openapi.yml, kibo-commerce-commerce-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: ReservationRules
paths:
  /commerce/rules/reservation/{code}:
    delete:
      description: Permanently deletes a reservation rule (FR-013 hard delete).
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete reservation rule
      tags:
      - ReservationRules
      operationId: deleteCommerceRulesReservationByCode
      x-operation-id-source: derived
    get:
      description: Gets a reservation rule by its unique code.
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ReservationRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReservationRule'
          description: OK
      summary: Get reservation rule by code
      tags:
      - ReservationRules
      operationId: getCommerceRulesReservationByCode
      x-operation-id-source: derived
    put:
      description: Updates an existing reservation rule with full replacement semantics (FR-009).
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRule'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ReservationRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReservationRule'
          description: OK
      summary: Update reservation rule
      tags:
      - ReservationRules
      operationId: putCommerceRulesReservationByCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/rules/reservation:
    get:
      description: Gets a collection of reservation rules according to any specified filter criteria and sort options.
      parameters:
      - in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: pageSize
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: sortBy
        schema:
          type: string
      - in: query
        name: filter
        schema:
          type: string
      - in: query
        name: responseGroups
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationRuleCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ReservationRuleCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReservationRuleCollection'
          description: OK
      summary: Get reservation rules
      tags:
      - ReservationRules
      operationId: getCommerceRulesReservation
      x-operation-id-source: derived
    post:
      description: Creates a new reservation rule.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRule'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationRule'
            text/json:
              schema:
                $ref: '#/components/schemas/ReservationRule'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReservationRule'
          description: OK
      summary: Create reservation rule
      tags:
      - ReservationRules
      operationId: postCommerceRulesReservation
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/rules/reservation/{code}/rank:
    put:
      description: Updates the rank for a reservation rule and atomically reorders all other rules in the current master catalog.
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRankRequest'
      responses:
        '200':
          description: OK
      summary: Update reservation rule rank
      tags:
      - ReservationRules
      operationId: putCommerceRulesReservationByCodeRank
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/jobs/reservation-rules/call-offs/{callOffOrderId}/runs:
    get:
      description: 'a given CallOffOrder, most recent first. Drives the order-detail

        "reservation history" panel.'
      parameters:
      - in: path
        name: callOffOrderId
        required: true
        schema:
          type: string
      - in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - in: query
