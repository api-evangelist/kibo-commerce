openapi: 3.2.0
info:
  title: Kibo Commerce Redaction API
  version: '1.0'
  description: 'Operations tagged Redaction across 2 of this provider''s published API definitions: openapi_openapi_gdpr.json, kibo-commerce-gdpr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Redaction
paths:
  /platform/data/redaction/execute/{reportId}:
    post:
      description: Executes an approved draft redaction report. This action is irreversible — it permanently removes or overwrites all PII identified in the report. The report status changes from Draft to Executed and operationLog is populated. See the Redaction Services Developer Guide for the complete workflow and warnings.
      parameters:
      - in: path
        name: reportId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
          description: OK
      summary: Execute Redaction
      tags:
      - Redaction
      operationId: postPlatformDataRedactionExecuteByReportId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /platform/data/redaction/report/{reportId}:
    get:
      description: Retrieves a single redaction report by ID. Returns the full report including affectedEntities and, after execution, the operationLog. Use this to review a draft before executing or to audit a completed redaction. See the Redaction Services Developer Guide for field descriptions.
      parameters:
      - in: path
        name: reportId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
          description: OK
      summary: Get Redaction Report
      tags:
      - Redaction
      operationId: getPlatformDataRedactionReportByReportId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /platform/data/redaction/report:
    get:
      description: Lists redaction reports for the tenant, with optional filtering by status (Draft or Executed) and date range. Returns summary objects without affectedEntities or operationLog; retrieve individual reports by ID for full details. See the Redaction Services Developer Guide for auditing guidance.
      parameters:
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: page
        schema:
          format: int32
          type: integer
      - in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - in: query
        name: from
        schema:
          format: date-time
          type: string
      - in: query
        name: to
        schema:
          format: date-time
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactionReportSummaryListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RedactionReportSummaryListResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/RedactionReportSummaryListResponse'
          description: OK
      summary: List Redaction Reports
      tags:
      - Redaction
      operationId: getPlatformDataRedactionReport
      x-operation-id-source: derived
    post:
      description: Creates a draft redaction report by scanning tenant data for all PII associated with the specified data subject. No data is modified at this stage. Review the returned report before executing. See the Redaction Services Developer Guide for the complete two-phase workflow.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
          description: OK
      summary: Generate Redaction Report
      tags:
      - Redaction
      operationId: postPlatformDataRedactionReport
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
