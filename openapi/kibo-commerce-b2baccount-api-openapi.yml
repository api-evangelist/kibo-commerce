  /commerce/customer/b2baccounts/accountsbyuser:
    get:
      description: Retrieves account IDs of all active accounts that a user belongs to by username or email. If emailAddress and userName are both provided, the email address will be used. When getAllAccounts is set to true, all accounts will be returned regardless of the AccountStatus.
      parameters:
