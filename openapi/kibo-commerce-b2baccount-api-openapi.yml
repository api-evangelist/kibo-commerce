      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          format: int32
          type: integer
      - description: Unique identifier of the user with the role to delete.
        in: path
        name: userId
        required: true
        schema:
          type: string
      - description: Unique identifer of the role to delete.
        in: path
        name: roleId
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          description: OK
      summary: Remove User Role Async
      tags:
      - B2BAccount
      operationId: deleteCommerceCustomerB2baccountsByAccountIdUserByUserIdRolesByRoleId
      x-operation-id-source: derived
    post:
      description: Add a role to B2B user. These roles include Admin, Purchaser, and Non-Purchaser.
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          format: int32
          type: integer
      - description: Unique identifier of the user who receives the role.
        in: path
        name: userId
        required: true
        schema:
          type: string
      - description: Unique identifier of the role to add.
        in: path
        name: roleId
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          description: OK
