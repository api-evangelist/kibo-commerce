  /commerce/customer/b2baccounts/roles:
    post:
      description: 'Required fields:

        - Name: Role name (must be unique within tenant)

        - Behaviors: List of behavior IDs (at least one required)

        - AccountIds: List of account IDs to associate with role (at least one required)'
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B2BRole'
        description: Role payload containing name, behaviors, and accountIds
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BRole'
            text/json:
              schema:
                $ref: '#/components/schemas/B2BRole'
            text/plain:
              schema:
                $ref: '#/components/schemas/B2BRole'
