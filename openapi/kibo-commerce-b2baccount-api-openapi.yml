openapi: 3.2.0
info:
  title: Kibo Commerce B2B Account API
  version: '1.0'
  description: 'Operations tagged B2BAccount across 2 of this provider''s published API definitions: openapi_openapi_customer.json, kibo-commerce-customer-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: B2BAccount
paths:
  /commerce/customer/b2baccounts/{accountId}/salesrep/{userId}:
    delete:
      description: Removes a specific sales rep from B2B account .
      parameters:
      - description: ''
        in: path
        name: accountId
        required: true
        schema:
          format: int32
          type: integer
      - description: ''
        in: path
        name: userId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/B2BAccount'
            text/plain:
              schema:
                $ref: '#/components/schemas/B2BAccount'
          description: OK
      summary: Remove Sales Rep From B2B Account
      tags:
      - B2BAccount
      operationId: deleteCommerceCustomerB2baccountsByAccountIdSalesrepByUserId
      x-operation-id-source: derived
    post:
      description: Adds a sales rep to a B2B account.
      parameters:
      - description: ''
        in: path
        name: accountId
        required: true
        schema:
          format: int32
          type: integer
      - description: ''
        in: path
        name: userId
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
