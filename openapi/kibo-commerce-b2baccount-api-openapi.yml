      operationId: postCommerceCustomerB2baccountsByAccountIdUserByUserIdRolesByRoleId
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/customer/b2baccounts/roles/{roleId}/accounts/{accountId}:
    delete:
