  /commerce/customer/b2baccounts/roles/{roleId}/accounts/{accountId}/apply-to-future-children/{enabled}:
    put:
      description: 'This setting only affects future account creation and does not modify existing child accounts.

        The inheritance applies to all levels of the hierarchy (children, grandchildren, etc.).

        When enabled, the system will automatically assign this role to all future child accounts

        and grandchildren created under the specified account in the hierarchy.'
      parameters:
      - description: Role ID
        in: path
        name: roleId
        required: true
        schema:
          format: int32
          type: integer
      - description: Account ID
        in: path
        name: accountId
        required: true
        schema:
          format: int32
          type: integer
      - description: True to apply role to future children, false to disable
        in: path
        name: enabled
        required: true
        schema:
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Enable or disable role inheritance for future child accounts
      tags:
      - B2BAccount
      operationId: putCommerceCustomerB2baccountsRolesByRoleIdAccountsByAccountIdApplyToFutureChildrenByEnabled
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
