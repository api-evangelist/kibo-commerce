      operationId: deleteCommerceCustomerB2baccountsRolesByRoleIdAccountsByAccountId
      x-operation-id-source: derived
    put:
      description: Assign a role to a specific account.
      parameters:
      - description: Role ID
        in: path
        name: roleId
        required: true
        schema:
          format: int32
          type: integer
      - description: Account ID
        in: path
        name: accountId
        required: true
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
