openapi: 3.2.0
info:
  title: Kibo Commerce Inventory Fetch File Config API
  version: '1.0'
  description: 'Operations tagged InventoryFetchFileConfig across 2 of this provider''s published API definitions: openapi_openapi_inventory.json, kibo-commerce-inventory-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: InventoryFetchFileConfig
paths:
  /commerce/inventory/v1/config/fetchfile/{fetchFileConfigID}:
    delete:
      description: Deletes a fetch file configuration.
      parameters:
      - description: Id of fetch file config
        in: path
        name: fetchFileConfigID
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
          description: Success
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Delete Fetch Config
      tags:
      - InventoryFetchFileConfig
      operationId: deleteCommerceInventoryV1ConfigFetchfileByFetchFileConfigID
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/inventory/v1/config/fetchfile:
    get:
      description: Get the Fetch File Configs for the current tenant
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M_FetchFileConfig'
          description: Success
        '404':
          description: Not Found
      summary: Get Fetch Config
      tags:
      - InventoryFetchFileConfig
      operationId: getCommerceInventoryV1ConfigFetchfile
      x-operation-id-source: derived
    post:
      description: Save a new Fetch File Configuration.
      parameters: []
      requestBody:
        $ref: '#/components/requestBodies/FetchFileConfigRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
          description: Success
        '400':
          description: Bad Request
      summary: Save Fetch Config
      tags:
      - InventoryFetchFileConfig
      operationId: postCommerceInventoryV1ConfigFetchfile
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/inventory/v1/config/fetchfile/testConnection/{fetchFileConfigID}:
    get:
      description: Attempts to connect to a fetch file endpoint and lists current files if successful
      parameters:
      - description: Id of fetch file config
        in: path
        name: fetchFileConfigID
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchFileConnectionResponse'
          description: Success
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Test Connection
      tags:
      - InventoryFetchFileConfig
      operationId: getCommerceInventoryV1ConfigFetchfileTestConnectionByFetchFileConfigID
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
