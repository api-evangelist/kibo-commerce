openapi: 3.2.0
info:
  title: Kibo Commerce Quote API
  version: '1.0'
  description: 'Operations tagged Quote across 2 of this provider''s published API definitions: openapi_openapi_commerce.json, kibo-commerce-commerce-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Quote
paths:
  /commerce/quotes/{quoteId}/coupons/{couponCode}:
    delete:
      description: Removes a coupon that had been previously applied to the Quote.
      parameters:
      - description: Unique identifier of the Quote with the coupon you want to remove.
        in: path
        name: quoteId
        required: true
        schema:
          type: string
      - description: Coupon code to remove.
        in: path
        name: couponCode
        required: true
        schema:
          type: string
      - description: ''
        in: query
        name: updateMode
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
            text/json:
              schema:
                $ref: '#/components/schemas/Quote'
            text/plain:
              schema:
                $ref: '#/components/schemas/Quote'
          description: OK
      summary: Remove Coupon
      tags:
      - Quote
      operationId: deleteCommerceQuotesByQuoteIdCouponsByCouponCode
      x-operation-id-source: derived
    put:
      description: Apply a coupon to the quote.
      parameters:
      - description: Unique identifier of the quote with which to associate the coupon.
        in: path
        name: quoteId
        required: true
        schema:
          type: string
      - description: Coupon code that the customer supplies to get the discounted price.
        in: path
        name: couponCode
        required: true
        schema:
          type: string
      - description: ''
        in: query
        name: updateMode
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
            text/json:
              schema:
                $ref: '#/components/schemas/Quote'
            text/plain:
              schema:
                $ref: '#/components/schemas/Quote'
          description: OK
      summary: Apply Coupon
      tags:
      - Quote
      operationId: putCommerceQuotesByQuoteIdCouponsByCouponCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
