      - in: query
        name: publishEvents
        schema:
          default: true
          type: boolean
      - in: query
        name: invalidateCache
        schema:
          default: true
          type: boolean
      - description: Returns status codes of 200 (complete success), 206 (some entries failed validation), 409 (all entries failed validation), or 500 (unexpected failure)
        in: query
        name: allowPartialSuccess
        schema:
          type: boolean
      - in: query
        name: batchJobCode
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/PriceListEntry'
              type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListBulkResult'
            text/json:
              schema:
                $ref: '#/components/schemas/PriceListBulkResult'
            text/plain:
              schema:
                $ref: '#/components/schemas/PriceListBulkResult'
          description: OK
      summary: Bulk Add Price List Entries
      tags:
      - PriceListEntries
      operationId: postCommerceCatalogAdminPricelistsBulkaddentries
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/pricelists/bulkdeleteentries:
    post:
      description: Deletes up to 5000 price list entries in bulk. By default, any single error will cause the entire batch to fail. If desired, set allowPartialSuccess=true to allow valid entries to be completed even if others in the batch fail.
