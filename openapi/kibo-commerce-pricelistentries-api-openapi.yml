          description: OK
      summary: Bulk Delete Price List Entries
      tags:
      - PriceListEntries
      operationId: postCommerceCatalogAdminPricelistsBulkdeleteentries
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/admin/pricelists/bulkupdateentries:
    post:
      description: 'Updates up to 5000 price list entries in bulk. By default, any single error will cause the entire batch to fail. If desired, set allowPartialSuccess=true to allow valid entries to be completed even if others in the batch fail.

        This method performs an upsert, which will add missing entries if they do not exist. It can be used in place of Bulk Add Price List Entries to simplify application logic when the desired behavior is to update an entry or add the entry if it does not exist.


        Disable the publishEvents parameter to prevent publishing the event related to updating price list entries in the system. Disabling this property helps you prevent performance delays if you expect the event to trigger the re-indexing of a large number of products, or if you want to postpone the operations of other applications and services listening for the event. Disable the invalidateCache parameter if you expect to encounter unacceptable performance hits related to clearing the cache for each product in the price list entries.'
      parameters:
      - in: query
        name: publishEvents
        schema:
          default: true
          type: boolean
      - in: query
        name: invalidateCache
        schema:
          default: true
          type: boolean
      - in: query
        name: allowPartialSuccess
        schema:
          type: boolean
      - in: query
        name: batchJobCode
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/PriceListEntry'
              type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListBulkResult'
            text/json:
              schema:
                $ref: '#/components/schemas/PriceListBulkResult'
            text/plain:
              schema:
                $ref: '#/components/schemas/PriceListBulkResult'
          description: OK
      summary: Bulk Update Price List Entries
      tags:
      - PriceListEntries
      operationId: postCommerceCatalogAdminPricelistsBulkupdateentries
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
