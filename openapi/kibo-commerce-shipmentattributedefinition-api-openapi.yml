          type: string
      - allowEmptyValue: false
        description: Specific fields to include in response
        in: query
        name: responseFields
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        description: Response groups for selective field inclusion
        in: query
        name: responseGroups
        required: false
        schema:
          type: string
      - in: header
        name: x-vol-site
        required: false
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-tenant
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/FulfillmentAPIAttribute'
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentAPIAttribute'
            application/xml:
              schema:
                $ref: '#/components/schemas/FulfillmentAPIAttribute'
          description: Successfully retrieved attribute
        '400':
          description: Invalid attribute FQN
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - insufficient permissions (requires Order Read or Order Ship)
        '404':
          description: Attribute not found
        '500':
          description: Internal server error
      summary: Get single shipment attribute definition
      tags:
      - ShipmentAttributeDefinition
      operationId: getCommerceShipmentsAttributedefinitionAttributesByAttributeFQN
