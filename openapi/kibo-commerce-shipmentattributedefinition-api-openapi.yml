          format: int32
          type: integer
      - allowEmptyValue: false
        description: Specific fields to include in response
        in: query
        name: responseFields
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        description: Response groups for selective field inclusion
        in: query
        name: responseGroups
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        description: Sort field and direction
        example: adminName asc
        in: query
        name: sortBy
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        description: Starting index for pagination
        example: 0
        in: query
        name: startIndex
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - in: header
        name: x-vol-site
        required: false
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-tenant
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/FulfillmentAPIAttributeCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentAPIAttributeCollection'
            application/xml:
              schema:
                $ref: '#/components/schemas/FulfillmentAPIAttributeCollection'
          description: Successfully retrieved line item attributes
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - insufficient permissions (requires Order Read or Order Ship)
        '404':
          description: Not Found
        '500':
          description: Internal server error
      summary: Get shipment line item attribute definitions
      tags:
      - ShipmentAttributeDefinition
      operationId: getCommerceShipmentsAttributedefinitionItemsAttributes
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/shipments/attributedefinition/attributes/{attributeFQN}:
    get:
      deprecated: false
      description: Retrieves a specific shipment attribute definition by its fully qualified name. Requires Order Read or Order Ship permissions.
      parameters:
      - description: Fully qualified name of the attribute
        example: shipment.customField1
        in: path
        name: attributeFQN
        required: true
