openapi: 3.2.0
info:
  title: Kibo Commerce Shipment Attribute Definition API
  version: '1.0'
  description: 'Operations tagged ShipmentAttributeDefinition across 2 of this provider''s published API definitions: openapi_openapi_fulfillment.json, kibo-commerce-fulfillment-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: ShipmentAttributeDefinition
paths:
  /commerce/shipments/attributedefinition/attributes/{attributeFQN}/vocabularyValues:
    get:
      deprecated: false
      description: Retrieves vocabulary values for a specific attribute (if it has predefined values). Requires Order Read or Order Ship permissions.
      parameters:
      - description: Fully qualified name of the attribute
        example: shipment.customField1
        in: path
        name: attributeFQN
        required: true
        schema:
          type: string
      - allowEmptyValue: false
        description: Specific fields to include in response
        in: query
        name: responseFields
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        description: Response groups for selective field inclusion
        in: query
        name: responseGroups
        required: false
        schema:
          type: string
      - in: header
        name: x-vol-site
        required: false
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-tenant
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/CollectionModelOfAttributeVocabularyValue'
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModelOfAttributeVocabularyValue'
            application/xml:
              schema:
                $ref: '#/components/schemas/CollectionModelOfAttributeVocabularyValue'
          description: Successfully retrieved vocabulary values
        '400':
          description: Invalid attribute FQN
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - insufficient permissions (requires Order Read or Order Ship)
        '404':
          description: Attribute not found or has no vocabulary values
        '500':
          description: Internal server error
      summary: Get attribute vocabulary values
      tags:
      - ShipmentAttributeDefinition
      operationId: getCommerceShipmentsAttributedefinitionAttributesByAttributeFQNVocabularyValues
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/shipments/attributedefinition/attributes:
    get:
      deprecated: false
      description: Retrieves shipment attribute definitions with optional filtering and pagination. Requires Order Read or Order Ship permissions.
      parameters:
      - allowEmptyValue: false
        description: Filter criteria for attributes
        in: query
        name: filter
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        description: Number of items per page (0 = all)
        example: 25
        in: query
        name: pageSize
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - allowEmptyValue: false
        description: Specific fields to include in response
        in: query
        name: responseFields
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        description: Response groups for selective field inclusion
        in: query
        name: responseGroups
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        description: Sort field and direction
        example: adminName asc
        in: query
        name: sortBy
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        description: Starting index for pagination
        example: 0
        in: query
        name: startIndex
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - in: header
        name: x-vol-site
        required: false
        schema:
          format: int32
          type: integer
      - in: header
        name: x-vol-tenant
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/FulfillmentAPIAttributeCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentAPIAttributeCollection'
            application/xml:
              schema:
                $ref: '#/components/schemas/FulfillmentAPIAttributeCollection'
          description: Successfully retrieved attributes
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - insufficient permissions (requires Order Read or Order Ship)
        '404':
          description: Not Found
        '500':
          description: Internal server error
      summary: Get shipment attribute definitions
      tags:
      - ShipmentAttributeDefinition
      operationId: getCommerceShipmentsAttributedefinitionAttributes
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/shipments/attributedefinition/items/attributes:
    get:
      deprecated: false
      description: Retrieves shipment line item attribute definitions with optional filtering and pagination. Requires Order Read or Order Ship permissions.
      parameters:
