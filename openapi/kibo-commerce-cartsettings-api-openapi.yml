openapi: 3.2.0
info:
  title: Kibo Commerce Cart Settings API
  version: '1.0'
  description: 'Operations tagged CartSettings across 2 of this provider''s published API definitions: openapi_openapi_settings.json, kibo-commerce-settings-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: CartSettings
paths:
  /commerce/settings/cart/cartsettings:
    get:
      description: Retrieves existing cart settings.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSettings'
            text/json:
              schema:
                $ref: '#/components/schemas/CartSettings'
            text/plain:
              schema:
                $ref: '#/components/schemas/CartSettings'
          description: OK
      summary: Get Cart Settings
      tags:
      - CartSettings
      operationId: getCommerceSettingsCartCartsettings
      x-operation-id-source: derived
    post:
      description: Creates new cart settings. If enabling the Handling Fee, note that doing so does not display handling fees as line items in your storefront's checkout page. Rather, it simply includes the cost of the handling fees in the total. To display handling fees as line items in the checkout page, ask your theme developer to make the necessary changes.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartSettings'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSettings'
            text/json:
              schema:
                $ref: '#/components/schemas/CartSettings'
            text/plain:
              schema:
                $ref: '#/components/schemas/CartSettings'
          description: OK
      summary: Create Cart Settings
      tags:
      - CartSettings
      operationId: postCommerceSettingsCartCartsettings
      x-operation-id-source: derived
    put:
      description: Modifies existing cart settings. If enabling the Handling Fee, note that doing so does not display handling fees as line items in your storefront's checkout page. Rather, it simply includes the cost of the handling fees in the total. To display handling fees as line items in the checkout page, ask your theme developer to make the necessary changes.
      parameters:
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartSettings'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSettings'
            text/json:
              schema:
                $ref: '#/components/schemas/CartSettings'
            text/plain:
              schema:
                $ref: '#/components/schemas/CartSettings'
          description: OK
      summary: Update Cart Settings
      tags:
      - CartSettings
      operationId: putCommerceSettingsCartCartsettings
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
components:
  schemas:
    CartSettings:
      description: Cart settings defined for this site.
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        enableHandlingFee:
          type: boolean
        reserveCartInventoryInterval:
          description: Specifies the amount of time to reserve inventory in cart
          format: int32
          type:
          - integer
          - 'null'
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_settings.json
- kibo-commerce-settings-openapi.yml
