components:
  schemas:
    SynonymDefinitionCollection:
      description: Non-paged collection of all synonyms for a Site-Locale. Used for bulk operations
      properties:
        localeCode:
          description: The locale code to which this definition applies
          type:
          - string
          - 'null'
        siteId:
          description: Read-only  Site Id
          format: int32
          type: integer
        synonymDefinitions:
          description: List of mappings for this definition
          items:
            $ref: '#/components/schemas/SynonymDefinition'
          type:
          - array
          - 'null'
        tenantId:
          description: Read-only TenantId
          format: int32
          type: integer
      type: object
    SynonymDefinition:
      properties:
        key:
          description: If key is defined then map is directed
          type:
          - string
          - 'null'
        synonymId:
          description: The unique identifier for the synonym definition
          format: int32
          type:
          - integer
          - 'null'
        synonyms:
          description: List of synonyms.  If no key is defined the matches are bidirectional
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    SynonymDefinitionPagedCollection:
      description: Paged collection of synonyms for a Site-Locale.
      properties:
        items:
          items:
            $ref: '#/components/schemas/SynonymDefinition'
          type:
          - array
          - 'null'
        pageCount:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        startIndex:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_catalog_admin.json
- kibo-commerce-catalog-admin-openapi.yml
