        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get Workflow Process By Shipment Type Location Code
      tags:
      - WorkflowProcess
      operationId: getCommerceProcessesShipmentTypeByShipmentTypeLocationByLocationCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/processes/shipmentType/{shipmentType}/locationGroup/{locationGroupCode}:
    get:
      deprecated: false
      description: Get workflow process details by shipment type and location group code.
      parameters:
      - description: locationGroupCode
