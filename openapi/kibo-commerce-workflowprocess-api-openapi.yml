        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EntityModelOfWorkflowProcess'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelOfWorkflowProcess'
            application/xml:
              schema:
                $ref: '#/components/schemas/EntityModelOfWorkflowProcess'
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
