openapi: 3.2.0
info:
  title: Kibo Commerce Inventory Location API
  version: '1.0'
  description: 'Operations tagged InventoryLocation across 2 of this provider''s published API definitions: openapi_openapi_inventory.json, kibo-commerce-inventory-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: InventoryLocation
paths:
  /commerce/inventory/v1/location/{locationCode}:
    get:
      description: Get Locations
      parameters:
      - description: Location Code of the location to get
        in: path
        name: locationCode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LocationResponse'
                type: array
          description: Success
        '404':
          description: Location Not Found
      summary: Get Location
      tags:
      - InventoryLocation
      operationId: getCommerceInventoryV1LocationByLocationCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/inventory/v1/location/{locationGroupCode}:
    get:
      description: Get LocationGroups
      parameters:
      - description: Location Group Code of the location to get
        in: path
        name: locationGroupCode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LocationGroupResponse'
                type: array
          description: Success
        '404':
          description: Location Not Found
      summary: Get Location Groups
      tags:
      - InventoryLocation
      operationId: getCommerceInventoryV1LocationByLocationGroupCode
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/inventory/v1/location:
    get:
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LocationResponse'
                type: array
          description: Success
        '400':
          description: Bad Request
      summary: Get Locations
      tags:
      - InventoryLocation
      operationId: getCommerceInventoryV1Location
      x-operation-id-source: derived
    post:
      parameters: []
      requestBody:
        $ref: '#/components/requestBodies/LocationRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LocationResponse'
                type: array
          description: Success
        '400':
          description: Bad Request
      summary: Save Location
      tags:
      - InventoryLocation
      operationId: postCommerceInventoryV1Location
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
