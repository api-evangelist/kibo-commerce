        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
            text/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
            text/plain:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: OK
      summary: Get Import Job
      tags:
      - Import
      operationId: getPlatformDataImportById
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
