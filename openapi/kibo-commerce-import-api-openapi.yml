      x-operation-id-source: derived
    get:
      description: Retrieves an import job by ID. For detailed usage, file format specifications, and field references, see the Import/Export API Overview.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
