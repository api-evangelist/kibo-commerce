  /platform/data/import:
    get:
      description: Retrieves a list of all import jobs. For detailed usage, file format specifications, and field references, see the Import/Export API Overview.
      parameters:
      - in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: pageSize
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: filter
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ImportJob'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/ImportJob'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/ImportJob'
                type: array
          description: OK
      summary: Get Import Jobs
      tags:
      - Import
      operationId: getPlatformDataImport
      x-operation-id-source: derived
    post:
      description: Creates a new import job. For detailed usage, file format specifications, and field references, see the Import/Export API Overview.
      parameters:
      - description: limits which fields are returned in the response body
