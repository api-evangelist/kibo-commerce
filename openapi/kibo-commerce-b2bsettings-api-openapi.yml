components:
  schemas:
    RingFenceScopeSettings:
      properties:
        locationGroupCode:
          type:
          - string
          - 'null'
        scope:
          type:
          - string
          - 'null'
      type: object
    B2BSettings:
      properties:
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
        blanketOrderSettings:
          $ref: '#/components/schemas/BlanketOrderSettings'
        callOffOrderSettings:
          $ref: '#/components/schemas/CallOffOrderSettings'
        orchestratorSettings:
          $ref: '#/components/schemas/OrchestratorSettings'
      type: object
    CallOffOrderSettings:
      properties:
        releaseJob:
          $ref: '#/components/schemas/RulesEngineJobSettings'
      type: object
    RulesEngineJobSettings:
      properties:
        interval:
          format: int32
          type: integer
        intervalUnit:
          type:
          - string
          - 'null'
        isEnabled:
          type: boolean
      type: object
    AllocationRebalancerSettings:
      properties:
        backorderAllocations:
          $ref: '#/components/schemas/RebalancerAllocationSettings'
        isEnabled:
          type: boolean
      type: object
    RebalancerAllocationSettings:
      properties:
        allowPartialRelease:
          type: boolean
        partialReleaseType:
          type:
          - string
          - 'null'
        useCurrentInventory:
          type: boolean
        useFutureBeforeCurrent:
          type: boolean
      type: object
    AuditInfo:
      properties:
        createBy:
          type:
          - string
          - 'null'
        createDate:
          format: date-time
          type:
          - string
          - 'null'
        updateBy:
          type:
          - string
          - 'null'
        updateDate:
          format: date-time
          type:
          - string
          - 'null'
      type: object
    ReservationsJobSettings:
      properties:
        isEnabled:
          type: boolean
        useCurrentInventory:
          type: boolean
        useFutureBeforeCurrent:
          type: boolean
      type: object
    OrchestratorSettings:
      properties:
        allocationRebalancer:
          $ref: '#/components/schemas/AllocationRebalancerSettings'
        interval:
          format: int32
          type:
          - integer
          - 'null'
        intervalUnit:
          type:
          - string
          - 'null'
        reservationRebalancer:
          $ref: '#/components/schemas/ReservationRebalancerSettings'
        reservationsJob:
          $ref: '#/components/schemas/ReservationsJobSettings'
        runMode:
          type:
          - string
          - 'null'
      type: object
    ReservationRebalancerSettings:
      properties:
        isEnabled:
          type: boolean
        shipDateBufferDays:
          format: int32
          type:
          - integer
          - 'null'
      type: object
    BlanketOrderSettings:
      properties:
        ringFenceScope:
          $ref: '#/components/schemas/RingFenceScopeSettings'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
x-refined-from:
- openapi_openapi_settings.json
- kibo-commerce-settings-openapi.yml
