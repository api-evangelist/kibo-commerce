openapi: 3.2.0
info:
  title: Kibo Commerce Product Search API
  version: '1.0'
  description: 'Operations tagged ProductSearch across 2 of this provider''s published API definitions: openapi_openapi_catalog_storefront.json, kibo-commerce-catalog-storefront-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Kibo Base URL
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: https://t1000000.sb.usc1.gcp.kibocommerce.com
      description: Base URL
security:
- bearerAuth: []
tags:
- name: Product Search
paths:
  /commerce/catalog/storefront/productsearch/suggest:
    get:
      description: Suggests possible search terms as the shopper enters search text. In Unified Commerce, a Suggest2 API exists that returns results based on the returnFields option defined in the search settings. The same request structure and response as documented here is supported by both the /suggest and /suggest2 API endpoints, so either one can be used for this purpose with the same data.
      parameters:
      - description: Comma delimited list of suggestion groups that should be returned. The default is everything
        in: query
        name: query
        schema:
          type: string
      - description: ''
        in: query
        name: groups
        schema:
          type: string
      - description: Indicates the maximum number of entities to return from a query. The default value is 10 and the maximum value is 200. Optional.
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - in: query
        name: mid
        schema:
          type: string
      - in: query
        name: filter
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuggestionResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SearchSuggestionResult'
            text/plain:
              schema:
                $ref: '#/components/schemas/SearchSuggestionResult'
          description: OK
      summary: Get Suggested Search Terms
      tags:
      - Product Search
      operationId: getCommerceCatalogStorefrontProductsearchSuggest
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/productsearch/randomAccessCursor:
    get:
      description: Generate a list of cursors that then allows you to retrieve all products with efficient deep paging.\r\n\t\t\tOptionally provide a query and/or filter to generate a cursor for a subset of products.\r\n\t\t\tAfter retrieving the cursor, provide a cursorMark to the cursorMark argument of the /search or /getProducts operations.\r\n\t\t\tYou may provide cursorMarks in any order or even in parallel operations.
      parameters:
      - description: Optional terms to search on. Only matching products will be included in the cursor.
        in: query
        name: query
        schema:
          type: string
      - description: Optional set of filter expressions to filter on. Only matching products will be included in the cursor.
        in: query
        name: filter
        schema:
          type: string
      - description: ''
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchRandomAccessCursor'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductSearchRandomAccessCursor'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductSearchRandomAccessCursor'
          description: OK
      summary: Gets Random Access Cursors
      tags:
      - Product Search
      operationId: getCommerceCatalogStorefrontProductsearchRandomAccessCursor
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/productsearch/suggest2:
    get:
      description: Suggests possible search terms as the shopper enters search text. In Unified Commerce, a Suggest2 API exists that returns results based on the returnFields option defined in the search settings. The same request structure and response as documented here is supported by both the /suggest and /suggest2 API endpoints, so either one can be used for this purpose with the same data.
      parameters:
      - description: Comma delimited list of suggestion groups that should be returned. The default is everything
        in: query
        name: query
        schema:
          type: string
      - in: query
        name: groups
        schema:
          type: string
      - description: Indicates the maximum number of entities to return from a query. The default value is 10 and the maximum value is 200. Optional.
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - in: query
        name: searchSettingsName
        schema:
          type: string
      - in: query
        name: mid
        schema:
          type: string
      - in: query
        name: filter
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuggestionResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SearchSuggestionResult'
            text/plain:
              schema:
                $ref: '#/components/schemas/SearchSuggestionResult'
          description: OK
      summary: Gets Suggested Search Terms 2
      tags:
      - Product Search
      operationId: getCommerceCatalogStorefrontProductsearchSuggest2
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/productsearch/searchDebug:
    get:
      description: Searches the items displayed on the storefront for products or product options that the shopper types in a search query. Used for debugging.
      parameters:
      - description: The terms to search on.
        in: query
        name: query
        schema:
          type: string
      - description: 'A set of filter expressions representing the search parameters for a query: eq=equals, ne=not equals, gt=greater than, lt = less than or equals, gt = greater than or equals, lt = less than or equals, sw = starts with, or cont = contains. Optional.'
        in: query
        name: filter
        schema:
          type: string
      - description: 'The template to use for what facets to compute. ex: categoryId:id'
        in: query
        name: facetTemplate
        schema:
          type: string
      - description: 'If you only want to return a subset of the facets defined in the template. ex: category,price,rating'
        in: query
        name: facetTemplateSubset
        schema:
          type: string
      - description: 'Fields to facet on in addition to the optionally provided facetTemplate. ex: category,price,rating'
        in: query
        name: facet
        schema:
          type: string
      - description: 'Facet field range. ex: field:[val+TO+val] can also label'
        in: query
        name: facetFieldRangeQuery
        schema:
          type: string
      - description: 'Facet hierarchy prefix. Skip these levels on a hierarchical facet. ex: field:foo/bar/bing'
        in: query
        name: facetHierPrefix
        schema:
          type: string
      - description: 'Find the node to start with given a unique lookup value, instead of requiring a prefix path. ex: field:bing'
        in: query
        name: facetHierValue
        schema:
          type: string
      - description: 'Facet hierarchy depth. Number of levels to return. ex: category:1'
        in: query
        name: facetHierDepth
        schema:
          type: string
      - description: Facet offset
        in: query
        name: facetStartIndex
        schema:
          type: string
      - description: Facet page size
        in: query
        name: facetPageSize
        schema:
          type: string
      - description: Deprecated
        in: query
        name: facetSettings
        schema:
          type: string
      - description: 'Apply facet values as a filter. ex: category:3,price:[* TO 100]'
        in: query
        name: facetValueFilter
        schema:
          type: string
      - description: The element to sort the results by and the order in which the results appear. Either ascending (a-z) or descending (z-a) order. Optional.
        in: query
        name: sortBy
        schema:
          type: string
      - description: Whether to slice results or not
        in: query
        name: sliceSearchResults
        schema:
          default: false
          type: boolean
      - description: Used to page results from a query. Indicates the maximum number of entities to return from a query. The default value is 12 and the maximum value is 200. Optional.
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: Used to page results from a query. Indicates the zero-based offset in the complete result set where the returned entities begin. The default value is 0. Optional.
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - description: The name of a SiteSearchSettings (search relevancy settings) scheme to use. Defaults to whichever Settings is marked as IsDefault=true.
        in: query
        name: searchSettings
        schema:
          type: string
      - description: Use search-tuning-rules or not
        in: query
        name: enableSearchTuningRules
        schema:
          default: true
          type: boolean
      - description: The filters which the search tuning rules will match on.
        in: query
        name: searchTuningRuleContext
        schema:
          type: string
      - description: Search-Tuning-Rule Code
        in: query
        name: searchTuningRuleCode
        schema:
          type: string
      - description: 'A list of property groups to return instead of using the granular responseFields param. ex: categories,properties,options'
        in: query
        name: responseGroups
        schema:
          type: string
      - description: ''
        in: query
        name: facetTemplateExclude
        schema:
          type: string
      - description: ''
        in: query
        name: facetPrefix
        schema:
          type: string
      - description: ''
        in: query
        name: responseOptions
        schema:
          type: string
      - description: Pass in * to begin a deep page operation. The response will include a nextCursorMark value. Pass this into the next call. Continue with this pattern until nextCursorMark is null.
        in: query
        name: cursorMark
        schema:
          type: string
      - description: ''
        in: query
        name: facetValueSort
        schema:
          type: string
      - description: Only respond with the request made to the search-engine, for one "groups" parameter value. Default is false. Optional parameter.
        in: query
        name: returnUrl
        schema:
          default: false
          type: boolean
      - description: Personalization Id (Monetate Id)
        in: query
        name: mid
        schema:
          type: string
      - description: ''
        in: query
        name: omitNamespace
        schema:
          type: boolean
      - description: ''
        in: query
        name: campaignId
        schema:
          type: string
      - description: Optional. Use a specific search-merchandizing-rule code if provided.
        in: query
        name: merchandizingRuleCode
        schema:
          type: string
      - description: ''
        in: query
        name: responseFields
        schema:
          type: string
      - in: query
        name: rows
        schema:
          format: int32
          type: integer
      - in: query
        name: start
        schema:
          format: int32
          type: integer
      - description: optional alternative to query for debugging tools
        in: query
        name: q
        schema:
          type: string
      - in: query
        name: collapse
        schema:
          default: true
          type: boolean
      responses:
        '200':
          description: OK
      summary: Search Debug
      tags:
      - Product Search
      operationId: getCommerceCatalogStorefrontProductsearchSearchDebug
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/productsearch/search:
    get:
      description: Searches the categories displayed on the storefront for products or product options that the shopper types in a search query.
      parameters:
      - description: The terms to search on.
        in: query
        name: query
        schema:
          type: string
      - in: query
        name: collapse
        schema:
          default: true
          type: boolean
      - description: 'A set of filter expressions representing the search parameters for a query: eq=equals, ne=not equals, gt=greater than, lt = less than or equals, gt = greater than or equals, lt = less than or equals, sw = starts with, or cont = contains. Optional.'
        in: query
        name: filter
        schema:
          type: string
      - in: query
        name: facetTemplate
        schema:
          type: string
      - in: query
        name: facetTemplateSubset
        schema:
          type: string
      - in: query
        name: facet
        schema:
          type: string
      - in: query
        name: facetFieldRangeQuery
        schema:
          type: string
      - in: query
        name: facetHierPrefix
        schema:
          type: string
      - in: query
        name: facetHierValue
        schema:
          type: string
      - in: query
        name: facetHierDepth
        schema:
          type: string
      - in: query
        name: facetStartIndex
        schema:
          type: string
      - in: query
        name: facetPageSize
        schema:
          type: string
      - in: query
        name: facetSettings
        schema:
          type: string
      - in: query
        name: facetValueFilter
        schema:
          type: string
      - description: The element to sort the results by and the order in which the results appear. Either ascending (a-z) or descending (z-a) order. Optional.
        in: query
        name: sortBy
        schema:
          type: string
      - description: Used to page results from a query. Indicates the maximum number of entities to return from a query. The default value is 12 and the maximum value is 200. Optional.
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: Used to page results from a query. Indicates the zero-based offset in the complete result set where the returned entities begin. The default value is 0. Optional.
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: searchSettings
        schema:
          type: string
      - in: query
        name: enableSearchTuningRules
        schema:
          default: true
          type: boolean
      - in: query
        name: searchTuningRuleContext
        schema:
          type: string
      - in: query
        name: searchTuningRuleCode
        schema:
          type: string
      - in: query
        name: responseGroups
        schema:
          type: string
      - in: query
        name: facetTemplateExclude
        schema:
          type: string
      - in: query
        name: facetPrefix
        schema:
          type: string
      - in: query
        name: responseOptions
        schema:
          type: string
      - description: Pass in * to begin a deep page operation. The response will include a nextCursorMark value. Pass this into the next call. Continue with this pattern until nextCursorMark is null.
        in: query
        name: cursorMark
        schema:
          type: string
      - in: query
        name: facetValueSort
        schema:
          type: string
      - in: query
        name: defaultSort
        schema:
          type: string
      - in: query
        name: shouldSlice
        schema:
          type: boolean
      - in: query
        name: mid
        schema:
          type: string
      - in: query
        name: omitNamespace
        schema:
          type: boolean
      - description: Optional. If true return all images instead of default images.
        in: query
        name: includeAllImages
        schema:
          default: false
          type: boolean
      - in: query
        name: spellcorrectOverride
        schema:
          default: Default
          type: string
      - in: query
        name: useSubscriptionPricing
        schema:
          default: false
          type: boolean
      - description: Optional. Use a specific search-merchandizing-rule code if provided.
        in: query
        name: merchandizingRuleCode
        schema:
          type: string
      - in: query
        name: customerSegments
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'
          description: OK
      summary: Search Products
      tags:
      - Product Search
      operationId: getCommerceCatalogStorefrontProductsearchSearch
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/productsearch/suggestdebug:
    get:
      description: Comma delimited list of suggestion groups that should be returned. The default is everything. e.g. categories, products.
      parameters:
      - description: Comma delimited list of suggestion groups that should be returned. The default is everything. e.g. categories, products
        in: query
        name: groups
        schema:
          type: string
      - description: The terms to search on.
        in: query
        name: query
        schema:
          type: string
      - description: Indicates the maximum number of entities to return from a query. The default value is 10 and the maximum value is 200. Optional.
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: Specific Search Configuration. Optional parameter
        in: query
        name: searchSettingsName
        schema:
          type: string
      - description: Session Id. Optional parameter
        in: query
        name: mid
        schema:
          type: string
      - description: ''
        in: query
        name: filter
        schema:
          type: string
      - description: Used to debug with a specific campaign. Optional parameter
        in: query
        name: campaignId
        schema:
          type: string
      - description: Only respond with the request made to the search-engine, for one "groups" parameter value. Default is false. Optional parameter.
        in: query
        name: returnUrl
        schema:
          default: false
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Search Suggestion Debug
      tags:
      - Product Search
      operationId: getCommerceCatalogStorefrontProductsearchSuggestdebug
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/productsearch/siteSearch:
    get:
      description: Searches the items displayed on the storefront.
      parameters:
      - description: The terms to search on.
        in: query
        name: query
        schema:
          type: string
      - in: query
        name: collapse
        schema:
          default: true
          type: boolean
      - description: 'A set of filter expressions representing the search parameters for a query: eq=equals, ne=not equals, gt=greater than, lt = less than or equals, gt = greater than or equals, lt = less than or equals, sw = starts with, or cont = contains. Optional.'
        in: query
        name: filter
        schema:
          type: string
      - description: Identifier of the current category, in the format of either categoryCode:{categoryCode}  or categoryId:{categoryId}. In the example of no category being selected, the root will be used instead. Refer to the corresponding <a href="api-reference/facets/get-facet-category-list">Catalog Admin</a> call.
        in: query
        name: facetTemplate
        schema:
          type: string
      - description: Use if you only want to return a subset of the facets defined in the template such has category, price, rating.
        in: query
        name: facetTemplateSubset
        schema:
          type: string
      - description: The additional facets to use (comma delimited) that are not already defined in the facet template  in the Product Admin API.
        in: query
        name: facet
        schema:
          type: string
      - in: query
        name: facetFieldRangeQuery
        schema:
          type: string
      - description: Allows you to skip these levels on a hierarchical facet.
        in: query
        name: facetHierPrefix
        schema:
          type: string
      - description: The current level to pull categories from, in the format of categoryId:{categoryId}.
        in: query
        name: facetHierValue
        schema:
          type: string
      - description: The number of levels to return such as category:1.
        in: query
        name: facetHierDepth
        schema:
          type: string
      - in: query
        name: facetStartIndex
        schema:
          type: string
      - in: query
        name: facetPageSize
        schema:
          type: string
      - description: May be deprecated.
        in: query
        name: facetSettings
        schema:
          type: string
      - description: A comma delimited list of applied facetsValues (such as tenant~brand-name-attribute%3abroil+king).  If the facet is part of the search results facet template as a “range” display style, then you can  specify a min and max that doesn't have to match the predefined ranges (such as &facetValueFilter=price:[38 to 105]).
        in: query
        name: facetValueFilter
        schema:
          type: string
      - description: The element to sort the results by and the order in which the results appear. Either ascending (a-z) or descending (z-a) order. Optional.
        in: query
        name: sortBy
        schema:
          type: string
      - description: Used to page results from a query. Indicates the maximum number of entities to return from a query. The default value is 12 and the maximum value is 200. Optional.
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: Used to page results from a query. Indicates the zero-based offset in the complete result set where the returned entities begin. The default value is 0. Optional.
        in: query
        name: startIndex
        schema:
          default: 0
          format: int32
          type: integer
      - description: Use this to override search settings for testing purposes in the format of &searchSettings=testConfig1.
        in: query
        name: searchSettings
        schema:
          type: string
      - description: Whether or not to enable search tuning rules.
        in: query
        name: enableSearchTuningRules
        schema:
          default: true
          type: boolean
      - description: Deprecated or internal-only, do not use.
        in: query
        name: searchTuningRuleContext
        schema:
          type: string
      - description: Deprecated or internal-only, do not use.
        in: query
        name: searchTuningRuleCode
        schema:
          type: string
      - description: Deprecated or internal-only, do not use.
        in: query
        name: responseGroups
        schema:
          type: string
      - in: query
        name: facetTemplateExclude
        schema:
          type: string
      - in: query
        name: facetPrefix
        schema:
          type: string
      - description: Deprecated or internal-only, do not use.
        in: query
        name: responseOptions
        schema:
          type: string
      - description: Pass in * to begin a deep page operation. The response will include a nextCursorMark value. Pass this into the next call. Continue with this pattern until nextCursorMark is null.
        in: query
        name: cursorMark
        schema:
          type: string
      - description: Sorts the values array in a facet. Valid values are Count,Index, CountAscending, CountDescending,  ValuesAscending, ValuesDescending, AttributeDefinition, and AttributeDefinitionDescending.
        in: query
        name: facetValueSort
        schema:
          type: string
      - description: Deprecated or internal-only, do not use.
        in: query
        name: defaultSort
        schema:
          type: string
      - description: Whether or not to slice products.
        in: query
        name: shouldSlice
        schema:
          type: boolean
      - description: This is the customer identifier for personalization. This value can be found in the Monetate  cookie (mt.v) that is uniquely set for each visitor so that personalization of the search results  can use all Monetate functionality.
        in: query
        name: mid
        schema:
          type: string
      - description: 'Explicitly request any field or attribute you want in the response.  Only product codes are returned by default. Some common values include productName, priceL (price low), priceH (price high),  product attribute by name, product image URLs, product category names, category IDs and codes,  product short/long descriptions, and score (the relevancy score). '
        in: query
        name: fieldList
        schema:
          type: string
      - description: Allows you to drop the tenant~ or similar prefix.
        in: query
        name: omitNamespace
        schema:
          type: boolean
      - description: Optional. If true return all images instead of default images.
        in: query
        name: includeAllImages
        schema:
          default: false
          type: boolean
      - description: Valid values are Default, SkipAutocorrect, SkipDidyoumean, and SkipAll.
        in: query
        name: spellcorrectOverride
        schema:
          default: Default
          type: string
      - description: Whether or not to use subscription pricing instead of the default product pricing.
        in: query
        name: useSubscriptionPricing
        schema:
          default: false
          type: boolean
      - description: Optional. Use a specific search-merchandizing-rule code if provided.
        in: query
        name: merchandizingRuleCode
        schema:
          type: string
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'
          description: OK
      summary: Site Search
      tags:
      - Product Search
      operationId: getCommerceCatalogStorefrontProductsearchSiteSearch
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/catalog/storefront/productsearch/visualsearch:
    get:
      description: Searches the items displayed on the storefront.
      parameters:
      - in: query
        name: SearchTerm
        required: true
        schema:
          minLength: 2
          type: string
      - in: query
        name: Filters
        schema:
          items:
            $ref: '#/components/schemas/RequestFilter'
          type: array
      - in: query
        name: Returnfields
        schema:
          items:
            type: string
          type: array
      - in: query
        name: Searchfields
        schema:
          items:
            type: string
          type: array
      - in: query
        name: Ignoregrouping
        schema:
          type: boolean
      - in: query
        name: NumResults
        schema:
          format: int32
          maximum: 10000
          minimum: 1
          type: integer
      - in: query
        name: PageNumber
        schema:
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
      - in: query
        name: ApplicationId
        schema:
          maxLength: 50
          minLength: 1
          type: string
      - in: query
        name: CatalogId
        schema:
          maxLength: 50
          minLength: 1
          type: string
      - in: query
        name: SessionId
        schema:
          maxLength: 100
          type: string
      - in: query
        name: TrackingId
        schema:
          maxLength: 100
          type: string
      - in: query
        name: ApiKey
        schema:
          type: string
      - in: query
        name: Revision
        schema:
          type: string
      - in: query
        name: Cip
        schema:
          type: string
      - in: query
        name: DisplayDebug
        schema:
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/VisualSearchResult'
            text/plain:
              schema:
                $ref: '#/components/schemas/VisualSearchResult'
          description: OK
      summary: Type Ahead Search
      tags:
      - Product Search
      operationId: getCommerceCatalogStorefrontProductsearchVisualsearch
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
