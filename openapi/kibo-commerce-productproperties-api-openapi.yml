components:
  schemas:
    ProductPropertyValueLocalizedContent:
      description: Attribute Value Localized Resource
      properties:
        localeCode:
          description: Language used for the string attribute value.
          type:
          - string
          - 'null'
        stringValue:
          description: Localized Value in the language of the locale code
          type:
          - string
          - 'null'
      type: object
    CatalogAdminsProductProperty:
      description: "Product options for configurable or stand-alone products. A configurable option is one that the shopper chooses when ordering, for example, \nthe color of a T-shirt. A stand-alone option is independent of the product and can be added to the product order. For example, a monogram."
      properties:
        attributeFQN:
          description: Unique identifier of the Attribute.
          type:
          - string
          - 'null'
        forceOrder:
          type:
          - boolean
          - 'null'
        values:
          items:
            $ref: '#/components/schemas/CatalogAdminsProductPropertyValue'
          type:
          - array
          - 'null'
      type: object
    CatalogAdminsProductPropertyValue:
      description: A value of a product option for this product. For example, a computer product may have an option called "Memory" that can have the values "6GB,"8GB," and "12GB."
      properties:
        attributeVocabularyValueDetail:
          $ref: '#/components/schemas/CatalogAdminsAttributeVocabularyValue'
        content:
          $ref: '#/components/schemas/ProductPropertyValueLocalizedContent'
        localizedContent:
          items:
            $ref: '#/components/schemas/ProductPropertyValueLocalizedContent'
          type:
          - array
          - 'null'
        value: {}
      type: object
    AttributeVocabularyValueLocalizedContent:
      description: Attribute Value Localized Resource
      properties:
        localeCode:
          description: Language used for the string attribute value. Currently, only en_US is supported.
          type:
          - string
          - 'null'
        stringValue:
          description: Localized Value in the language of the locale code
          minLength: 1
          type: string
      type: object
    CatalogAdminsAttributeVocabularyValue:
      description: Value of an attribute
      properties:
        content:
          $ref: '#/components/schemas/AttributeVocabularyValueLocalizedContent'
        displayOrder:
          description: The order in which the attribute value displays. If you omit a value for this property, Mozu infers the display order from the attribute value's position the list.
          format: int32
          type:
          - integer
          - 'null'
        localizedContent:
          description: The Content of an attribute value. This content is in multiple locals supported by the master catalog and is only valid for String DataType.
          items:
            $ref: '#/components/schemas/AttributeVocabularyValueLocalizedContent'
          type:
          - array
          - 'null'
        mappedGenericValues:
          description: "The actual values of the related generic attribute. This value must match the datatype of the attribute and already exist \nwithin the Vocabulary values of the related ValueMappingAttribute. Only supporting string at this time."
          items: {}
          maxItems: 200
          type:
          - array
          - 'null'
        productName:
          description: The ProductName when the Attribute DataType is ProductCode.
          type:
          - string
          - 'null'
        value:
          description: "The actual value of the attribute vocabulary. This value must be unique within the vocabulary for a single attribute and match the datatype of the attribute. \nString data type requires a canonical value here or one will be system generated if null. The actual string content displayed to users should be stored as Content. \nString values require content to be present.\nOnce this value is set it cannot be changed."
          maxLength: 50
          pattern: ^[A-Za-z0-9-_\.()]*[A-Za-z0-9-_()]
        valueSequence:
          description: Read only System generated monotonically increasing unique sequence.
          format: int32
          type:
          - integer
          - 'null'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      type: http
