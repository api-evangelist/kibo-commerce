          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get Customer Survey
      tags:
      - CustomerSurvey
      operationId: getCommerceShipmentsSurveysById
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
  /commerce/shipments/{shipmentNumber}/surveys:
    get:
      deprecated: false
      description: Get the customer surveys of a shipment.
      parameters:
      - description: shipmentNumber
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/CollectionModelOfEntityModelOfCustomerSurvey'
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModelOfEntityModelOfCustomerSurvey'
            application/xml:
              schema:
                $ref: '#/components/schemas/CollectionModelOfEntityModelOfCustomerSurvey'
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get Surveys
      tags:
      - CustomerSurvey
      operationId: getCommerceShipmentsByShipmentNumberSurveys
      x-operation-id-source: derived
    post:
      deprecated: false
      description: Create a customer survey for a shipment.
      parameters:
      - description: shipmentNumber
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSurvey'
        description: customerSurveyDto
        required: true
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EntityModelOfCustomerSurvey'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelOfCustomerSurvey'
            application/xml:
              schema:
                $ref: '#/components/schemas/EntityModelOfCustomerSurvey'
          description: OK
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Create Survey
      tags:
      - CustomerSurvey
      x-codegen-request-body-name: customerSurveyDto
      operationId: postCommerceShipmentsByShipmentNumberSurveys
      x-operation-id-source: derived
    servers:
    - description: Kibo Base URL
      url: '{baseUrl}/api'
      variables:
        baseUrl:
          default: https://t1000000.sb.usc1.gcp.kibocommerce.com
          description: Base URL
