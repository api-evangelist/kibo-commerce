components:
  schemas:
    HttpMethod:
      properties:
        method:
          type:
          - string
          - 'null'
      type: object
    DocumentCopyMessage:
      properties:
        documentId:
          type:
          - string
          - 'null'
        documentName:
          type:
          - string
          - 'null'
        documentPublishSetCode:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        originalDocumentId:
          type:
          - string
          - 'null'
        success:
          type: boolean
      type: object
    DocumentCopyRequest:
      properties:
        destinationPath:
          description: The destination path to copy documents to
          type:
          - string
          - 'null'
        documentIds:
          description: Document Id's to copy
          items:
            type: string
          type:
          - array
          - 'null'
        updatedBy:
          type:
          - string
          - 'null'
      type: object
    KeyValuePair:
      properties:
        key:
          type:
          - string
          - 'null'
        value:
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    HttpVersionPolicy:
      enum:
      - 0
      - 1
      - 2
      format: int32
      type: integer
    Document:
      description: 'Container for schema-enforced and schemaless data. A document is primarily used to store content (html, text,

        numbers, dates, JSON, binary data) that is directly or indirectly used for the storefront website experience

        and may be addressed via the Hypr theming engine language. A document belongs to a documentList and has an

        underlying documentType.  The documentType describes any required and optional schema. Additionally, a binary

        object may be stored on the document''s content subresource and edge cached via the Mozu CDN.'
      properties:
        activeDateRange:
          $ref: '#/components/schemas/ActiveDateRange'
        contentLength:
          description: 'The size of the content subresource in decimal number of OCTETs.

            When updating the content subresource, the  contentLength is captured from the

            Content-Length header, if present, or is otherwise computed from the total size of the http body.'
          format: int64
          type:
          - integer
          - 'null'
        contentMimeType:
          description: 'The mime type of the document''s binary content, provided via the Content-Type header when updating the content

            subresource. If no value is provided then "application/octet-stream" is set by default.'
          type:
          - string
          - 'null'
        contentUpdateDate:
          description: 'The date and time the most recent content update was made via the content subresource. UTC date/time.

            System-supplied and read-only.'
          format: date-time
          type:
          - string
          - 'null'
        documentTypeFQN:
          description: 'The full name of the documentType that underlies this document.

            This field must be supplied upon document creation and cannot be updated.'
          type:
          - string
          - 'null'
