          description: OK
      summary: Delete Documents
      tags:
      - Documents
      operationId: deleteContentDocumentlistsByDocumentListNameDocuments
      x-operation-id-source: derived
    get:
      description: Get Documents. To search documents along a particular path, use the filter path such as in "folder1\folder2\". If no path is provided, then the query will be a global search as it searches from the root of the tree hierarchy.
      parameters:
      - description: ''
        in: path
        name: documentListName
        required: true
        schema:
          type: string
      - description: Mozu.Content.Contracts.PropertyType filter expression to match against document properties. <seealso cref="T:Mozu.Core.FilterParsing.FilterParser" />
        in: query
        name: filter
        schema:
          type: string
      - description: Sort expression.  <seealso cref="T:Mozu.Core.FilterParsing.SortParser" />
        in: query
        name: sortBy
        schema:
          type: string
      - description: Page size
        in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - description: First item in the page to return from the total result set
        in: query
        name: startIndex
        schema:
          format: int32
          type: integer
      - description: if this call should include a adocument that isn't active in the given preview date
        in: query
        name: includeInactive
        schema:
          type: boolean
      - description: path from which to return documents
        in: query
        name: path
        schema:
          type: string
      - description: if true this call will populate Subpaths
        in: query
        name: includeSubPaths
        schema:
          default: false
          type: boolean
      - description: "Determines if the path parameter is used to scope the query to the specified path or ignored for a global scope.\n            Defaults to specified path only. Valid values are: SpecifiedPathOnly, Global"
        in: query
        name: queryScope
        schema:
          default: SpecifiedPathOnly
          type: string
      - description: 'When `true`, performs an exhaustive search guaranteeing all matching documents are returned.

          Slower than the default on large lists. Returns HTTP 400 if the document list exceeds the configured

          maximum size threshold (default 100,000). Defaults to `false`, optimizing for speed.'
        in: query
        name: fullSearch
        schema:
          default: false
          type: boolean
      - description: limits which fields are returned in the response body
        in: query
        name: responseFields
        schema:
          type: string
